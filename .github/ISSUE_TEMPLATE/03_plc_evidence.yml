name: PLC 事实或原生格式 / PLC evidence
description: 提交针对具体 PLC 指令规则、软元件范围、型号适用性或原生工程文件格式的逆向/实测证据。
title: "[PLC] "
body:
  - type: markdown
    attributes:
      value: |
        本表单专用于反馈 PLC 指令语义、软元件编址规则、语法边界或原生工程文件（如 `.gxw`）二进制格式的证据与差异；普通软件界面或环境缺陷请使用“缺陷报告”表单。
        表单中涉及的型号或语言不代表本项目现已承诺全面支持。**请严格区分资料规则、静态推断、离线解析、编辑器打开、原生编译、仿真运行与真实硬件观察的证据层次**。
        切勿为了填写此表单而在生产运行中的工业设备上进行破坏性实测！涉及安全漏洞或越权隐患的问题，请按安全流程私下联系维护者。
  - type: textarea
    id: target
    attributes:
      label: 具体目标与软件版本 / Exact target and versions
      description: 未知项请填“未知”。请保留厂商编辑器菜单中的实际合并选项名称（如 Q03UDV、FX3U(C)），不要仅写笼统的“Q系列”或“FX系列”。
      placeholder: |
        当前项目 Git commit 或发布包版本：
        PLC 系列与具体型号（Series / Type，如 FX3U、Q03UDV、FX5U）：
        上位机软件代际与版本（如 GX Works2 1.635.0.1、GX Works3 等）：
        工程类型与语言（简单工程/结构化工程，Ladder/ST/FBD/SFC，或格式底层）：
    validations:
      required: true
  - type: textarea
    id: discrepancy
    attributes:
      label: 规则或行为差异 / Discrepancy
      description: 明确指出具体指令助记符、操作数类型、特殊寄存器（如 M8000、SM400）或工程对象；详细说明期望行为、实际观察结果及其判定依据。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小证据样例或观察记录 / Minimal example or observations
      description: 提供可公开的最小源码片段、IR 表达、十六进制操作序列或脱敏执行记录。无法公开原文件时请说明限制，切勿直接上传整套商业客户工程。
    validations:
      required: true
  - type: dropdown
    id: evidence_level
    attributes:
      label: 证据等级划分 / Evidence level
      multiple: true
      options:
        - 官方技术手册规则 / Official manual specification
        - 静态分析或 Mock 测试 / Static inspection or mocked execution
        - 本项目离线解析与保存 / Offline parse and serialization
        - 原生编辑器打开与保存 / Native editor open & save
        - 原生编译器编译与代码检查 / Native compilation & diagnostics
        - 仿真器观察与信号采样 / Simulation observation
        - 真实设备/硬件测试观察 / Physical hardware observation
        - 未经测试或理论推测 / Unverified or speculation
  - type: textarea
    id: source
    attributes:
      label: 资料来源及未验证边界 / Sources and limits
      description: 可选。官方手册名称、手册编号（如 SH-081085ENG）、修订版本、章节与页码；公开技术链接；以及本次观察中尚未测试的边界条件。切勿附带受版权保护的厂商商业 DLL 或完整扫描版手册。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前自检 / Before publishing
      options:
        - label: 我确认有权公开所附材料，并已彻底清除所有商业机密凭据、客户专有逻辑及无关个人隐私数据。 / I confirm the right to publish this evidence and have removed all credentials, proprietary client data, and sensitive information.
          required: true
