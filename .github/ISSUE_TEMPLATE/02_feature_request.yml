name: 功能建议 / Feature request
description: 提出工程使用场景、当前能力瓶颈或架构演进的可验证改进建议。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        中文或英文均可。请优先清晰描述实际面对的工程痛点与业务目标，不必预先设计全套底层实现。
        功能提案不代表维护者的即时支持承诺。切勿分享真实凭据、商业机密或未授权的客户工程文件。
        Requests are not commitments of immediate support. Do not share credentials, proprietary code, or confidential customer projects.
  - type: textarea
    id: problem
    attributes:
      label: 工程目标与现有局限 / Problem and engineering goal
      description: 您希望在何种自动化工程场景下达成什么目标？现有工具链或流程在何处受限？若已有相关 Issue，请附上引用链接。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望达成的可验证结果 / Desired outcome
      description: 描述清晰、客观、可验证的验收标准或输出形式（建议辅以最小工程示例或伪代码说明，而非仅描述 UI 按钮或宽泛的技术名词）。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 涉及的硬件与软件范围 / Relevant scope
      description: 可选。涉及的具体 PLC 系列/型号（如 FX3U、Q03UDV、FX5U）、软件代际（GX Developer、GX Works2、GX Works3）、编程语言（Ladder/ST/FBD/SFC）及入口（Web / MCP）。
  - type: textarea
    id: alternatives
    attributes:
      label: 现有临时方案与参考依据 / Alternatives and references
      description: 可选。说明当前在没有该功能时您是如何处理的；可引用公开的技术标准、手册章节（仅引用编号与标题），切勿直接上传厂商软件安装包、受版权保护的完整手册或商业客户工程。
