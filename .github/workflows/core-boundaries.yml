name: Python Core Boundaries

on:
  push:
    branches: [refactor/python-core-boundaries-20260919]
  pull_request:
    paths:
      - 'src/**'
      - 'web/**'
      - 'simulator_gateway/**'
      - 'hardware_reader/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/core-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-baseline:
    name: Full Python baseline and pinned test environment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0
          mkdir -p boundary-evidence/wheels
          python -m pip download -r requirements/web.txt PyQt6==6.11.0 pytest==9.1.1 olefile==0.47 jsonschema httpx -d boundary-evidence/wheels
          python -m pip install --no-index --find-links boundary-evidence/wheels -r requirements/web.txt PyQt6==6.11.0 pytest==9.1.1 olefile==0.47 jsonschema httpx
      - name: Record unchanged baseline (not an all-pass claim)
        run: |
          git rev-parse HEAD > boundary-evidence/commit.txt
          set +e
          python -m pytest -q --junitxml=boundary-evidence/baseline.xml > boundary-evidence/baseline.log 2>&1
          printf '%s\n' "$?" > boundary-evidence/baseline.exit
          cat boundary-evidence/baseline.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-core-boundary-test-baseline
          path: boundary-evidence/
          retention-days: 7
