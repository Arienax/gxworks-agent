name: Temporary Format Patch Validation
on:
  push:
    branches: [feat/comprehensive-runtime-diagnostics-20260914]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest numpy
      - name: Compile
        run: python -m compileall -q src/application/base.py src/application/format_patch_repair.py tests/test_format_patch_repair.py
      - name: Run focused format patch tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_format_patch_repair.py tests/test_rejected_generation_delivery.py tests/test_model_stream_cancellation.py
