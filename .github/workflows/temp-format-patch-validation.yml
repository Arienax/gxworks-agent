name: Temporary Format Patch Validation
on:
  push:
    branches: [feat/comprehensive-runtime-diagnostics-20260914]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -q pytest -r requirements/web.txt
      - name: Compile
        run: python -m compileall -q src/application/base.py src/application/format_patch_repair.py src/application/workbench.py src/api.py tests/test_format_patch_repair.py tests/test_repair_render_delivery.py
      - name: Run repair and delivery regressions
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_format_patch_repair.py \
            tests/test_repair_render_delivery.py \
            tests/test_user_confirmed_generation_repair.py \
            tests/test_generation_rejected_json_repair.py \
            tests/test_rejected_generation_delivery.py \
            tests/test_generation_workflow.py \
            tests/test_confirmed_generation_regressions_20260914.py \
            tests/test_model_stream_cancellation.py \
            tests/test_web_frontend_state_flow.py
      - name: Build web frontend
        working-directory: web
        run: |
          npm ci
          npm run build
