name: Opcode diagnostics validation

on:
  push:
    branches: [fix/prompt-context-slim-20260913]
    paths:
      - .github/workflows/opcode-diagnostics-validation-20260914.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt-context-slim-20260913
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply diagnostics patch
        run: python tools/_tmp_add_opcode_diagnostics_20260914.py
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements/web.txt
          python -m pip check
      - name: Run focused regressions
        run: |
          python -m compileall -q src tests
          python -m pytest -q \
            tests/test_runtime_diagnostics.py \
            tests/test_runtime_diagnostics_web.py \
            tests/test_generation_opcode_contract.py \
            tests/test_generation_fast_path.py \
            tests/test_application_job_errors.py
          git diff --check
      - name: Commit tested diagnostics change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plc_json_validator.py src/application/generation_repair.py src/runtime_diagnostics.py tests/test_runtime_diagnostics.py
          git commit -m "feat(diagnostics): capture rejected APP_INSTR opcode"
          git push origin HEAD:fix/prompt-context-slim-20260913
