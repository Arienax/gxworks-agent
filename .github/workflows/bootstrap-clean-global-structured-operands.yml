name: Bootstrap global structured operand cleanup

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
    paths: [.github/workflows/bootstrap-clean-global-structured-operands.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rejected-json-repair-20260913
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install builder dependencies
        run: python -m pip install pypdf pdfplumber pytest
      - name: Reparse globally audited malformed rows
        run: python tools/bootstrap_clean_global_structured_operand_audit.py
      - name: Run global structured operand audit
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          from collections import Counter

          spec = importlib.util.spec_from_file_location('operand_audit', 'tools/audit_structured_instruction_backfill.py')
          audit = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(audit)
          db = Path('resources/knowledge/fx3u_knowledge.sqlite')
          rows = audit._load_rows(db)
          selected = [row for row in rows.values() if row.get('operands_json')]
          con = audit._open_candidate(db)
          issues = []
          for row in selected:
              issues.extend(audit.audit_record(con, row))
          con.close()
          issues.extend(audit.cross_manual_issues(selected))
          print('AUDITED', len(selected))
          print('SEVERITY', dict(Counter(x['severity'] for x in issues)))
          print('CODES', dict(Counter(x['code'] for x in issues)))
          for item in issues:
              print(json.dumps(item, ensure_ascii=False, sort_keys=True))
          assert not [x for x in issues if x['severity'] == 'error']
          assert not [x for x in issues if x['code'] == 'operand_has_no_semantics']
          PY
          PYTHONPATH=src python -m pytest -q tests/test_instruction_applicability_rag.py
          python -m compileall -q src tools/build_fx3u_knowledge_v3.py tools/audit_structured_instruction_backfill.py
      - name: Commit branch-only cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-clean-global-structured-operands.yml tools/bootstrap_clean_global_structured_operand_audit.py
          git add resources/knowledge/fx3u_knowledge.sqlite resources/knowledge/manifest.json
          git commit -m "fix(rag): repair globally audited operand records"
          git push origin HEAD:fix/rejected-json-repair-20260913
