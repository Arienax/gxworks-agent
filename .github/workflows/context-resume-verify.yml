name: Context continuation source verification

on:
  pull_request:
    paths:
      - '.context-resume/**'
      - '.github/workflows/context-resume-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/prompt-cleanup-io-binding-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      HAYSTACK_TELEMETRY_ENABLED: 'false'
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact candidate and remove temporary transport
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path, PurePosixPath
          data = json.loads(Path('.context-resume/manifest.json').read_text())
          assert data['base_commit'] == 'd12ec053333a464cbfbfff3384bb119ee0c017d7'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == data['base_commit']
          for row in data['files']:
              name = row['path']
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == row['before'], name
              patch = Path(row['patch']).read_bytes()
              subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
              subprocess.run(['git', 'apply', '-'], input=patch, check=True)
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == row['after'], name
          subprocess.run(['git', 'rm', '-r', '--', '.context-resume', '.github/workflows/context-resume-verify.yml'], check=True)
          Path(os.environ['RUNNER_TEMP'], 'context-resume-input.json').write_text(json.dumps(data), encoding='utf-8')
          PY
      - name: Install actual application and offline evaluation dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --prefix "$RUNNER_TEMP/context-eval" --no-audit --no-fund promptfoo@0.123.1
      - name: Verify typed identities, scoped retrieval and historical review recovery
        run: >-
          python -m pytest -q
          tests/test_optional_hardware_parameters.py
          tests/test_spec_choice_metadata.py
          tests/test_motion_control_regressions.py
          tests/test_analysis_design_rag.py
          tests/test_agent_b_measurement.py
          tests/test_intent_evidence_handoff.py
          tests/test_workbench_service.py::test_legacy_analysis_output_restores_choices_without_writing
          tests/test_architecture_boundaries.py
          tests/test_source_layout.py
          --junitxml=validation-context/targeted.xml
      - name: Run offline application replay and real promptfoo CLI
        run: |
          python scripts/context_replay.py --output validation-context/replay.json
          "$RUNNER_TEMP/context-eval/node_modules/.bin/promptfoo" eval -c evals/context-replay/promptfooconfig.yaml --no-cache -o validation-context/promptfoo.json
      - name: Upload verified Git blobs only, without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          data = json.loads(Path(os.environ['RUNNER_TEMP'], 'context-resume-input.json').read_text())
          elements = []
          for row in data['files']:
              name = row['path']
              content = Path(name).read_bytes()
              assert hashlib.sha256(content).hexdigest() == row['after'], name
              expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs', method='POST', data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(content).decode()}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  actual = json.load(response)['sha']
              assert actual == expected, name
              elements.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': actual})
          manifest = {'base_commit': data['base_commit'], 'verification_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'files': data['files'], 'tree_elements': elements}
          Path('validation-context/verified-blobs.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-resume-verification
          path: validation-context
          retention-days: 7
