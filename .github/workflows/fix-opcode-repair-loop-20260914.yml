name: Fix recurring opcode repair loop

on:
  push:
    branches: [fix/prompt-context-slim-20260913]
    paths:
      - .github/workflows/fix-opcode-repair-loop-20260914.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt-context-slim-20260913
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply bounded repair-loop patch
        run: |
          python tools/_tmp_fix_opcode_repair_loop_20260914.py
          python tools/_tmp_fix_opcode_schema_test_20260914.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_model_provider.py')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements/web.txt
          python -m pip check
      - name: Run focused Python regression
        run: |
          python -m compileall -q src tests
          python -m pytest -q \
            tests/test_user_confirmed_generation_repair.py \
            tests/test_model_provider.py \
            tests/test_generation_fast_path.py \
            tests/test_instruction_contract_alignment.py
          python tools/build_fx3u_verified_opcode_overlay.py --check
      - name: Build Web frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/workbench.py src/api.py src/model_provider.py \
            web/src/features/JobFailure.tsx web/src/i18n.ts \
            tests/test_user_confirmed_generation_repair.py tests/test_model_provider.py
          git commit -m "fix: stop recurring blocked opcode repair loop"
          git push origin HEAD:fix/prompt-context-slim-20260913
