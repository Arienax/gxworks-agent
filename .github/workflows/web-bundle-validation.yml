name: Web bundle validation
on:
  push:
    branches: [fix/web-bundle-splitting-20260926]
    paths: [.github/workflows/web-bundle-validation.yml]
permissions:
  contents: write
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Prepare exact focused commit
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo '/evidence/' >> .git/info/exclude
          git rev-parse HEAD > evidence/workflow-commit.txt
          python - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          encoded = Path('.web-bundle-fix.b64').read_text().replace('YnwJlLuiViTiCeXe0', 'YnwJlLuiViCeXe0')
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'd958f5951674b50f69558adabde4a15fa706692e3441e17430682b5b0876112d'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          path = Path('scripts/web_generation_e2e.py')
          text = path.read_text()
          replacements = {
              "page.get_by_label('本版本运行记录', exact=True).select_option": "page.get_by_role('combobox', name='本版本运行记录', exact=True).select_option",
              "            await page.wait_for_function('Number(window.__replayCursor.value)>0')": "            await expect(cursor).not_to_have_value('0')",
              "            await page.wait_for_function('(old) => Number(window.__replayCursor.value)>Number(old)', arg=paused)": "            await expect(cursor).not_to_have_value(paused)\n            assert int(await cursor.input_value()) > int(paused), 'Resuming replay reset its cursor'",
          }
          for old, new in replacements.items():
              assert text.count(old) == 1
              text = text.replace(old, new)
          path.write_text(text)
          path = Path('scripts/web_model_settings_e2e.py')
          before = path.read_text()
          old = "                        field=page.get_by_label('配置名称',exact=True)\n                        if await field.count()"
          new = "                        field=page.get_by_label('配置名称',exact=True)\n                        # Wait for the lazy panel before deciding whether its\n                        # empty-profile create card is already open.\n                        await expect(field.or_(page.get_by_role('button',name='新增配置',exact=True))).to_be_visible()\n                        if await field.count()"
          assert before.count(old) == 1
          path.write_text(before.replace(old, new))
          PY
          git rm .web-bundle-fix.b64 .github/workflows/web-bundle-validation.yml
          git add web/src/App.tsx web/src/features/DeliverySummary.tsx web/tests/module-resolution.test.mjs scripts/web_generation_e2e.py scripts/web_model_settings_e2e.py tests/README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(web): defer optional panels without resetting retained views'
          git rev-parse HEAD > evidence/tested-commit.txt
          git diff --check a23948a8e453369634b59608ace9fc6d1fd1704e HEAD
          git diff --stat a23948a8e453369634b59608ace9fc6d1fd1704e HEAD | tee evidence/change-scope.txt
          git diff --binary a23948a8e453369634b59608ace9fc6d1fd1704e HEAD > evidence/fix.patch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix web 2>&1 | tee evidence/npm-ci.log
          python -m pip install -r requirements.txt playwright==1.55.0 2>&1 | tee evidence/pip-install.log
          python -m playwright install --with-deps chromium 2>&1 | tee evidence/browser-install.log
      - name: Node tests and TypeScript Vite production build
        id: web
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test web/tests/*.test.mjs 2>&1 | tee evidence/node-tests.log
          npm run build --prefix web 2>&1 | tee evidence/production-build.log
          if grep -E 'Some chunks are larger|chunkSizeWarningLimit' evidence/production-build.log; then
            echo 'Unexpected production bundle warning' >&2
            exit 1
          fi
          cp -r web/dist evidence/production-dist
      - name: Measure production initial graph and module ownership
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd web
          node --input-type=module <<'JS' > ../evidence/production-profile.log 2>&1
          import { build } from 'vite';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { gzipSync } from 'node:zlib';
          const root=process.cwd()+'/';
          await build({build:{write:false},plugins:[{name:'measure-production',generateBundle(_options,bundle){
            const chunks=Object.values(bundle).filter(item=>item.type==='chunk').map(chunk=>{
              // Module ownership is available here, but Vite can still inject
              // preload helpers later. Measure the already-written real build.
              const code=readFileSync('dist/'+chunk.fileName);
              return {
                file:chunk.fileName,entry:chunk.isEntry,bytes:code.length,gzipBytes:gzipSync(code).length,
                imports:chunk.imports,dynamicImports:chunk.dynamicImports,
                modules:Object.entries(chunk.modules).map(([id,info])=>({id:id.replace(root,''),renderedLength:info.renderedLength}))
                  .sort((a,b)=>(b.renderedLength||0)-(a.renderedLength||0))
              };
            });
            const byName=new Map(chunks.map(chunk=>[chunk.file,chunk])),initial=new Set();
            function visit(name){if(initial.has(name))return;initial.add(name);byName.get(name).imports.forEach(visit);}
            chunks.filter(chunk=>chunk.entry).forEach(chunk=>visit(chunk.file));
            const report={measurement:'written production dist; module ownership from profiling build',
              initial:[...initial],initialBytes:[...initial].reduce((sum,name)=>sum+byName.get(name).bytes,0),
              initialGzipBytes:[...initial].reduce((sum,name)=>sum+byName.get(name).gzipBytes,0),chunks};
            writeFileSync('../evidence/production-modules.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
          }}]});
          JS
      - name: Related Python architecture and workbench regressions
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_source_layout.py tests/test_architecture_boundaries.py tests/test_web_architecture.py tests/test_web_source_entrypoints.py tests/test_web_fbd.py tests/test_simulation_workbench.py tests/test_program_exploration.py --junitxml=evidence/python-junit.xml 2>&1 | tee evidence/python-tests.log
      - name: Lifecycle browser regression
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        shell: bash
        env:
          GX_DELIVERY_EVIDENCE_DIR: ${{ github.workspace }}/evidence/lifecycle-repeat
        run: |
          set -o pipefail
          mkdir -p evidence/lifecycle-repeat
          python scripts/web_generation_e2e.py --lifecycle-only --web-dist web/dist --report evidence/lifecycle-repeat/report.json 2>&1 | tee evidence/lifecycle-repeat/run.log
      - name: Production generation and retained lifecycle browser regressions
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        shell: bash
        env:
          GX_DELIVERY_EVIDENCE_DIR: ${{ github.workspace }}/evidence/browser
        run: |
          set -o pipefail
          mkdir -p evidence/browser
          python scripts/web_generation_e2e.py --web-dist web/dist --report evidence/browser/generation-report.json 2>&1 | tee evidence/browser/generation.log
      - name: Production model settings browser regressions
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/web_model_settings_e2e.py --web-dist web/dist --evidence evidence/model-settings 2>&1 | tee evidence/model-settings.log
      - name: Publish tested focused commit
        if: success()
        run: git push origin HEAD:refs/heads/fix/web-bundle-splitting-20260926
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-bundle-production-validation
          path: evidence/
          retention-days: 14
