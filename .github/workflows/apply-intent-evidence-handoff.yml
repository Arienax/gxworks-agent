name: Apply verified call-chain repair
on:
  push:
    branches: [fix/intent-evidence-handoff-20260919]
    paths: [.github/workflows/apply-intent-evidence-handoff.yml]
permissions:
  contents: write
jobs:
  apply-verified-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Restore and verify exact tested patch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess
          from pathlib import Path
          uploaded = ['950676a8319b267e522a8e5f97409ea2509611af', '8c69d8d886448a655c557302222d589598709480', '72ca4bad676bfc3f607fb2420f041432cac362d5', '70fcccde586f281d4df90f4c8ce0bff42df50a6e', '2d4d18b8228238c621cb33b5c0a39e7b997f477e', 'ad0f9558fddfbaffe45652016e139ec675a404a8']
          expected = ['950676a8319b267e522a8e5f97409ea2509611af', 'd70ec5e866f042c3fb15800760c74df1608a53ee', '72ca4bad676bfc3f607fb2420f041432cac362d5', '2112d390d22f1153a62c77874f7be00a422ea2bf', '15d6c249d5ead794d3d93ae115185e79ed75ead2', 'ad0f9558fddfbaffe45652016e139ec675a404a8']
          corrections = {1: [[238,238,'AR'],[7997,8000,'T']], 3: [[1051,1052,''],[5365,5366,'/L']], 4: [[6326,6327,''],[8000,8000,'b']]}
          chunks = []
          for i, sha in enumerate(uploaded):
              response = subprocess.check_output(['gh','api',f'repos/{os.environ["REPOSITORY"]}/git/blobs/{sha}'])
              record = json.loads(response)
              assert record['sha'] == sha
              encoded = ''.join(record['content'].split())
              for start, end, replacement in reversed(corrections.get(i, [])):
                  encoded = encoded[:start] + replacement + encoded[end:]
              chunk = base64.b64decode(encoded, validate=True)
              assert hashlib.sha1(f'blob {len(chunk)}\0'.encode() + chunk).hexdigest() == expected[i]
              chunks.append(chunk)
          patch = gzip.decompress(b''.join(chunks))
          assert hashlib.sha256(patch).hexdigest() == 'd84077f193772125ba4c354c24161bb5f41bc27716d2d95126f644e9423fcd6e'
          Path('/tmp/intent-evidence.patch').write_bytes(patch)
          print('Verified exact tested patch:', len(patch), 'bytes')
          PY
          git apply --check --index /tmp/intent-evidence.patch
          git apply --index /tmp/intent-evidence.patch
          git diff --cached --check
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          assert all(not p or p.startswith(('src/','tests/','web/','docs/')) for p in paths)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve engineering intent and evidence across generation handoffs'
          git push origin HEAD:refs/heads/fix/intent-evidence-handoff-20260919
          git rev-parse HEAD
