name: Source Layout Validation

on:
  push:
    branches: [refactor/src-layout-complete-20260918]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'tools/**'
      - 'packaging/**'
      - '.github/workflows/source-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install desktop and Web test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0
          python -m pip install -r requirements/web.txt PyQt6==6.11.0 pytest==9.1.1 olefile==0.47 jsonschema httpx pyinstaller==6.21.0
      - name: Export reproducible local test dependencies
        run: |
          python -m pip download --dest /tmp/source-layout-wheels -r requirements/web.txt PyQt6==6.11.0 pytest==9.1.1 olefile==0.47 jsonschema httpx pyinstaller==6.21.0
          python -m pip freeze > /tmp/source-layout-wheels/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-layout-linux-py313-dependencies
          path: /tmp/source-layout-wheels
          retention-days: 1
      - name: Compile source
        run: python -m compileall -q src
      - name: Run full Python suite
        run: python -m pytest -q --junitxml=source-layout-tests.xml
      - name: MCP smoke
        run: python scripts/mcp_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-layout-python-results
          path: source-layout-tests.xml
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements/web.txt
          npm ci --prefix web
      - name: Verify schema and frontend
        run: |
          python scripts/export_web_schema.py
          npm run types --prefix web
          git diff --exit-code -- web/openapi.json web/src/api/generated.ts
          node --experimental-strip-types --test web/tests/*.test.mjs
          npm run build --prefix web
