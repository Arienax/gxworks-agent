name: Source Layout Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/source-layout.yml'
      - '.github/spec-v4.part*'

permissions:
  contents: read

jobs:
  prepare-reviewed-tree:
    if: github.event.pull_request.head.repo.full_name == 'Arienax/gxworks-agent' && github.event.pull_request.head.ref == 'fix/prompt-cleanup-io-binding-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct exactly the locally reviewed source
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, lzma, subprocess
          from pathlib import Path
          base = '6f9aa000f754d81e2fa65176e391844d68f91bff'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == base
          encoded = b''.join(Path(f'.github/spec-v4.part{i}').read_bytes() for i in range(3))
          data = lzma.decompress(encoded)
          assert hashlib.sha256(data).hexdigest() == '9857d3e77ebb638d0664d53cfb1d63459b637711196faeca37893ec05d9062dc'
          operations = json.loads(data)
          assert len(operations) == 31
          def blob_sha(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          for name, change in operations.items():
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.resolve().is_relative_to(Path.cwd())
              original = subprocess.check_output(['git', 'show', base + ':' + name])
              assert blob_sha(original) == change['old_sha'], name
              lines = original.decode('utf-8').splitlines(keepends=True)
              right = len(lines)
              for start, end, replacement in reversed(change['changes']):
                  assert 0 <= start <= end <= right
                  lines[start:end] = [replacement]
                  right = start
              new = ''.join(lines).encode('utf-8')
              assert blob_sha(new) == change['new_sha'], name
              path.write_bytes(new)
          Path('validation-spec').mkdir(exist_ok=True)
          Path('validation-spec/operations.json').write_text(json.dumps(operations), encoding='utf-8')
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - name: Install existing headless test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify the reviewed lifecycle and model boundaries
        run: >-
          python -m pytest -q
          tests/test_intent_evidence_handoff.py
          tests/test_context_compiler.py
          tests/test_runtime_diagnostics_web.py
          tests/test_spec_choice_metadata.py
          tests/test_shared_generation_context.py
          tests/test_confirmed_generation_regressions.py
          tests/test_analysis_prompt_routing.py
          tests/test_instruction_fact_context.py
          tests/test_architecture_boundaries.py
          tests/test_source_layout.py
          --junitxml=validation-spec/targeted.xml
      - name: Upload verified Git objects without moving any branch
        shell: bash
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          base = '6f9aa000f754d81e2fa65176e391844d68f91bff'
          root = 'https://api.github.com/repos/Arienax/gxworks-agent'
          operations = json.loads(Path('validation-spec/operations.json').read_text())
          def api(path, payload=None):
              request = urllib.request.Request(root + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={'Accept': 'application/vnd.github+json',
                           'Authorization': 'Bearer ' + os.environ['GH_OBJECT_TOKEN'],
                           'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert api('/git/ref/heads/fix/prompt-cleanup-io-binding-20260921')['object']['sha'] == head
          entries = []
          for name, change in operations.items():
              raw = Path(name).read_bytes()
              local_sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert local_sha == change['new_sha'], name
              result = api('/git/blobs', {'content': raw.decode('utf-8'), 'encoding': 'utf-8'})
              assert result['sha'] == local_sha, name
              mode = subprocess.check_output(['git', 'ls-tree', base, '--', name], text=True).split()[0]
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': local_sha})
          # The baseline tree has no temporary payload files. Its workflow is
          # replaced by the reviewed original read-only workflow in entries.
          tree = api('/git/trees', {'base_tree': api('/git/commits/' + base)['tree']['sha'], 'tree': entries})
          summary = {'baseline_sha': base, 'parent_sha': head, 'tree_sha': tree['sha'],
                     'files': entries, 'branch_moved': False}
          Path('validation-spec/verified-tree.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps({'tree_sha': tree['sha'], 'verified_files': len(entries), 'branch_moved': False}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-v4-reviewed-tree
          path: validation-spec
          retention-days: 1
