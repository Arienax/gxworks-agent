name: Inspect completion flag contexts

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
    paths: [.github/workflows/inspect-completion-flag-contexts.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rejected-json-repair-20260913
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print representative flag contexts
        run: |
          python - <<'PY'
          import json, re, sqlite3
          db='resources/knowledge/fx3u_knowledge.sqlite'
          con=sqlite3.connect(db)
          wanted={'M8029','M8067','M8350','M8343','M8020','M8021','M8022','M8001','M8012','M8329'}
          rows=con.execute('SELECT manual_id,opcode,source_pages_json,completion_flags_json FROM instructions WHERE completion_flags_json <> "[]" ORDER BY manual_id,opcode_norm').fetchall()
          seen={}
          for manual,opcode,pages_json,flags_json in rows:
              flags=json.loads(flags_json or '[]')
              for flag in flags:
                  flag=str(flag).upper()
                  if flag not in wanted or len(seen.get(flag,[]))>=3: continue
                  pages=json.loads(pages_json or '[]')
                  qs=','.join('?' for _ in pages)
                  source='\n'.join(r[0] or '' for r in con.execute(f'SELECT clean_text FROM page_artifacts WHERE manual_id=? AND pdf_page IN ({qs}) ORDER BY pdf_page',(manual,*pages)).fetchall()) if pages else ''
                  contexts=[]
                  for m in re.finditer(rf'(?<![A-Z0-9_]){re.escape(flag)}(?![A-Z0-9_])',source,re.I):
                      ctx=re.sub(r'\s+',' ',source[max(0,m.start()-180):min(len(source),m.end()+260)]).strip()
                      contexts.append(ctx)
                  seen.setdefault(flag,[]).append({'manual':manual,'opcode':opcode,'pages':pages,'contexts':contexts[:3]})
          for flag in sorted(seen):
              print('===',flag,'===')
              for item in seen[flag]:
                  print(item['manual'],item['opcode'],item['pages'])
                  for ctx in item['contexts']:
                      print('CTX',ctx)
          con.close()
          PY
