name: Temporary Cancellation Validation

on:
  push:
    branches:
      - feat/comprehensive-runtime-diagnostics-20260914

permissions:
  contents: read

jobs:
  cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m compileall -q src/application/jobs.py src/application/model_progress.py tests/test_model_stream_cancellation.py
      - run: python -m pytest -q tests/test_model_stream_cancellation.py tests/test_model_presentation.py
