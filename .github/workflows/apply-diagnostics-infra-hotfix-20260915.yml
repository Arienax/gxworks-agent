name: Apply diagnostics infrastructure hotfix

on:
  push:
    branches:
      - fix/gxworks2-native-csv-wrap-20260915
    paths:
      - .github/workflows/apply-diagnostics-infra-hotfix-20260915.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gxworks2-native-csv-wrap-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply minimal infrastructure patch
        shell: python
        run: |
          from pathlib import Path

          def block(*lines):
              return "\n".join(lines) + "\n"

          def replace_exact(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          api = Path("src/api.py")
          text = api.read_text(encoding="utf-8")
          text = replace_exact(
              text,
              block("    ImageAttachment,", "    ModelRequest,", "    ResponseRejectedError,"),
              block("    ImageAttachment,", "    ModelProviderError,", "    ModelRequest,", "    ResponseRejectedError,"),
              "src/api.py provider import",
          )
          for label in ("阶段1 分析失败", "阶段1 流式分析失败"):
              text = replace_exact(
                  text,
                  block(
                      "    except ResponseRejectedError:",
                      "        raise",
                      "    except Exception as e:",
                      f"        print(f\"{label}: {{e}}\")",
                      "        return None",
                  ),
                  block(
                      "    except ModelProviderError:",
                      "        raise",
                      "    except Exception as e:",
                      f"        print(f\"{label}: {{e}}\")",
                      "        return None",
                  ),
                  f"src/api.py {label}",
              )
          api.write_text(text, encoding="utf-8")

          app = Path("web/src/App.tsx")
          text = app.read_text(encoding="utf-8")
          text = replace_exact(
              text,
              block('  const composerProjectRef = useRef("");', "  useEffect(() => {"),
              block(
                  '  const composerProjectRef = useRef("");',
                  "  function syncComposerRoute(value: Project) {",
                  "    const editRegenerate = !!value.confirmed_spec &&",
                  "      ((value.version_count || 0) > 0 || (value.versions?.length || 0) > 0);",
                  '    const routeKey = `${value.id}:${editRegenerate ? "edit-regenerate" : "new-requirement"}`;',
                  "    if (composerProjectRef.current === routeKey) return;",
                  "    composerProjectRef.current = routeKey;",
                  '    setIntent(editRegenerate ? "generation" : "analysis");',
                  "  }",
                  "  useEffect(() => {",
              ),
              "App.tsx composer route insertion",
          )
          text = replace_exact(
              text,
              block(
                  "        setProject(value);",
                  "        if (composerProjectRef.current !== value.id) {",
                  "          composerProjectRef.current = value.id;",
                  "          setIntent(value.confirmed_spec && (value.versions?.length || 0) > 0",
                  '            ? "generation"',
                  '            : "analysis");',
                  "        }",
              ),
              block("        setProject(value);", "        syncComposerRoute(value);"),
              "App.tsx initial composer route",
          )
          text = replace_exact(
              text,
              block(
                  "    previewEpoch.current += 1;",
                  "    setProject(fresh); setVid(versionId); setPreview(null); setSelectedProposal(null);",
              ),
              block(
                  "    previewEpoch.current += 1;",
                  "    syncComposerRoute(fresh);",
                  "    setProject(fresh); setVid(versionId); setPreview(null); setSelectedProposal(null);",
              ),
              "App.tsx saved-version route",
          )
          text = replace_exact(
              text,
              block(
                  "    setProject(fresh);",
                  "    setProjects((old) => old.map((item) => item.id === fresh.id ? fresh : item));",
              ),
              block(
                  "    syncComposerRoute(fresh);",
                  "    setProject(fresh);",
                  "    setProjects((old) => old.map((item) => item.id === fresh.id ? fresh : item));",
              ),
              "App.tsx silent reload route",
          )
          app.write_text(text, encoding="utf-8")

          test = Path("tests/test_web_frontend_state_flow.py")
          text = test.read_text(encoding="utf-8")
          text = replace_exact(
              text,
              block(
                  "def test_existing_confirmed_project_defaults_to_generation_edit_mode():",
                  '    assert "composerProjectRef.current !== value.id" in APP',
                  '    assert "value.confirmed_spec && (value.versions?.length || 0) > 0" in APP',
              ),
              block(
                  "def test_existing_confirmed_project_defaults_to_generation_edit_mode():",
                  '    route = _between("function syncComposerRoute(", "useEffect(() => {")',
                  '    assert \'"edit-regenerate"\' in route',
                  '    assert \'"new-requirement"\' in route',
                  '    assert "value.confirmed_spec" in route',
                  '    assert "value.version_count" in route',
                  '    assert "value.versions?.length" in route',
                  '    assert \'setIntent(editRegenerate ? "generation" : "analysis")\' in route',
                  "",
                  "def test_same_project_maturity_resynchronizes_composer_route():",
                  '    initial = _between(\'api<Project>(`/projects/${pid}`)\', \'.catch((e) => setError(e.message))\')',
                  '    silent = _between("async function reloadProjectSilently(", "async function refreshDrawing(")',
                  '    saved = _between("async function openSavedVersion(", "async function redrawVersion(")',
                  '    assert "syncComposerRoute(value)" in initial',
                  '    assert "syncComposerRoute(fresh)" in silent',
                  '    assert "syncComposerRoute(fresh)" in saved',
              ),
              "frontend state-flow regression",
          )
          test.write_text(text, encoding="utf-8")
      - name: Install Python test dependencies
        run: python -m pip install -q pytest -r requirements/web.txt
      - name: Run focused regressions
        run: >-
          pytest -q
          tests/test_analysis_format_repair.py
          tests/test_application_job_errors.py
          tests/test_web_frontend_state_flow.py
          tests/test_diagnostics_workflow_regression_20260915.py
      - name: Build web client
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit verified patch
        run: |
          git config user.name "gxworks-agent diagnostics hotfix"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-diagnostics-infra-hotfix-20260915.yml
          git add src/api.py web/src/App.tsx tests/test_web_frontend_state_flow.py tests/test_diagnostics_workflow_regression_20260915.py tests/fixtures/diagnostics_workflow_regression_20260915.json
          git commit -m "fix(workflow): preserve provider errors and edit routing"
          git push origin HEAD:fix/gxworks2-native-csv-wrap-20260915
