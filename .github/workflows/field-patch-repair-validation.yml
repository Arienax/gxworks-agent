name: Field Patch Repair Validation

on:
  push:
    branches: [fix/json-field-patch-repair-20260914]
    paths:
      - tools/patch_field_repair_protocol_once.py
      - tools/patch_field_repair_tests_once.py
      - src/application/field_repair.py
      - src/workflow_response_contracts.py
      - tests/test_field_patch_repair_protocol.py
      - .github/workflows/field-patch-repair-validation.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/json-field-patch-repair-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply field patch protocol
        run: |
          python tools/patch_field_repair_protocol_once.py
          python tools/patch_field_repair_tests_once.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements/web.txt
      - name: Run focused repair regression
        run: |
          python -m compileall -q src tests
          python -m pytest -q tests/test_field_patch_repair_protocol.py tests/test_user_confirmed_generation_repair.py tests/test_native_repair_scope_schema.py tests/test_generation_opcode_contract.py tests/test_generation_repair_workflow.py tests/test_generation_rejected_json_repair.py tests/test_model_provider.py tests/test_runtime_diagnostics.py tests/test_runtime_diagnostics_context.py
          git diff --check
      - name: Commit validated field patch protocol
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'feat(repair): use path-addressed field patches'
          file_pattern: 'src tests'
