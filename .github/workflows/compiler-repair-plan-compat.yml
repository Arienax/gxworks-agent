name: Compiler Repair Plan Compatibility

on:
  push:
    branches: [fix/json-field-patch-repair-20260914]
    paths:
      - tools/patch_compiler_repair_plan_once.py
      - .github/workflows/compiler-repair-plan-compat.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/json-field-patch-repair-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply compatibility patch
        run: python tools/patch_compiler_repair_plan_once.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements/web.txt
      - name: Validate compiler compatibility
        run: |
          python -m compileall -q src tests
          python -m pytest -q tests/test_plc_ir.py tests/test_field_patch_repair_protocol.py tests/test_user_confirmed_generation_repair.py
          git diff --check
      - name: Commit validated compatibility fix
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix(repair): keep desktop compiler compatible with field plans'
          file_pattern: 'src/main.py'
