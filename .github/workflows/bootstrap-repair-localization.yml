name: Inspect FX3U knowledge rows

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect FMOV and ZRST structured rows and chunks
        shell: bash
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path

          db = Path('resources/knowledge/fx3u_knowledge.sqlite')
          with db.open('rb') as f:
              assert f.read(16) == b'SQLite format 3\0', 'SQLite LFS object not materialized'
          con = sqlite3.connect(db)
          con.row_factory = sqlite3.Row

          print('=== instructions ===')
          rows = con.execute('''
              SELECT id, opcode, opcode_norm, fnc_number, title, summary,
                     operands_json, restrictions_json, manual_id, page_start, page_end, chunk_id
              FROM instructions
              WHERE opcode_norm IN ('fmov','zrst')
              ORDER BY opcode_norm, manual_id, page_start
          ''').fetchall()
          for row in rows:
              item = dict(row)
              for key in ('operands_json','restrictions_json'):
                  try: item[key] = json.loads(item[key])
                  except Exception: pass
              print(json.dumps(item, ensure_ascii=False, indent=2))

          print('=== chunks linked from instructions ===')
          chunk_ids = sorted({row['chunk_id'] for row in rows if row['chunk_id'] is not None})
          for chunk_id in chunk_ids:
              row = con.execute('SELECT id, manual_id, chunk_type, instruction_opcode, section, printed_page, text FROM chunks WHERE id=?', (chunk_id,)).fetchone()
              if row:
                  item = dict(row)
                  item['text'] = item['text'][:7000]
                  print(json.dumps(item, ensure_ascii=False, indent=2))

          print('=== nearby FMOV/ZRST chunks ===')
          for opcode in ('FMOV','ZRST'):
              rows2 = con.execute('''
                  SELECT id, manual_id, chunk_type, instruction_opcode, section, printed_page, text
                  FROM chunks
                  WHERE upper(instruction_opcode)=? OR upper(section) LIKE ?
                  ORDER BY manual_id, id LIMIT 20
              ''', (opcode, f'%{opcode}%')).fetchall()
              print(f'--- {opcode} ---')
              for row in rows2:
                  item = dict(row)
                  item['text'] = item['text'][:5000]
                  print(json.dumps(item, ensure_ascii=False, indent=2))
          PY
