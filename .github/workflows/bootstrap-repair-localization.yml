name: Bootstrap structured instruction extraction fix

on:
  push:
    branches: [fix/rejected-json-repair-20260913]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'bootstrap: fix structured instruction operand extraction'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rejected-json-repair-20260913
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline-builder dependencies
        run: python -m pip install pypdf pdfplumber
      - name: Patch generic structured extraction and runtime retrieval
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          builder = Path('tools/build_fx3u_knowledge_v3.py')
          text = builder.read_text(encoding='utf-8')
          text = text.replace('BUILDER_VERSION = "3.0.0"', 'BUILDER_VERSION = "3.0.1"', 1)
          start = text.index('def parse_operand_schema(pages: list[PageArtifact])')
          end = text.index('\ndef instruction_summary(', start)
          replacement = r'''def _operand_name(value: str) -> str:
              """Normalize operand placeholders printed in instruction tables.

              Manuals use both legacy S/D/D1 forms and structured s/d/n forms.
              EN/ENO are execution pins, not APP_INSTR data operands.
              """
              token = normalize_line(str(value or "")).strip()
              if not token or token.upper() in {"EN", "ENO"}:
                  return ""
              if not re.fullmatch(r"[A-Za-z](?:\d{0,3})?", token):
                  return ""
              return token.upper()


          def _device_column_name(value: str) -> str:
              """Normalize one Applicable-devices matrix column label."""
              token = normalize_line(str(value or ""))
              token = re.sub(r"\[GLYPH-[0-9A-F]+\]|\(cid:\d+\)", "", token, flags=re.I)
              token = re.sub(r"\s+", "", token)
              if not token or token.casefold() in {"<blank>", "blank"}:
                  return ""
              upper = token.upper()
              if upper in {"X", "Y", "M", "T", "C", "S", "D", "R", "V", "Z", "K", "H", "E", "P"}:
                  return upper
              if re.fullmatch(r"KN[XYMS]", upper):
                  return "Kn" + upper[2:]
              if upper in {"D.B", "DB"}:
                  return "D.b"
              if upper.startswith("U") and "\\G" in upper:
                  return "U\\G"
              if upper.startswith("MODIF"):
                  return "Modifier"
              if token.startswith('"'):
                  return "String"
              return ""


          def _applicable_devices_by_operand(page: PageArtifact) -> dict[str, set[str]]:
              """Decode the official Applicable-devices matrix without opcode rules."""
              found: dict[str, set[str]] = defaultdict(set)
              for table in page.tables:
                  rows = table.get("rows") or []
                  if not rows:
                      continue
                  best_index = -1
                  best_headers: dict[int, str] = {}
                  for row_index, row in enumerate(rows[:8]):
                      headers = {
                          index: name
                          for index, cell in enumerate(row)
                          if (name := _device_column_name(cell))
                      }
                      if len(headers) > len(best_headers):
                          best_index, best_headers = row_index, headers
                  # A real applicability matrix contains several device-family columns.
                  if len(best_headers) < 4:
                      continue
                  for row in rows[best_index + 1:]:
                      operand = next(
                          (_operand_name(cell) for cell in row[:4] if _operand_name(cell)),
                          "",
                      )
                      if not operand:
                          continue
                      for column, device in best_headers.items():
                          if column >= len(row):
                              continue
                          marker = normalize_line(str(row[column] or ""))
                          if marker and marker.casefold() not in {"<blank>", "blank", "-", "—"}:
                              found[operand].add(device)
              return found


          def parse_operand_schema(pages: list[PageArtifact]) -> list[dict[str, Any]]:
              """Extract operand meaning, data type and applicable device families.

              This is deliberately table-driven. Instruction-specific facts stay in
              the Mitsubishi manuals/SQLite rather than being copied into prompts.
              """
              operands: list[dict[str, Any]] = []
              by_name: dict[str, dict[str, Any]] = {}
              applicability: dict[str, set[str]] = defaultdict(set)

              def remember(name: str, description: str = "", data_type: str = "") -> None:
                  if not name:
                      return
                  current = by_name.get(name)
                  if current is None:
                      current = {"position": name, "description": description, "data_type": data_type}
                      operands.append(current)
                      by_name[name] = current
                  else:
                      if description and not current.get("description"):
                          current["description"] = description
                      if data_type and not current.get("data_type"):
                          current["data_type"] = data_type

              type_pattern = re.compile(
                  r"\b(?:ANY(?:16|32|_SIMPLE)|bit|binary|word|double\s*word|integer|real|bool|string)\b",
                  flags=re.I,
              )
              for page in pages[:4]:
                  for name, devices in _applicable_devices_by_operand(page).items():
                      applicability[name].update(devices)

                  in_operands = False
                  for raw_line in page.compact_layout.splitlines():
                      line = normalize_line(raw_line.replace("|", " | "))
                      if re.search(r"\bSet data\b|\bOperand\s+Type\b|^Variable\s*\|", line, flags=re.I):
                          in_operands = True
                          continue
                      if in_operands and re.search(
                          r"Applicable devices|Explanation of function|Function and operation explanation",
                          line,
                          flags=re.I,
                      ):
                          break
                      if not in_operands:
                          continue
                      match = re.match(r"^([A-Za-z](?:\d{0,3})?)\s*\|\s*(.+)$", raw_line.strip())
                      if not match:
                          continue
                      name = _operand_name(match.group(1))
                      if not name:
                          continue
                      cells = [normalize_line(value) for value in match.group(2).split("|") if normalize_line(value)]
                      description = cells[0] if cells else ""
                      data_type = next((value for value in cells[1:] if type_pattern.search(value)), "")
                      remember(name, description, data_type)

                  for table in page.tables:
                      table_text = str(table.get("text", ""))
                      if not re.search(r"Operand\s+Type|Variable", table_text, flags=re.I):
                          continue
                      for row in table.get("rows", [])[1:]:
                          cells = [normalize_line(value) for value in row]
                          name = next((_operand_name(value) for value in cells[:5] if _operand_name(value)), "")
                          if not name:
                              continue
                          meaningful = [value for value in cells if value and _operand_name(value) != name]
                          description = meaningful[0] if meaningful else ""
                          data_type = next((value for value in meaningful[1:] if type_pattern.search(value)), "")
                          remember(name, description, data_type)

              for name, devices in applicability.items():
                  remember(name)
                  if devices:
                      by_name[name]["applicable_devices"] = sorted(devices)
              return operands


          '''
          # Normalize indentation introduced by the raw triple-quoted payload.
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n\n'
          text = text[:start] + replacement + text[end + 1:]

          old_summary = '''            operand_summary = "; ".join(
                f"{item.get('position', '')}: {item.get('description', '')}"
                + (f" [{item.get('data_type')}]" if item.get("data_type") else "")
                for item in operands
            )[:520]
'''
          new_summary = '''            operand_summary = "; ".join(
                f"{item.get('position', '')}: {item.get('description', '')}"
                + (f" [{item.get('data_type')}]" if item.get("data_type") else "")
                + (" applicable=" + ",".join(item.get("applicable_devices") or [])
                   if item.get("applicable_devices") else "")
                for item in operands
            )[:900]
'''
          if old_summary not in text:
              raise SystemExit('operand summary block not found')
          text = text.replace(old_summary, new_summary, 1)
          builder.write_text(text, encoding='utf-8')

          retriever = Path('src/knowledge_retriever_core.py')
          text = retriever.read_text(encoding='utf-8')
          marker = '\ndef _format_result_block(result):\n'
          helper = r'''
          def _structured_instruction_record(connection, schema, chunk_id):
              """Render authoritative instruction fields from SQLite at retrieval time."""
              table = schema.get("instructions")
              if not table:
                  return ""
              required = {"chunk_id", "opcode", "operands_json", "restrictions_json"}
              if not required.issubset(set(table["columns"])):
                  return ""
              selected = ["opcode", "operands_json", "restrictions_json"]
              if "completion_flags_json" in table["columns"]:
                  selected.append("completion_flags_json")
              row = connection.execute(
                  "SELECT {} FROM {} WHERE chunk_id=? LIMIT 1".format(
                      ",".join(_quote_identifier(column) for column in selected),
                      _quote_identifier(table["name"]),
                  ),
                  (chunk_id,),
              ).fetchone()
              if row is None:
                  return ""
              try:
                  operands = json.loads(str(row["operands_json"] or "[]"))
              except (TypeError, ValueError):
                  operands = []
              try:
                  restrictions = json.loads(str(row["restrictions_json"] or "[]"))
              except (TypeError, ValueError):
                  restrictions = []
              flags = []
              if "completion_flags_json" in selected:
                  try:
                      flags = json.loads(str(row["completion_flags_json"] or "[]"))
                  except (TypeError, ValueError):
                      flags = []
              lines = ["[STRUCTURED INSTRUCTION RECORD]", f"INSTRUCTION: {row['opcode']}"]
              rendered = []
              for item in operands if isinstance(operands, list) else []:
                  if not isinstance(item, dict):
                      continue
                  part = f"{item.get('position', '')}: {item.get('description', '')}".strip()
                  if item.get("data_type"):
                      part += f" [{item['data_type']}]"
                  devices = item.get("applicable_devices") or []
                  if isinstance(devices, list) and devices:
                      part += " applicable=" + ",".join(str(value) for value in devices)
                  if part:
                      rendered.append(part)
              if rendered:
                  lines.append("OPERANDS: " + "; ".join(rendered))
              if flags:
                  lines.append("COMPLETION_FLAGS: " + ", ".join(str(value) for value in flags))
              if restrictions:
                  lines.append("KEY_RESTRICTIONS: " + " | ".join(str(value) for value in restrictions[:3]))
              return "\n".join(lines) if len(lines) > 2 else ""


          def _augment_structured_instruction(connection, schema, result):
              if result is None:
                  return None
              prefix = _structured_instruction_record(connection, schema, result.get("id"))
              if not prefix:
                  return result
              enriched = dict(result)
              body = str(enriched.get("text") or "")
              if body.startswith("[STRUCTURED INSTRUCTION RECORD]"):
                  _old, separator, remainder = body.partition("\n\n")
                  body = remainder if separator else ""
              enriched["text"] = prefix + ("\n\n" + body if body else "")
              return enriched


          '''
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines()) + '\n'
          if marker not in text:
              raise SystemExit('retriever insertion marker not found')
          text = text.replace(marker, '\n' + helper + 'def _format_result_block(result):\n', 1)
          old_loop = '''        result = _chunk_result(row, meta, path, plc_model, task_type)
        if reference["match_type"] == "manual_instruction" and (
'''
          new_loop = '''        result = _chunk_result(row, meta, path, plc_model, task_type)
        if reference["match_type"] == "structured_instruction":
            result = _augment_structured_instruction(connection, schema, result)
        if reference["match_type"] == "manual_instruction" and (
'''
          if old_loop not in text:
              raise SystemExit('structured reference loop not found')
          text = text.replace(old_loop, new_loop, 1)
          retriever.write_text(text, encoding='utf-8')
          PY
      - name: Backfill missing structured operands from existing page artifacts
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, sqlite3
          from pathlib import Path
          from types import SimpleNamespace

          spec = importlib.util.spec_from_file_location('fxbuilder', 'tools/build_fx3u_knowledge_v3.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          db = Path('resources/knowledge/fx3u_knowledge.sqlite')
          con = sqlite3.connect(db)
          con.row_factory = sqlite3.Row
          rows = con.execute('SELECT id,manual_id,source_pages_json,operands_json FROM instructions ORDER BY id').fetchall()
          before = sum(bool(json.loads(row['operands_json'] or '[]')) for row in rows)
          changed = 0
          for row in rows:
              existing = json.loads(row['operands_json'] or '[]')
              if existing:
                  continue
              pages = []
              for page_number in json.loads(row['source_pages_json'] or '[]')[:4]:
                  page = con.execute(
                      'SELECT compact_layout FROM page_artifacts WHERE manual_id=? AND pdf_page=?',
                      (row['manual_id'], page_number),
                  ).fetchone()
                  if page is None:
                      continue
                  table_rows = con.execute(
                      'SELECT table_index,rows_json,table_text FROM tables WHERE manual_id=? AND pdf_page=? ORDER BY table_index',
                      (row['manual_id'], page_number),
                  ).fetchall()
                  tables = []
                  for table in table_rows:
                      tables.append({
                          'index': table['table_index'],
                          'rows': json.loads(table['rows_json'] or '[]'),
                          'text': table['table_text'] or '',
                      })
                  pages.append(SimpleNamespace(compact_layout=page['compact_layout'] or '', tables=tables))
              operands = mod.parse_operand_schema(pages)
              if operands:
                  con.execute(
                      'UPDATE instructions SET operands_json=? WHERE id=?',
                      (json.dumps(operands, ensure_ascii=False, separators=(',', ':')), row['id']),
                  )
                  changed += 1
          con.commit()
          after = con.execute("SELECT COUNT(*) FROM instructions WHERE operands_json <> '[]'").fetchone()[0]
          print(f'nonempty operands: {before} -> {after}; backfilled={changed}')

          for opcode in ('fmov', 'zrst'):
              check = con.execute(
                  "SELECT manual_id,operands_json FROM instructions WHERE opcode_norm=? ORDER BY manual_id",
                  (opcode,),
              ).fetchall()
              print(opcode, [json.loads(item['operands_json']) for item in check])
              assert check and all(json.loads(item['operands_json']) for item in check), opcode
          fmov = json.loads(con.execute(
              "SELECT operands_json FROM instructions WHERE opcode_norm='fmov' AND manual_id='fx3_programming_r'"
          ).fetchone()[0])
          destination = next(item for item in fmov if item.get('position') == 'D')
          devices = destination.get('applicable_devices') or []
          assert 'KnM' in devices and 'M' not in devices, devices
          zrst = json.loads(con.execute(
              "SELECT operands_json FROM instructions WHERE opcode_norm='zrst' AND manual_id='fx3_programming_r'"
          ).fetchone()[0])
          d1 = next(item for item in zrst if item.get('position') == 'D1')
          assert 'M' in (d1.get('applicable_devices') or []), d1
          con.close()

          manifest_path = Path('resources/knowledge/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['builder_version'] = '3.0.1'
          manifest['database_bytes'] = db.stat().st_size
          manifest['database_sha256'] = hashlib.sha256(db.read_bytes()).hexdigest()
          manifest['structured_instruction_backfill'] = {
              'method': 'generic operand/applicable-device matrix extraction',
              'source': 'existing authoritative page_artifacts and tables',
              'changed_empty_instruction_rows': changed,
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify runtime retrieval surfaces structured applicability
        shell: bash
        run: |
          PYTHONPATH=src python - <<'PY'
          import knowledge_retriever_core as core
          result = core.retrieve_knowledge(
              'FX3U FMOV 指令的操作数、适用软元件和主要限制是什么？',
              plc_model='FX3U', task_type='generate', top_k=5, char_budget=9000,
          )
          assert result, 'no FMOV retrieval result'
          text = '\n'.join(item['text'] for item in result[:3])
          print(text[:6000])
          assert '[STRUCTURED INSTRUCTION RECORD]' in text
          assert 'applicable=' in text
          assert 'KnM' in text
          result2 = core.retrieve_knowledge(
              'FX3U 批量清零连续 M 软元件区间应该使用什么指令？',
              plc_model='FX3U', task_type='generate', top_k=5, char_budget=9000,
          )
          print('\n--- reset query ---\n' + '\n'.join(item['text'] for item in result2[:3])[:6000])
          assert any(str(item.get('instruction_opcode', '')).upper() == 'ZRST' for item in result2[:5])
          PY
          python -m compileall -q src tools/build_fx3u_knowledge_v3.py
      - name: Commit branch-only fix and updated SQLite
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-repair-localization.yml
          git add tools/build_fx3u_knowledge_v3.py src/knowledge_retriever_core.py resources/knowledge/fx3u_knowledge.sqlite resources/knowledge/manifest.json
          git commit -m "fix(rag): extract structured instruction device applicability"
          git push origin HEAD:fix/rejected-json-repair-20260913
