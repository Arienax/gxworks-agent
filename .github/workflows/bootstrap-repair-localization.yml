name: Bootstrap structured instruction extraction fix

on:
  push:
    branches:
      - fix/rejected-json-repair-20260913

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rejected-json-repair-20260913
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install builder dependencies
        run: python -m pip install pypdf pdfplumber
      - name: Patch builder, backfill SQLite, and patch retriever
        run: |
          python tools/bootstrap_structured_instruction_fix.py
          python tools/bootstrap_fix_generated_retriever.py
      - name: Verify structured retrieval
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tools/build_fx3u_knowledge_v3.py
          python -c "import knowledge_retriever_core as c; r=c.retrieve_knowledge('FX3U FMOV 指令的操作数、适用软元件和主要限制是什么？',plc_model='FX3U',task_type='generate',top_k=5,char_budget=9000); t='\\n'.join(x['text'] for x in r[:3]); print(t[:6000]); assert r and '[STRUCTURED INSTRUCTION RECORD]' in t and 'applicable=' in t and 'KnM' in t"
          python -c "import knowledge_retriever_core as c; r=c.retrieve_knowledge('FX3U 批量清零连续 M 软元件区间应该使用什么指令？',plc_model='FX3U',task_type='generate',top_k=5,char_budget=9000); print('\\n'.join(x['text'] for x in r[:3])[:6000]); assert any(str(x.get('instruction_opcode','')).upper()=='ZRST' for x in r[:5])"
      - name: Commit branch-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-repair-localization.yml tools/bootstrap_structured_instruction_fix.py tools/bootstrap_fix_generated_retriever.py
          git add tools/build_fx3u_knowledge_v3.py src/knowledge_retriever_core.py resources/knowledge/fx3u_knowledge.sqlite resources/knowledge/manifest.json
          git commit -m "fix(rag): extract structured instruction device applicability"
          git push origin HEAD:fix/rejected-json-repair-20260913
