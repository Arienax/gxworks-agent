name: Audit conservative structured backfill drops

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
    paths: [.github/workflows/audit-dropped-instruction-backfill.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current candidate
        uses: actions/checkout@v4
        with:
          ref: fix/rejected-json-repair-20260913
          lfs: true
          fetch-depth: 1
      - name: Checkout original 157-row backfill snapshot
        uses: actions/checkout@v4
        with:
          ref: 9e159793d8a3e9efe8768ff5b7522030be8c864d
          path: original-backfill
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare original backfill with audited candidate
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path

          def rows(path):
              con = sqlite3.connect(path)
              data = {
                  (r[0], r[1]): {
                      'manual_id': r[0], 'opcode_norm': r[1], 'opcode': r[2],
                      'operands': json.loads(r[3] or '[]'), 'chunk_id': r[4],
                  }
                  for r in con.execute('SELECT manual_id,opcode_norm,opcode,operands_json,chunk_id FROM instructions')
              }
              con.close()
              return data

          old = rows('original-backfill/resources/knowledge/fx3u_knowledge.sqlite')
          new = rows('resources/knowledge/fx3u_knowledge.sqlite')
          dropped = []
          changed = []
          for key, before in old.items():
              after = new.get(key)
              if not after or not before['operands']:
                  continue
              if not after['operands']:
                  dropped.append({
                      'manual_id': before['manual_id'], 'opcode': before['opcode'],
                      'old_operands': before['operands'], 'chunk_id': after['chunk_id'],
                  })
              elif before['operands'] != after['operands']:
                  changed.append({
                      'manual_id': before['manual_id'], 'opcode': before['opcode'],
                      'old_operands': before['operands'], 'new_operands': after['operands'],
                  })
          report = {'dropped_count': len(dropped), 'dropped': dropped, 'changed_count': len(changed)}
          Path('conservative-backfill-drops.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          assert len(dropped) == 8, f'expected 8 conservative drops, got {len(dropped)}'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: conservative-backfill-drops
          path: conservative-backfill-drops.json
