name: Windows Web Release

# Ordinary source pushes do not publish. The marker is only for an explicitly
# requested bootstrap release; later releases use a v* tag or workflow_dispatch.
on:
  push:
    branches: [main, fix/generation-result-refresh]
    tags: ['v*']
    paths: ['.github/workflows/windows-release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'New release tag, e.g. v0.1.0-preview.2 (must match web/package.json)'
        required: true
        type: string
      prerelease:
        description: 'Publish as a pre-release'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-web-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/generation-result-refresh') && contains(github.event.head_commit.message, '[release-windows]'))
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out source and real LFS resources
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements/web.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Resolve and validate release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content web/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $tag = $env:INPUT_TAG }
          elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          else { $tag = "v$version-preview.$env:GITHUB_RUN_NUMBER" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid release tag.' }
          if (($tag -split '-')[0] -ne "v$version") { throw 'Tag must match web/package.json version.' }
          $pre = $tag.Contains('-') -or ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:INPUT_PRERELEASE -eq 'true')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "artifact_name=windows-web-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
          "prerelease=$($pre.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Install Web runtime and packaging dependencies
        run: |
          python -m pip install -r requirements/web.txt pyinstaller==6.21.0
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency consistency check failed.' }
          python -m compileall -q src scripts/web_entry.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed.' }
      - name: Validate generation repair and diagnostic regressions
        run: |
          python -m pip install pytest==9.1.1
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed.' }
          python -m pytest -q tests/test_generation_repair_assembly.py tests/test_generation_repair_workflow.py tests/test_generation_workflow.py tests/test_application_job_errors.py tests/test_approval_modes.py --junitxml=generation-repair-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Generation regression tests failed.' }
      - name: Validate real generation delivery HTTP boundary
        run: |
          python -m pytest -q tests/test_generation_delivery.py tests/test_web_api.py tests/test_web_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Generation delivery API regression failed.' }
      - name: Validate materialized knowledge resources
        shell: python
        run: |
          import json, sqlite3
          from pathlib import Path
          import numpy as np
          root = Path('resources/knowledge')
          db = root / 'fx3u_knowledge.sqlite'
          with db.open('rb') as source:
              assert source.read(16) == b'SQLite format 3\0', 'SQLite is missing or is an LFS pointer'
          connection = sqlite3.connect(db.resolve().as_uri() + '?mode=ro', uri=True)
          try:
              assert connection.execute('PRAGMA quick_check').fetchall() == [('ok',)], 'Corrupt knowledge database'
          finally:
              connection.close()
          with np.load(root / 'fx3u_dense_lsa.npz', allow_pickle=False) as dense:
              assert dense.files, 'Dense index is empty or is an LFS pointer'
              for name in dense.files:
                  dense[name]  # Force every array to load without enabling pickle.
          json.loads((root / 'manifest.json').read_text(encoding='utf-8-sig'))
          assert Path('web/package-lock.json').is_file(), 'Missing frontend lockfile'
      - name: Build x86 simulator gateway from repository source
        run: |
          $gateway = Join-Path $env:RUNNER_TEMP 'gxworks-simulator-gateway'
          & ./tools/build_simulator_gateway.ps1 -OutputDirectory $gateway
          if ($LASTEXITCODE -ne 0) { throw 'Gateway compilation failed.' }
          "GATEWAY_DIRECTORY=$gateway" >> $env:GITHUB_ENV
      - name: Build Windows x64 Web package
        run: |
          & ./scripts/build_web_package.ps1 -Python (Get-Command python.exe).Source -GatewayDirectory $env:GATEWAY_DIRECTORY
          if ($LASTEXITCODE -ne 0) { throw 'Web package build failed.' }
      - name: Archive, extract, and smoke-test the actual release ZIP
        shell: python
        run: |
          import hashlib, json, os, platform, shutil, struct, subprocess, sys, tempfile
          from pathlib import Path
          package = Path('dist/GXWorks-Agent-Web').resolve()
          assets = Path('release-assets').resolve()
          assets.mkdir()
          exe = package / 'GXWorks-Agent-Web.exe'
          with exe.open('rb') as binary:
              assert binary.read(2) == b'MZ', 'Not a Windows executable'
              binary.seek(0x3c)
              binary.seek(struct.unpack('<I', binary.read(4))[0])
              assert binary.read(4) == b'PE\0\0', 'Missing PE header'
              assert struct.unpack('<H', binary.read(2))[0] == 0x8664, 'Web executable is not x64'
          for forbidden in ('config.json', '.env', '.git', '.venv', 'node_modules', 'workspace', 'workspaces'):
              assert not (package / forbidden).exists(), f'Unexpected private/development file: {forbidden}'
          info = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'tag': os.environ['RELEASE_TAG'],
              'source_commit': os.environ['GITHUB_SHA'],
              'source_ref': os.environ['GITHUB_REF'],
              'workflow_run': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'python': platform.python_version(),
              'build_os': platform.platform(),
              'web_executable_architecture': 'x64',
              'gateway_architecture': 'x86',
              'native_gx_simulator_plc_acceptance_performed': False,
              'code_signed': False,
              'python_packages': json.loads(subprocess.check_output([sys.executable, '-m', 'pip', 'list', '--format=json'], text=True)),
          }
          (package / 'build-info.json').write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          shutil.copy2(package / 'build-info.json', assets / 'build-info.json')
          name = f"GXWorks-Agent-Web-{os.environ['RELEASE_TAG']}-Windows-x64"
          zip_path = Path(shutil.make_archive(str(assets / name), 'zip', package.parent, package.name))
          with tempfile.TemporaryDirectory(prefix='gx-release-unzip-') as temporary:
              shutil.unpack_archive(str(zip_path), temporary, 'zip')
              result = subprocess.run(
                  [sys.executable, 'scripts/web_package_smoke.py', '--package-dir', str(Path(temporary) / package.name), '--archive', 'build/web/PYZ-00.pyz'],
                  text=True, capture_output=True, timeout=120,
              )
              if result.returncode:
                  raise RuntimeError('Extracted release smoke test failed:\n' + result.stdout + '\n' + result.stderr)
              smoke = json.loads(result.stdout)
              assert smoke.get('ok') is True, smoke
              assert smoke.get('qt_modules_excluded') is True, smoke
              smoke['tested_zip'] = zip_path.name
              smoke['source_commit'] = os.environ['GITHUB_SHA']
              (assets / 'package-smoke.json').write_text(json.dumps(smoke, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print(json.dumps(smoke, ensure_ascii=False, indent=2))
          lines = []
          for path in sorted(assets.iterdir()):
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              lines.append(f'{digest}  {path.name}')
          (assets / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
      - name: Browser-test the packaged specification-to-generation UI
        run: |
          python -m pip install playwright==1.55.0
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependency installation failed.' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed.' }
          python scripts/web_spec_handoff_smoke.py --web-dist dist/GXWorks-Agent-Web/web/dist --report release-assets/web-spec-handoff.json
          if ($LASTEXITCODE -ne 0) { throw 'Specification handoff browser regression failed.' }
      - name: Real backend and packaged frontend result delivery acceptance
        run: |
          python scripts/web_generation_e2e.py --web-dist dist/GXWorks-Agent-Web/web/dist --report release-assets/generation-delivery-e2e.json
          if ($LASTEXITCODE -ne 0) { throw 'Real backend/browser delivery regression failed.' }
      - name: Refresh checksums including browser test evidence
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          assets = Path('release-assets')
          lines = []
          for path in sorted(assets.iterdir()):
              if path.name == 'SHA256SUMS.txt':
                  continue
              with path.open('rb') as stream:
                  lines.append(f'{hashlib.file_digest(stream, "sha256").hexdigest()}  {path.name}')
          (assets / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
      - name: Retain verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-web-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/web/warn-web.txt
            build/web/xref-web.html
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - name: Download verified Windows assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets
      - name: Publish only after all assets are uploaded and verified
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          def gh(*args):
              result = subprocess.run(['gh', *args], text=True, capture_output=True)
              if result.returncode:
                  raise RuntimeError(result.stderr)
              return result
          tag, repo, sha = os.environ['RELEASE_TAG'], os.environ['GH_REPO'], os.environ['GITHUB_SHA']
          assets = Path('release-assets')
          for line in (assets / 'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines():
              digest, name = line.split('  ', 1)
              assert Path(name).name == name, 'Unsafe asset name'
              with (assets / name).open('rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == digest, 'Artifact checksum mismatch'
          info = json.loads((assets / 'build-info.json').read_text())
          assert info['source_commit'] == sha and info['tag'] == tag
          assert json.loads((assets / 'package-smoke.json').read_text())['ok'] is True
          refs = json.loads(gh('api', f'repos/{repo}/git/matching-refs/tags/{tag}').stdout)
          if any(ref['ref'] == f'refs/tags/{tag}' for ref in refs):
              target = json.loads(gh('api', f'repos/{repo}/commits/{tag}').stdout)['sha']
              assert target == sha, 'Existing tag points at a different commit; refusing to move it'
          def find_release():
              # The by-tag endpoint excludes drafts. List drafts, then use their numeric ID.
              pages = json.loads(gh('api', f'repos/{repo}/releases?per_page=100', '--paginate', '--slurp').stdout)
              matches = [item for page in pages for item in page if item['tag_name'] == tag]
              assert len(matches) <= 1, 'Ambiguous release tag'
              return matches[0] if matches else None
          release = find_release()
          if release is not None:
              assert release['target_commitish'] == sha, 'Existing release belongs to another source commit'
              assert release['prerelease'] == (os.environ['IS_PRERELEASE'] == 'true'), 'Existing release type differs'
          notes = Path('release-notes.md')
          notes.write_text(
              f'# GXWorks Agent Web {tag}\n\n'
              'Windows x64 portable Web workbench. Download the Windows-x64.zip asset, '
              'extract the complete GXWorks-Agent-Web folder, and run start-web.cmd. '
              'Python, Node.js and Qt do not need to be installed separately.\n\n'
              'Windows x64 Web 工作台预览包：下载 Windows-x64.zip，完整解压 GXWorks-Agent-Web 目录，双击 start-web.cmd。\n\n'
              '## Changes\n'
              '- Automatically save validated local programs; history remains available without a second acceptance step.\n'
              '- Add workspace approval modes, a grouped toolbar and visible file exports.\n'
              '- Normal Windows startup no longer asks for an operator/read-only role.\n\n'
              '## Build and validation\n'
              f'- Source commit: {sha}\n'
              '- Built on GitHub Actions Windows Server 2022 with Python 3.12.\n'
              '- Includes built frontend, real LFS knowledge resources, and the repository-built x86 simulator gateway.\n'
              '- The extracted ZIP passed server startup, static asset, operator login, read-only workspace, and Qt-exclusion checks.\n'
              '- SHA256SUMS.txt, build-info.json, package-smoke.json and web-spec-handoff.json are attached.\n'
              '- Browser checks cover confirmation, empty-input generation, preview navigation and approval boundaries using a mocked API; no model or PLC is called by these UI tests.\n'
              '- generation-delivery-e2e.json additionally checks a real HTTP backend against the packaged frontend, including visible SVG decoding, autosave, file download, approval settings, refresh, reload, blocked outcomes and retry. Only model replies are fixtures; no live API call or PLC operation is made.\n\n'
              '## Scope and limitations\n'
              '- Preview software; unsigned executable and portable ZIP, not a signed installer.\n'
              '- GX Works2, GX Simulator2 and MX Component are not bundled; install licensed software separately for those integrations.\n'
              '- The gateway was bundled but not started by CI. No native GX, simulator, real PLC, or Windows 10/11 interactive acceptance is claimed.\n'
              '- Packaging does not validate arbitrary GXW/FBD programs or enable real PLC writes.\n',
              encoding='utf-8',
          )
          paths = sorted(path for path in assets.iterdir() if path.is_file())
          expected_names = {
              f'GXWorks-Agent-Web-{tag}-Windows-x64.zip', 'SHA256SUMS.txt',
              'build-info.json', 'package-smoke.json', 'web-spec-handoff.json',
              'generation-delivery-e2e.json', 'autosaved-toolbar.png', 'approval-settings.png',
          }
          assert {path.name for path in paths} == expected_names, 'Release asset set differs'
          for report_name in ('web-spec-handoff.json', 'generation-delivery-e2e.json'):
              report = json.loads((assets / report_name).read_text(encoding='utf-8'))
              assert report['ok'] is True and report['cases']
              assert all(case['passed'] is True for case in report['cases'])
          args = ['release', 'create', tag, *map(str, paths), '--target', sha,
                  '--title', f'GXWorks Agent Web {tag} (Windows x64)', '--notes-file', str(notes), '--draft']
          if os.environ['IS_PRERELEASE'] == 'true':
              args += ['--prerelease', '--latest=false']
          if release is None:
              gh(*args)
              release = find_release()
              assert release is not None, 'Created draft was not found'
          # Never replace an existing asset, including when retrying a failed upload.
          present = {asset['name']: asset for asset in release['assets']}
          assert len(present) == len(release['assets']), 'Duplicate existing asset names'
          assert set(present) <= {path.name for path in paths}, 'Unexpected existing release assets'
          for path in paths:
              if path.name in present:
                  with path.open('rb') as stream:
                      assert present[path.name].get('digest') == 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest(), 'Existing asset differs; use a new tag'
          missing = [str(path) for path in paths if path.name not in present]
          if missing:
              assert release['draft'], 'Never modify a published release'
              gh('release', 'upload', tag, *missing)
          release_id = release['id']
          release = json.loads(gh('api', f'repos/{repo}/releases/{release_id}').stdout)
          uploaded = {asset['name']: asset for asset in release['assets']}
          for path in paths:
              remote = uploaded[path.name]
              assert remote['state'] == 'uploaded' and remote['size'] == path.stat().st_size, 'Incomplete asset upload'
              if remote.get('digest'):
                  with path.open('rb') as stream:
                      assert remote['digest'] == 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest()
          if release['draft']:
              gh('api', f'repos/{repo}/releases/{release_id}', '--method', 'PATCH', '-F', 'draft=false')
          published = json.loads(gh('api', f'repos/{repo}/releases/{release_id}').stdout)
          assert published['draft'] is False and {asset['name'] for asset in published['assets']} == expected_names
          assert json.loads(gh('api', f'repos/{repo}/commits/{tag}').stdout)['sha'] == sha
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"Published [{tag}]({published['html_url']}) with {len(expected_names)} verified assets.\n")
          print(published['html_url'])
