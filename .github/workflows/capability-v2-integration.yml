name: Capability V2 Integration
on:
  push:
    branches: [feat/universal-api-capabilities]
    paths: ['tools/.capability-v2/**', '.github/workflows/capability-v2-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capability-v2-integration
  cancel-in-progress: false
jobs:
  integrate-and-validate:
    if: github.repository == 'Arienax/gxworks-agent' && github.ref == 'refs/heads/feat/universal-api-capabilities'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify implementation bytes and apply to the unchanged feature baseline
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          base = '2a00fb5cb48e736cf306197d648c5a8b32c234db'
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          assert all(p.startswith('tools/.capability-v2/') or p == '.github/workflows/capability-v2-integration.yml' for p in changed), 'Feature baseline changed; do not overwrite concurrent work'
          root = Path('tools/.capability-v2')
          corrections = {
              '01.part': [(3777, 3778, '3', '0')],
              '02.part': [(4188, 4189, 'H', ''), (4374, 4376, 'a6', ''), (4387, 4389, 'Os', ''), (14004, 14004, '', '0')],
          }
          parts = []
          for path in sorted(root.glob('*.part')):
              encoded = base64.b64encode(path.read_bytes()).decode('ascii')
              for start, end, before, after in reversed(corrections.get(path.name, [])):
                  assert encoded[start:end] == before, 'Unexpected transport bytes'
                  encoded = encoded[:start] + after + encoded[end:]
              parts.append(base64.b64decode(encoded, validate=True))
          assert len(parts) == 6
          data = gzip.decompress(b''.join(parts))
          assert hashlib.sha256(data).hexdigest() == '6cca581f56144964b61406ebdc0b20e18478184ce8eeee08c3d35d1b33b38862', 'Implementation differs from locally tested source'
          subprocess.run(['git', 'apply', '--index', '--whitespace=error'], input=data, check=True)
          PY
          git rm -r tools/.capability-v2 .github/workflows/capability-v2-integration.yml
          git diff --cached --check
      - name: Install isolated validation dependencies
        run: |
          python -m pip install -r requirements/web.txt pytest playwright==1.55.0
          python -m pip check
          npm ci --prefix web
      - name: Regenerate the HTTP contract and typed client
        run: |
          python scripts/export_web_schema.py
          npm run types --prefix web
          git add web/openapi.json web/src/api/generated.ts
      - name: Validate Python runtime and compatibility boundaries
        run: |
          mkdir -p capability-v2-evidence
          python -m compileall -q src tests scripts/web_model_settings_e2e.py
          python -m pytest -q tests/test_model_contract.py tests/test_model_capabilities.py tests/test_application_settings.py tests/test_model_detection.py tests/test_model_provider.py tests/test_model_profile_config.py tests/test_model_profile_deletion.py tests/test_web_contract.py tests/test_web_frontend_state_flow.py tests/test_model_stream_cancellation.py tests/test_model_presentation.py tests/test_plc_core_boundary.py --junitxml=capability-v2-evidence/python.xml | tee capability-v2-evidence/python.log
      - name: Validate dynamic controls and production Web build
        run: |
          node --experimental-strip-types --test web/tests/model-parameters.test.mjs | tee capability-v2-evidence/frontend.log
          npm run build --prefix web
      - name: Exercise browser settings, persistence and effective request policy
        run: |
          python -m playwright install --with-deps chromium
          python scripts/web_model_settings_e2e.py --web-dist web/dist --evidence capability-v2-evidence
      - name: Commit the validated implementation without modifying main
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add typed capability contract v2 and data-driven model runtime'
          git push origin HEAD:refs/heads/feat/universal-api-capabilities
          git rev-parse HEAD > capability-v2-evidence/commit.txt
      - name: Record source and validation evidence
        if: always()
        run: |
          mkdir -p capability-v2-evidence
          git diff --cached --binary > capability-v2-evidence/uncommitted-validation.patch
          git diff --stat > capability-v2-evidence/unstaged.txt
          if [ -d web/dist ]; then tar -cf capability-v2-evidence/web-dist.tar -C web dist; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-v2-evidence
          path: capability-v2-evidence/
          retention-days: 7
