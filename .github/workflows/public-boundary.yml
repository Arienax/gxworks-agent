name: Source boundary and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.14'
      - run: python checks/test_public_boundary.py
      - run: python tools/check_public_boundary.py
      - run: python -m compileall -q src
      - run: python -m pip install -c requirements/development.constraints.txt -r requirements/web.txt
      - run: python checks/source_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
