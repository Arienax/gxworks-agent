name: Bootstrap dirty structured operand repair

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
    paths: [.github/workflows/bootstrap-repair-dirty-structured-operands.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rejected-json-repair-20260913
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline builder dependencies
        run: python -m pip install pypdf pdfplumber
      - name: Reparse malformed structured operand rows generically
        run: python tools/bootstrap_repair_dirty_structured_operands.py
      - name: Verify no global header/glyph leakage remains
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_instruction_applicability_rag.py
          python -m compileall -q src tools/build_fx3u_knowledge_v3.py
      - name: Commit branch-only cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-repair-dirty-structured-operands.yml tools/bootstrap_repair_dirty_structured_operands.py
          git add resources/knowledge/fx3u_knowledge.sqlite resources/knowledge/manifest.json
          git commit -m "fix(rag): clean malformed structured operand records"
          git push origin HEAD:fix/rejected-json-repair-20260913
