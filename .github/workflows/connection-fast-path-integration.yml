name: Connection Fast Path Integration
on:
  push:
    branches: [feat/universal-api-capabilities]
    paths: ['.github/workflows/connection-fast-path-integration.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply fast connection-test source edits
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/application/settings.py')
          text = path.read_text(encoding='utf-8')
          old_imports = '        from model_provider import create_provider, test_model_profile\n        from application.model_detection import inspect_openai_compatible\n'
          assert old_imports in text, 'connection-test imports changed'
          text = text.replace(old_imports, '        from model_provider import test_model_profile\n', 1)
          start = text.index('        try:\n            # Preserve the existing connection-test behavior and error mapping.\n')
          end = text.index('        except Exception as error:\n', start)
          replacement = (
              '        try:\n'
              '            # Connection testing is deliberately a fast path. Capability\n'
              '            # discovery is an explicit, potentially expensive operation behind\n'
              '            # /settings/detect and must never be triggered by this button.\n'
              '            message = test_model_profile(copy.deepcopy(frozen), key)\n'
              '            return {"status": "connected", "message": message}\n'
          )
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          path = Path('web/src/features/Settings.tsx')
          text = path.read_text(encoding='utf-8')
          old = (
              '                if (result.status === "connected") {\n'
              '                  const discovery = parseDiscovery(result.message);\n'
              '                  setMessage(discovery?.note || t("连接成功"));\n'
              '                } else setError(result.message || t("连接失败"));'
          )
          new = (
              '                if (result.status === "connected")\n'
              '                  setMessage(result.message || t("连接成功"));\n'
              '                else setError(result.message || t("连接失败"));'
          )
          assert old in text, 'Settings.tsx connection result block changed'
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('tests/test_application_settings.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def test_test_connection_uses_unsaved_draft_and_key_without_any_mutation(')
          end = text.index('\n\n\ndef test_test_connection_does_not_echo_provider_errors', start)
          replacement = (
              'def test_test_connection_uses_unsaved_draft_and_key_without_any_mutation(settings_env, monkeypatch):\n'
              '    import model_provider\n'
              '    env = settings_env\n'
              '    monkeypatch.setattr(model_provider, "create_provider",\n'
              '        lambda *args, **kwargs: pytest.fail("connection test must not run capability discovery"))\n'
              '    result = env.service.test_connection("fake", profile={"id": "fake", "model": "draft-model",\n'
              '        "generation_defaults": {"top_p": 0.3}}, api_key="temporary-secret")\n'
              '    assert result["status"] == "connected"\n'
              '    assert result["message"] == "连接成功，API Key 和服务地址有效。"\n'
              '    profile, key = env.calls[0]\n'
              '    assert key == "temporary-secret" and profile["model"] == "draft-model"\n'
              '    assert not env.path.exists() and not env.writes and not env.deletes\n'
              '    assert _profile(env.service.public_settings())["model"] == "model-a"'
          )
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          git diff --check
      - name: Validate targeted backend and frontend
        run: |
          python -m pip install -r requirements/web.txt pytest
          npm ci --prefix web
          python -m pytest -q tests/test_application_settings.py
          npm run build --prefix web
      - name: Commit source changes only
        run: |
          git add src/application/settings.py web/src/features/Settings.tsx tests/test_application_settings.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep connection testing separate from capability discovery'
          git push origin HEAD:refs/heads/feat/universal-api-capabilities
