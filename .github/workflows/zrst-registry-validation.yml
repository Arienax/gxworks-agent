name: ZRST Registry Validation

on:
  push:
    branches: [fix/json-field-patch-repair-20260914]
    paths:
      - tools/patch_zrst_registry_once.py
      - tests/test_zrst_registry_alignment.py
      - .github/workflows/zrst-registry-validation.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/json-field-patch-repair-20260914
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply registry alignment
        run: python tools/patch_zrst_registry_once.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements/web.txt
      - name: Validate ZRST across catalogue schema validator and RAG
        run: |
          python -m compileall -q src tests
          python -m pytest -q tests/test_zrst_registry_alignment.py tests/test_instruction_registry.py tests/test_generation_opcode_contract.py tests/test_field_patch_repair_protocol.py tests/test_instruction_applicability_rag.py
          git diff --check
      - name: Commit validated registry fix
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix(registry): register FX3U ZRST and exact reset arity'
          file_pattern: 'resources/instructions/mitsubishi/*.json'
