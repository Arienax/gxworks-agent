name: One-shot Current Main Prerelease

on:
  push:
    branches: [main]
    paths: ['.github/workflows/prerelease-once.yml']

permissions:
  contents: write

concurrency:
  group: one-shot-current-main-prerelease
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      SOURCE_SHA: 73cf246ea7fdb5ec71d5601fb9fcc8b9c2e9ccea
      RELEASE_TAG: v0.1.0-preview.1
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the requested main snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements/web.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install packaging dependencies
        run: |
          python -m pip install -r requirements/web.txt pyinstaller==6.21.0
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency consistency check failed.' }
          python -m compileall -q src scripts/web_entry.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed.' }

      - name: Validate materialized release resources
        shell: python
        run: |
          import json, sqlite3
          from pathlib import Path
          import numpy as np
          root = Path('resources/knowledge')
          db = root / 'fx3u_knowledge.sqlite'
          with db.open('rb') as source:
              assert source.read(16) == b'SQLite format 3\0', 'SQLite is missing or is an LFS pointer'
          connection = sqlite3.connect(db.resolve().as_uri() + '?mode=ro', uri=True)
          try:
              assert connection.execute('PRAGMA quick_check').fetchall() == [('ok',)], 'Corrupt knowledge database'
          finally:
              connection.close()
          with np.load(root / 'fx3u_dense_lsa.npz', allow_pickle=False) as dense:
              assert dense.files, 'Dense index is empty or is an LFS pointer'
              for name in dense.files:
                  dense[name]
          json.loads((root / 'manifest.json').read_text(encoding='utf-8-sig'))
          assert Path('web/package-lock.json').is_file(), 'Missing frontend lockfile'

      - name: Build x86 simulator gateway
        run: |
          $gateway = Join-Path $env:RUNNER_TEMP 'gxworks-simulator-gateway'
          & ./tools/build_simulator_gateway.ps1 -OutputDirectory $gateway
          if ($LASTEXITCODE -ne 0) { throw 'Gateway compilation failed.' }
          "GATEWAY_DIRECTORY=$gateway" >> $env:GITHUB_ENV

      - name: Build Windows x64 Web package
        run: |
          & ./scripts/build_web_package.ps1 -Python (Get-Command python.exe).Source -GatewayDirectory $env:GATEWAY_DIRECTORY
          if ($LASTEXITCODE -ne 0) { throw 'Web package build failed.' }

      - name: Archive and smoke-test the exact release package
        shell: python
        run: |
          import hashlib, json, os, platform, shutil, subprocess, sys, tempfile
          from pathlib import Path
          package = Path('dist/GXWorks-Agent-Web').resolve()
          assets = Path('release-assets').resolve()
          assets.mkdir()
          info = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'tag': os.environ['RELEASE_TAG'],
              'source_commit': os.environ['SOURCE_SHA'],
              'workflow_run': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'python': platform.python_version(),
              'build_os': platform.platform(),
              'web_executable_architecture': 'x64',
              'gateway_architecture': 'x86',
              'code_signed': False,
          }
          (package / 'build-info.json').write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          shutil.copy2(package / 'build-info.json', assets / 'build-info.json')
          archive_base = assets / f"GXWorks-Agent-Web-{os.environ['RELEASE_TAG']}-Windows-x64"
          zip_path = Path(shutil.make_archive(str(archive_base), 'zip', package.parent, package.name))
          with tempfile.TemporaryDirectory(prefix='gx-release-unzip-') as temporary:
              shutil.unpack_archive(str(zip_path), temporary, 'zip')
              result = subprocess.run(
                  [sys.executable, 'scripts/web_package_smoke.py', '--package-dir', str(Path(temporary) / package.name), '--archive', 'build/web/PYZ-00.pyz'],
                  text=True, capture_output=True, timeout=120,
              )
              if result.returncode:
                  raise RuntimeError('Extracted release smoke test failed:\n' + result.stdout + '\n' + result.stderr)
              smoke = json.loads(result.stdout)
              assert smoke.get('ok') is True, smoke
              smoke['tested_zip'] = zip_path.name
              smoke['source_commit'] = os.environ['SOURCE_SHA']
              (assets / 'package-smoke.json').write_text(json.dumps(smoke, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          lines = []
          for path in sorted(assets.iterdir()):
              with path.open('rb') as stream:
                  lines.append(f"{hashlib.file_digest(stream, 'sha256').hexdigest()}  {path.name}")
          (assets / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Retain release assets
        uses: actions/upload-artifact@v4
        with:
          name: current-main-prerelease-${{ github.run_id }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish prerelease
        run: |
          $notes = @"
          # GXWorks Agent Web $env:RELEASE_TAG

          Windows x64 prerelease built from the requested main snapshot.

          - Source commit: $env:SOURCE_SHA
          - Portable Windows Web package; extract the full GXWorks-Agent-Web folder before running.
          - The packaged ZIP passed the repository's extracted-package smoke test.
          - SHA256SUMS.txt, build-info.json and package-smoke.json are attached.
          - Preview software; executable is unsigned.
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          $existing = gh release view $env:RELEASE_TAG --repo $env:GH_REPO 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release tag already exists: $env:RELEASE_TAG" }
          $assets = @(Get-ChildItem release-assets -File | ForEach-Object { $_.FullName })
          & gh release create $env:RELEASE_TAG @assets --repo $env:GH_REPO --target $env:SOURCE_SHA --title "GXWorks Agent Web $env:RELEASE_TAG (Windows x64)" --notes-file release-notes.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'GitHub prerelease publication failed.' }
          $published = gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json tagName,isPrerelease,isDraft,targetCommitish,url | ConvertFrom-Json
          if (-not $published.isPrerelease -or $published.isDraft) { throw 'Release publication state is incorrect.' }
          if ($published.targetCommitish -ne $env:SOURCE_SHA) { throw 'Release target differs from requested main snapshot.' }
          Write-Host $published.url
