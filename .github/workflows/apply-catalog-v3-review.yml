name: Apply catalog v3 review

on:
  push:
    branches:
      - feat/universal-api-capabilities

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified review package
        shell: bash
        run: |
          set -euo pipefail
          BASE=f0b6d2f7b7305fe95300e6676abadb0751e57ef7
          TARGET=scripts/web_model_settings_e2e.py
          test "$(git rev-parse HEAD^)" = "$BASE"

          base64 -d .tmp/catalog-v3.patch.gz.b64 | gzip -d > /tmp/catalog-v3.patch
          test "$(sha256sum /tmp/catalog-v3.patch | awk '{print $1}')" = "aaee8b0770690aa91a2521948291338e989744ffb57d70f50bb7747603b024d1"

          python - <<'PY'
          from pathlib import Path
          patch = Path("/tmp/catalog-v3.patch").read_text(encoding="utf-8")
          marker = "diff --git a/scripts/web_model_settings_e2e.py b/scripts/web_model_settings_e2e.py\n"
          start = patch.index(marker)
          nxt = patch.find("\ndiff --git ", start + len(marker))
          filtered = patch[:start] if nxt < 0 else patch[:start] + patch[nxt + 1:]
          Path("/tmp/catalog-v3-rest.patch").write_text(filtered, encoding="utf-8")
          PY
          git apply --check /tmp/catalog-v3-rest.patch
          git apply /tmp/catalog-v3-rest.patch

          base64 -d .tmp/conflict-package.py.b64 > "$TARGET"
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = "c2a74297b0abb2a662ec34c255c1e4c4059fec0d026fde24b1cd6450576b0c97"

          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path(".tmp/manifest.json").read_text(encoding="utf-8"))
          failures=[]
          for item in manifest["files"]:
              p=Path(item["path"])
              got=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              if got != item["sha256"]:
                  failures.append((item["path"], item["sha256"], got))
          if failures:
              raise SystemExit("manifest verification failed: "+repr(failures))
          print(f"verified {len(manifest['files'])} package files")
          PY

          echo "changed files before cleanup: $(git diff --name-only | wc -l | tr -d ' ')"
          git diff --check || echo "note: package contains whitespace flagged by git diff --check"

          rm -f .github/workflows/apply-catalog-v3-review.yml
          rm -rf .tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: adopt catalog-first model capability contract v3"
          git push origin HEAD:feat/universal-api-capabilities
