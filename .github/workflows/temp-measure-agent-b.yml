name: Temporary Agent B Request Measurement
on:
  push:
    branches: [feat/comprehensive-runtime-diagnostics-20260914]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure prompt and schema
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY' > agent-b-metrics.txt
          import json
          from application.generation_agent import _GENERATION_REQUEST, _strict_generation_projection
          from plc_generation_context import (
              build_generation_instructions, _select_system_prompt, _build_model_context,
              _build_knowledge_context, _with_confirmed_context,
          )
          from plc_generation_contract import ladder_response_schema
          from instruction_registry import generation_app_instr_mnemonics

          confirmed = {
              'summary': '分类规则必须严格保留：1~3 为 A 类，4~6 为 B 类，7~9 为 C 类。',
              'selected_approach': {'approach_id':'direct','generation_contract':{
                  'required_opcodes': [], 'forbidden_opcodes': [], 'required_devices': [],
                  'forbidden_devices': [], 'required_structures':['direct_logic'],
                  'forbidden_structures': [], 'any_of_opcode_groups': [], 'any_of_structure_groups': []}},
              'io_table': [
                  {'address':'X0','kind':'X','label':'输入'}, {'address':'Y0','kind':'Y','label':'输出'}
              ],
              'parameters': [], 'execution_semantics': []
          }
          projected = _strict_generation_projection(confirmed)
          schema = ladder_response_schema(allow_partial=False, plc_model='FX3U')
          compact_schema = json.dumps(schema, ensure_ascii=False, separators=(',', ':'))
          selected = _select_system_prompt('ladder', is_edit_mode=False, user_requirement=_GENERATION_REQUEST,
              task_type='generate', plc_model='FX3U', confirmed_context=projected)
          knowledge = _build_knowledge_context(_GENERATION_REQUEST, plc_model='FX3U', task_type='generate',
              confirmed_context=projected, evidence=None)
          profile = _build_model_context('FX3U', projected, compact=bool(knowledge))
          compact_profile = _build_model_context('FX3U', projected, compact=True)
          confirmed_block = _with_confirmed_context('', projected)
          prompt = build_generation_instructions(_GENERATION_REQUEST, plc_model='FX3U', target_mode='ladder',
              is_edit_mode=False, task_type='generate', confirmed_context=projected, current_version_json=None)
          print('PROMPT_CHARS=', len(prompt))
          print('SELECTED_PROMPT_CHARS=', len(selected))
          print('SCHEMA_CHARS=', len(compact_schema))
          print('SCHEMA_OCCURRENCES_IN_PROMPT=', prompt.count(compact_schema))
          print('PROFILE_CONTEXT_CHARS=', len(profile))
          print('COMPACT_PROFILE_CONTEXT_CHARS=', len(compact_profile))
          print('KNOWLEDGE_CONTEXT_CHARS=', len(knowledge))
          print('CONFIRMED_BLOCK_CHARS=', len(confirmed_block))
          print('FX3U_OPCODE_ENUM_COUNT=', len(generation_app_instr_mnemonics('FX3U')))
          print('CONFIRMED_CHARS=', len(json.dumps(projected, ensure_ascii=False, separators=(',', ':'))))
          print('COMPACT_PROFILE=', compact_profile.replace('\n','\\n'))
          PY
          cat agent-b-metrics.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-b-metrics
          path: agent-b-metrics.txt
