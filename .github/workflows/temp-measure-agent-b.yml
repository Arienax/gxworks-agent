name: Temporary Agent B Compact Validation
on:
  push:
    branches: [feat/comprehensive-runtime-diagnostics-20260914]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Compile changed generation code
        run: python -m compileall -q src/application/generation_agent.py tests/test_confirmed_generation_regressions_20260914.py
      - name: Run compact Agent B and generation regressions
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_confirmed_generation_regressions_20260914.py \
            tests/test_generation_fast_path.py \
            tests/test_generation_workflow.py \
            tests/test_generation_repair_workflow.py
      - name: Measure new Agent B request size
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY' > agent-b-metrics.txt
          import json
          import application.generation_agent as agent

          confirmed = {
              'summary': '分类规则必须严格保留：1~3 为 A 类，4~6 为 B 类，7~9 为 C 类。',
              'selected_approach': {'approach_id':'direct','generation_contract':{
                  'required_opcodes': [], 'forbidden_opcodes': [], 'required_devices': [],
                  'forbidden_devices': [], 'required_structures':['direct_logic'],
                  'forbidden_structures': [], 'any_of_opcode_groups': [], 'any_of_structure_groups': []}},
              'io_table': [
                  {'address':'X0','kind':'X','label':'输入'}, {'address':'Y0','kind':'Y','label':'输出'}
              ],
              'parameters': [], 'execution_semantics': []
          }
          projected = agent._strict_generation_projection(confirmed)
          original_knowledge = agent._build_knowledge_context
          agent._build_knowledge_context = lambda *args, **kwargs: ''
          try:
              prompt = agent._build_agent_b_prompt(projected, 'FX3U')
          finally:
              agent._build_knowledge_context = original_knowledge
          schema = json.dumps(agent._compact_response_schema(), ensure_ascii=False, separators=(',', ':'))
          compact = {'r':[{'b':[{'i':['NO X0',{'or':[['NO M20'],['NO M21'],['NO M22']]}], 'o':['COIL Y0']}]}]}
          full = agent._expand_compact_ladder(compact, projected)
          compact_text = json.dumps(compact, ensure_ascii=False, separators=(',', ':'))
          full_text = json.dumps(full, ensure_ascii=False, separators=(',', ':'))
          print('AGENT_B_PROMPT_CHARS=', len(prompt))
          print('COMPACT_SCHEMA_CHARS=', len(schema))
          print('SAMPLE_COMPACT_CHARS=', len(compact_text))
          print('SAMPLE_EXPANDED_CHARS=', len(full_text))
          print('OUTPUT_RATIO=', round(len(compact_text) / len(full_text), 4))
          PY
          cat agent-b-metrics.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-b-compact-metrics
          path: agent-b-metrics.txt
