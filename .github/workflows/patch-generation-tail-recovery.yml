name: Patch generation tail recovery

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
    paths:
      - .github/workflows/patch-generation-tail-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: |
          python tools/patch_generation_tail_recovery_once.py
          python -m py_compile src/application/generation.py tests/test_generation_rejected_json_repair.py
          git diff --check
          git status --short
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run focused generation recovery tests
        run: python -m pytest -q tests/test_generation_rejected_json_repair.py
      - name: Refuse concurrent branch overwrite
        run: |
          git fetch origin refs/heads/fix/rejected-json-repair-20260913
          remote_sha="$(git rev-parse FETCH_HEAD)"
          test "$remote_sha" = "$GITHUB_SHA" || {
            echo "Branch moved during patch: trigger=$GITHUB_SHA remote=$remote_sha" >&2
            exit 1
          }
      - name: Commit source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/generation.py tests/test_generation_rejected_json_repair.py
          git commit -m "fix(generation): recover tiny punctuation JSON tails"
          git push origin HEAD:refs/heads/fix/rejected-json-repair-20260913
