name: Temporary opaque-record regression repair

on:
  push:
    branches:
      - experiment/construction-examples-ab-20260929
    paths:
      - .github/workflows/repair-opaque-record-ci.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install existing headless dependencies
        run: python -m pip install -r requirements.txt
      - name: Reproduce the exact stale assertion before editing
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          result = subprocess.run([
              'python', '-m', 'pytest', '-q',
              'tests/test_gxw_lossless.py::test_unsupported_known_class_record_is_opaque_but_does_not_hide_neighbor',
          ], capture_output=True, text=True)
          print(result.stdout)
          print(result.stderr)
          if result.returncode != 1 or 'DID NOT RAISE' not in result.stdout:
              raise SystemExit('Expected the known stale writer-rejection assertion; refusing to patch a different failure')
          PY
      - name: Update only the obsolete lossless test and add framing regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('tests/test_gxw_lossless.py')
          expected_blob = '40690e8048da8da51098a72f4c7dc5eeca81704b'
          actual_blob = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          if actual_blob != expected_blob:
              raise SystemExit(f'Test source changed: {actual_blob}; refusing to overwrite')
          text = path.read_text(encoding='utf-8')
          old = '''    with pytest.raises(GXWFormatError):
                  serialize_structured_pou(image.projection)  # strict production writer unchanged
          '''
          new = '''    # The writer preserves safely framed unsupported layouts as opaque bytes;
              # round-trip support does not promote them to strict semantic support.
              serialized = serialize_structured_pou(image.projection)
              assert serialized == bytes(mutant)
              with pytest.raises(GXWFormatError, match="port size"):
                  parse_structured_pou(serialized)
              reparsed = inspect_program(serialized).projection
              assert reparsed.unknown_records[0].raw == image.projection.unknown_records[0].raw
          '''
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one obsolete assertion')
          text = text.replace(old, new, 1)
          old_tail = '''    assert patched.unknown_records[0].raw == image.projection.unknown_records[0].raw


          @pytest.mark.parametrize("override", [{"expected_sha256": "bad"}, {"new_symbol": "X100"}, {"node_offset": 0}, {"new_symbol": "X\\0"}])
          '''
          new_tail = '''    assert patched.unknown_records[0].raw == image.projection.unknown_records[0].raw
              assert next(n for n in patched.nodes if n.offset == node.offset).symbol == "X2"


          @pytest.mark.parametrize("damage", ["length", "class", "truncated"])
          def test_structured_writer_rejects_invalid_opaque_record_framing(damage):
              from dataclasses import replace

              _, _, raw = pou(native_source())
              program = parse_structured_pou(raw)
              unsupported = next(n for n in program.nodes if n.kind_code == 7)
              mutant = bytearray(raw)
              struct.pack_into("<I", mutant, unsupported.offset + unsupported.record_length - 32, 20)
              projection = inspect_program(bytes(mutant)).projection
              opaque, = projection.unknown_records
              damaged_raw = bytearray(opaque.raw)
              if damage == "length":
                  struct.pack_into("<I", damaged_raw, 0, opaque.record_length + 4)
              elif damage == "class":
                  struct.pack_into("<I", damaged_raw, 4, opaque.record_class + 1)
              else:
                  del damaged_raw[-1:]
              damaged = replace(projection, unknown_records=(replace(opaque, raw=bytes(damaged_raw)),))
              with pytest.raises(GXWFormatError, match="opaque record framing"):
                  serialize_structured_pou(damaged)


          @pytest.mark.parametrize("override", [{"expected_sha256": "bad"}, {"new_symbol": "X100"}, {"node_offset": 0}, {"new_symbol": "X\\0"}])
          '''
          if text.count(old_tail) != 1:
              raise SystemExit('Expected exactly one opaque-neighbor regression tail')
          text = text.replace(old_tail, new_tail, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff --stat
          git diff -- tests/test_gxw_lossless.py
      - name: Run the existing full PR fast-validation surface
        shell: bash
        env:
          BASE_SHA: ef0a255a5acb227c4fab6a158ec96fa8b928d2be
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m pytest -q tests/test_source_layout.py tests/test_architecture_boundaries.py tests/test_plc_core_boundary.py
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/opaque-repair-changed-files.txt
          {
            while IFS= read -r path; do
              if [[ "$path" =~ ^tests/test_.*\.py$ && ! "$path" =~ ^tests/test_(source_layout|architecture_boundaries|plc_core_boundary)\.py$ && -f "$path" ]]; then
                printf '%s\n' "$path"
              fi
            done < /tmp/opaque-repair-changed-files.txt
            printf '%s\n' tests/test_gxw_lossless.py tests/test_gxw_network_blocks.py tests/test_gxw_object_model.py
            if grep -Eq '^(resources/locales/|src/shared/i18n\.py$)' /tmp/opaque-repair-changed-files.txt; then
              printf '%s\n' tests/test_i18n.py
            fi
          } | sort -u > /tmp/opaque-repair-targeted-tests.txt
          mapfile -t changed_tests < /tmp/opaque-repair-targeted-tests.txt
          python -m pytest -q "${changed_tests[@]}"
          python scripts/mcp_smoke.py
      - name: Publish only the tested file, with source and branch guards
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.parse
          import urllib.request

          path = 'tests/test_gxw_lossless.py'
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          if changed != [path]:
              raise SystemExit(f'Unexpected modified paths: {changed}')
          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          if repo != 'Arienax/gxworks-agent' or branch != 'experiment/construction-examples-ab-20260929':
              raise SystemExit('Refusing to write outside the requested PR branch')
          def request(endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + '/' + endpoint,
                  data=data,
                  method='GET' if payload is None else 'PUT',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          current = request('branches/' + urllib.parse.quote(branch, safe=''))
          if current['commit']['sha'] != os.environ['EXPECTED_HEAD']:
              raise SystemExit('PR branch advanced during validation; refusing to publish stale work')
          blob = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path], text=True).strip()
          result = request('contents/' + path, {
              'message': 'test(gxw): align opaque-record round trips and retain framing guards',
              'branch': branch,
              'sha': blob,
              'content': base64.b64encode(Path(path).read_bytes()).decode(),
          })
          print('Published tested repair commit:', result['commit']['sha'])
          PY
