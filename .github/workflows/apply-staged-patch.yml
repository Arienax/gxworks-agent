name: Apply staged prompt cleanup patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.patch-staging/**'
      - '.github/workflows/apply-staged-patch.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/prompt-cleanup-io-binding-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 2
      - name: Reassemble and apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          cat .patch-staging/*.diff > /tmp/round.patch
          sha256sum /tmp/round.patch
          git apply --check /tmp/round.patch
          git apply /tmp/round.patch
          git diff --check
          python -m compileall -q src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run focused regressions on the applied patch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r requirements/web.txt pytest
          python -m pytest -q             tests/test_analysis_prompt_routing.py             tests/test_analysis_format_repair.py             tests/test_spec_choice_metadata.py             tests/test_confirmed_reconfirmation.py             tests/test_io_protocol_and_gx_fastpath.py
      - name: Commit validated patch and remove staging transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .patch-staging
          rm .github/workflows/apply-staged-patch.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clean analysis prompts and bind known-address polarity"
          git push origin HEAD:fix/prompt-cleanup-io-binding-20260921
