name: Verify runtime ownership candidate
on:
  pull_request:
    paths: ['.ownership-source/**', '.github/workflows/ownership-source-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/prompt-cleanup-io-binding-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      HAYSTACK_TELEMETRY_ENABLED: 'false'
      HAYSTACK_AUTO_TRACE_ENABLED: 'false'
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct hash-checked candidate and remove temporary transport
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path, PurePosixPath
          data = json.loads(Path('.ownership-source/manifest.json').read_text())
          assert data['base_commit'] == '5fd2f7108a628da43c2b5bb06adb26b648bec7a1'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == data['base_commit']
          patch = b''.join(p.read_bytes() for p in sorted(Path('.ownership-source').glob('*.patch')))
          assert hashlib.sha256(patch).hexdigest() == data['patch_sha256']
          for name in data['files']:
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
          subprocess.run(['git','apply','--unidiff-zero','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
          for name, expected in data['files'].items():
              value = Path(name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest() == expected, name
          subprocess.run(['git','rm','-r','--','.ownership-source','.github/workflows/ownership-source-verify.yml'],check=True)
          Path(os.environ['RUNNER_TEMP'],'ownership-candidate.json').write_text(json.dumps(data))
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('PLC_AI_DATA_DIR='+str(Path(os.environ['RUNNER_TEMP'],'synthetic-settings'))+'\n')
          PY
      - name: Install real dependencies and offline evaluation tools
        run: |
          python -m pip install -r requirements.txt
          npm install --prefix "$RUNNER_TEMP/context-eval" --no-audit --no-fund promptfoo@0.123.1
      - name: Test settings ownership, scoped entrypoints and compatibility
        run: >-
          python -m pytest -q
          tests/test_model_contract.py tests/test_model_profile_config.py
          tests/test_architecture_boundaries.py tests/test_source_layout.py
          tests/test_web_source_entrypoints.py tests/test_application_settings.py
          tests/test_analysis_design_rag.py tests/test_gxw2_skill_reranker.py
          tests/test_agent_b_measurement.py tests/test_call_contract_regressions.py
          tests/test_workbench_service.py tests/test_model_provider.py
          tests/test_instruction_contract_alignment.py
          --junitxml=validation-ownership/targeted.xml
      - name: Exercise source diagnostics and real offline replay
        run: |
          PYTHONPATH=src python scripts/web_entry.py --self-test-settings
          PYTHONPATH=src python scripts/web_entry.py --self-test-knowledge
          python scripts/context_replay.py --output validation-ownership/replay.json
          "$RUNNER_TEMP/context-eval/node_modules/.bin/promptfoo" eval -c evals/context-replay/promptfooconfig.yaml --no-cache -o validation-ownership/promptfoo.json
      - name: Record full suite and reject new failures without hiding old ones
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, xml.etree.ElementTree as ET
          from pathlib import Path
          with open('validation-ownership/full.log','w') as log:
              run = subprocess.run([sys.executable,'-m','pytest','-q','--junitxml=validation-ownership/full.xml'],stdout=log,stderr=subprocess.STDOUT)
          assert run.returncode in (0,1), run.returncode
          root = ET.parse('validation-ownership/full.xml')
          rows = list(root.iter('testcase'))
          failed = sorted(row.get('classname')+'::'+row.get('name') for row in rows if row.find('failure') is not None or row.find('error') is not None)
          baseline = json.loads(Path(os.environ['RUNNER_TEMP'],'ownership-candidate.json').read_text())['baseline_failed_nodes']
          new = sorted(set(failed)-set(baseline))
          skipped = sum(row.find('skipped') is not None for row in rows)
          result = {'passed':len(rows)-len(failed)-skipped,'failed':len(failed),'skipped':skipped,'failed_nodes':failed,'new_failures':new,'pytest_exit':run.returncode}
          Path('validation-ownership/full-comparison.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          assert not new, new
          PY
      - name: Publish verified blobs only without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          data = json.loads(Path(os.environ['RUNNER_TEMP'],'ownership-candidate.json').read_text())
          elements = []
          hashes = {}
          for name, expected in data['files'].items():
              value = Path(name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest() == expected, name
              request = urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',method='POST',data=json.dumps({'encoding':'base64','content':base64.b64encode(value).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response:
                  actual = json.load(response)['sha']
              assert actual == expected, name
              elements.append({'path':name,'mode':'100644','type':'blob','sha':actual})
              hashes[name] = hashlib.sha256(value).hexdigest()
          result = {'base_commit':data['base_commit'],'verification_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree_elements':elements,'sha256':hashes,'patch_sha256':data['patch_sha256']}
          Path('validation-ownership/verified-blobs.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-ownership-verification
          path: validation-ownership
          retention-days: 7
