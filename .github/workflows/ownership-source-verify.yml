name: Verify runtime ownership candidate
on:
  pull_request:
    paths: ['.ownership-source/**', '.github/workflows/ownership-source-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/prompt-cleanup-io-binding-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      HAYSTACK_TELEMETRY_ENABLED: 'false'
      HAYSTACK_AUTO_TRACE_ENABLED: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct checked source and verify the legacy preference follow-up
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path, PurePosixPath
          data = json.loads(Path('.ownership-source/manifest.json').read_text())
          assert data['base_commit'] == '5fd2f7108a628da43c2b5bb06adb26b648bec7a1'
          subprocess.run(['git','merge-base','--is-ancestor',data['base_commit'],'HEAD'],check=True)
          def blob(value):
              return hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest()
          def apply(patch, zero=False):
              flags = ['--unidiff-zero'] if zero else []
              subprocess.run(['git','apply',*flags,'--check','-'],input=patch,check=True)
              subprocess.run(['git','apply',*flags,'-'],input=patch,check=True)
          patch = b''.join(p.read_bytes() for p in sorted(Path('.ownership-source').glob('*.patch')))
          assert hashlib.sha256(patch).hexdigest() == data['patch_sha256']
          for name in data['files']:
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
          apply(patch, True)
          for name, expected in data['files'].items():
              assert blob(Path(name).read_bytes()) == expected, name
          follow = Path('.ownership-source/followup.diff').read_bytes()
          assert hashlib.sha256(follow).hexdigest() == '5e2324b33e13c6314b0c18d58b6375619af8b77e746565c6abde5fd07c8ecdfe'
          apply(follow)
          data['files'].update({'src/storage/config.py':'52983dc3b743e060b0ccf34f4866f7e5e344cd4f','tests/test_model_profile_config.py':'71e6d1a52a25732060713abc13ff9755004be17a','docs/architecture/runtime-ownership.md':'c16808713ac65db8786c24262a026db73395d017'})
          for name, expected in data['files'].items():
              assert blob(Path(name).read_bytes()) == expected, name
          data['prior_full_suite_run'] = 35639616810
          data['followup_sha256'] = hashlib.sha256(follow).hexdigest()
          subprocess.run(['git','rm','-r','--','.ownership-source','.github/workflows/ownership-source-verify.yml'],check=True)
          Path(os.environ['RUNNER_TEMP'],'ownership-candidate.json').write_text(json.dumps(data))
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('PLC_AI_DATA_DIR='+str(Path(os.environ['RUNNER_TEMP'],'synthetic-settings'))+'\n')
          PY
      - name: Install actual runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify legacy migration, wire preferences and settings boundaries
        run: >-
          python -m pytest -q
          tests/test_model_profile_config.py tests/test_model_contract.py
          tests/test_architecture_boundaries.py tests/test_source_layout.py
          tests/test_web_source_entrypoints.py tests/test_application_settings.py
          tests/test_workbench_service.py tests/test_call_contract_regressions.py
          --junitxml=validation-ownership/targeted.xml
      - name: Exercise isolated runtime diagnostics
        run: |
          PYTHONPATH=src python scripts/web_entry.py --self-test-settings
          PYTHONPATH=src python scripts/web_entry.py --self-test-knowledge
      - name: Publish verified blobs only without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          data = json.loads(Path(os.environ['RUNNER_TEMP'],'ownership-candidate.json').read_text())
          elements = []
          hashes = {}
          for name, expected in data['files'].items():
              value = Path(name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest() == expected, name
              request = urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',method='POST',data=json.dumps({'encoding':'base64','content':base64.b64encode(value).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response:
                  actual = json.load(response)['sha']
              assert actual == expected, name
              elements.append({'path':name,'mode':'100644','type':'blob','sha':actual})
              hashes[name] = hashlib.sha256(value).hexdigest()
          result = {'base_commit':data['base_commit'],'verification_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree_elements':elements,'sha256':hashes,'patch_sha256':data['patch_sha256'],'followup_sha256':data['followup_sha256'],'prior_full_suite_run':data['prior_full_suite_run'],'final_head_full_suite':'not_yet_run'}
          Path('validation-ownership/verified-blobs.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-ownership-verification
          path: validation-ownership
          retention-days: 7
