name: Confirmed Generation Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/application/analysis_context.py'
      - 'src/application/analysis_results.py'
      - 'src/application/compact_protocol.py'
      - 'src/application/confirmed_generation_context.py'
      - 'src/application/context_compiler.py'
      - 'src/application/generation_receipts.py'
      - 'src/application/planning.py'
      - 'src/application/prompts.py'
      - 'src/application/request_intent.py'
      - 'src/knowledge/**'
      - 'src/plc/specification/**'
      - 'tests/test_analysis_*.py'
      - 'tests/test_confirmed_*.py'
      - 'tests/test_context_compiler.py'
      - 'tests/test_context_refresh_runtime.py'
      - 'tests/test_instruction_fact_context.py'
      - 'tests/test_intent_evidence_handoff.py'
      - 'tests/test_optional_hardware_parameters.py'
      - 'tests/test_spec_choice_metadata.py'
      - 'tests/test_approach_contracts.py'
      - 'tests/test_program_exploration.py'
      - '.github/workflows/confirmed-generation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: confirmed-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HAYSTACK_TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: true
      - name: Detect current-push confirmed-generation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          from="$BEFORE_SHA"
          if [[ -z "$from" || "$from" == "null" || "$from" =~ ^0+$ ]]; then
            from="$BASE_SHA"
          fi
          to="$HEAD_SHA"
          if [[ -z "$to" || "$to" == "null" ]]; then
            to=HEAD
          fi
          git diff --name-only "$from"..."$to" > changed-files.txt
          if grep -Eq '^(src/(application/(analysis_context\.py|analysis_results\.py|compact_protocol\.py|confirmed_generation_context\.py|context_compiler\.py|generation_receipts\.py|planning\.py|prompts\.py|request_intent\.py)|knowledge/|plc/specification/)|tests/(test_analysis_.*\.py|test_confirmed_.*\.py|test_context_compiler\.py|test_context_refresh_runtime\.py|test_instruction_fact_context\.py|test_intent_evidence_handoff\.py|test_optional_hardware_parameters\.py|test_spec_choice_metadata\.py|test_approach_contracts\.py|test_program_exploration\.py)|\.github/workflows/confirmed-generation\.yml$)' changed-files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Test analysis-to-confirmed-generation handoff
        if: steps.scope.outputs.run == 'true'
        run: >-
          python -m pytest -q
          tests/test_analysis_design_rag.py
          tests/test_analysis_format_repair.py
          tests/test_analysis_mode_jobs.py
          tests/test_analysis_prompt_integration.py
          tests/test_analysis_prompt_routing.py
          tests/test_confirmed_input_protocol.py
          tests/test_confirmed_compatibility.py
          tests/test_confirmed_reconfirmation.py
          tests/test_context_compiler.py
          tests/test_context_refresh_runtime.py
          tests/test_instruction_fact_context.py
          tests/test_intent_evidence_handoff.py
          tests/test_optional_hardware_parameters.py
          tests/test_spec_choice_metadata.py
          tests/test_approach_contracts.py
          tests/test_program_exploration.py
