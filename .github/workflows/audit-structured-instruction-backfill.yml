name: Audit structured instruction backfill

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/rejected-json-repair-20260913
          lfs: true
          fetch-depth: 1
      - name: Checkout baseline main
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline-main
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit exactly the newly backfilled structured instruction rows
        run: |
          python tools/audit_structured_instruction_backfill.py \
            --baseline baseline-main/resources/knowledge/fx3u_knowledge.sqlite \
            --candidate resources/knowledge/fx3u_knowledge.sqlite \
            --output structured-instruction-backfill-audit.json
      - name: Audit every non-empty structured instruction row
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from collections import Counter
          from pathlib import Path
          import importlib.util

          spec = importlib.util.spec_from_file_location('operand_audit', 'tools/audit_structured_instruction_backfill.py')
          audit = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(audit)

          db = Path('resources/knowledge/fx3u_knowledge.sqlite')
          rows = audit._load_rows(db)
          selected = [row for row in rows.values() if row.get('operands_json')]
          connection = audit._open_candidate(db)
          issues = []
          for row in selected:
              issues.extend(audit.audit_record(connection, row))
          connection.close()
          issues.extend(audit.cross_manual_issues(selected))

          report = {
              'audited_records': len(selected),
              'issue_severity_counts': dict(sorted(Counter(x['severity'] for x in issues).items())),
              'issue_code_counts': dict(sorted(Counter(x['code'] for x in issues).items())),
              'issues': issues,
          }
          Path('structured-instruction-global-audit.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('GLOBAL_AUDITED', report['audited_records'])
          print('GLOBAL_SEVERITY', json.dumps(report['issue_severity_counts'], ensure_ascii=False, sort_keys=True))
          print('GLOBAL_CODES', json.dumps(report['issue_code_counts'], ensure_ascii=False, sort_keys=True))
          for item in issues[:160]:
              print(json.dumps(item, ensure_ascii=False, sort_keys=True))
          errors = [item for item in issues if item['severity'] == 'error']
          assert not errors, f'{len(errors)} structured operand errors remain globally'
          PY
      - name: Print backfill audit summary
        run: |
          python - <<'PY'
          import json
          report = json.load(open('structured-instruction-backfill-audit.json', encoding='utf-8'))
          print('BACKFILLED', report['backfilled_records'])
          print('MANUALS', json.dumps(report['manual_counts'], ensure_ascii=False, sort_keys=True))
          print('SEVERITY', json.dumps(report['issue_severity_counts'], ensure_ascii=False, sort_keys=True))
          print('CODES', json.dumps(report['issue_code_counts'], ensure_ascii=False, sort_keys=True))
          issues = report['issues']
          print('--- ERRORS ---')
          for item in [x for x in issues if x['severity'] == 'error']:
              print(json.dumps(item, ensure_ascii=False, sort_keys=True))
          print('--- WARNINGS ---')
          for item in [x for x in issues if x['severity'] == 'warning'][:120]:
              print(json.dumps(item, ensure_ascii=False, sort_keys=True))
          PY
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: structured-instruction-audits
          path: |
            structured-instruction-backfill-audit.json
            structured-instruction-global-audit.json
          if-no-files-found: error
