name: Audit structured instruction backfill

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/rejected-json-repair-20260913
          lfs: true
          fetch-depth: 1
      - name: Checkout baseline main
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline-main
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit exactly the newly backfilled structured instruction rows
        run: |
          python tools/audit_structured_instruction_backfill.py \
            --baseline baseline-main/resources/knowledge/fx3u_knowledge.sqlite \
            --candidate resources/knowledge/fx3u_knowledge.sqlite \
            --output structured-instruction-backfill-audit.json
      - name: Print compact audit summary
        run: |
          python - <<'PY'
          import json
          report = json.load(open('structured-instruction-backfill-audit.json', encoding='utf-8'))
          print('BACKFILLED', report['backfilled_records'])
          print('MANUALS', json.dumps(report['manual_counts'], ensure_ascii=False, sort_keys=True))
          print('SEVERITY', json.dumps(report['issue_severity_counts'], ensure_ascii=False, sort_keys=True))
          print('CODES', json.dumps(report['issue_code_counts'], ensure_ascii=False, sort_keys=True))
          issues = report['issues']
          print('--- ERRORS ---')
          for item in [x for x in issues if x['severity'] == 'error']:
              print(json.dumps(item, ensure_ascii=False, sort_keys=True))
          print('--- WARNINGS ---')
          for item in [x for x in issues if x['severity'] == 'warning'][:120]:
              print(json.dumps(item, ensure_ascii=False, sort_keys=True))
          PY
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: structured-instruction-backfill-audit
          path: structured-instruction-backfill-audit.json
          if-no-files-found: error
