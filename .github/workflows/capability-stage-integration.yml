name: Capability Stage Integration
on:
  push:
    branches: [feat/universal-api-capabilities]
    paths: ['tools/.two-stage/**', '.github/workflows/capability-stage-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capability-stage-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Arienax/gxworks-agent' && github.ref == 'refs/heads/feat/universal-api-capabilities'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply and verify locally validated source bytes
        run: |
          mkdir -p two-stage-evidence
          python - <<'PY'
          import subprocess
          from pathlib import Path
          base = 'e511510b50299a094848f2ffa738bb4ee0ee22f0'
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          assert all(p.startswith('tools/.two-stage/') or p == '.github/workflows/capability-stage-integration.yml' for p in changed), 'Baseline changed; preserve concurrent work'
          paths = [str(p) for p in sorted(Path('tools/.two-stage').glob('*.patch'))]
          assert len(paths) == 3
          subprocess.run(['git', 'apply', '--index', '--whitespace=error', *paths], check=True)
          expected = {
              'docs/integrations/capability-contract-v2.md': '39661450bd36e454135d77643f66b5e5add174c6',
              'scripts/web_model_settings_e2e.py': '640e2877e983eee95c5beaebf37d7c12c05e39c2',
              'src/application/model_detection.py': '580ef708fab233ece3f008e30d950dcd35cec8a5',
              'src/application/settings.py': '117ec126267ce6f9bab4eecea0e3e382fa29c240',
              'src/integrations/web/app.py': '8aaa56bb5e368527bce90cf2183556c3913a20d4',
              'src/integrations/web/schemas.py': '12191610488557dd40824dfb4ccdd0988eab18e9',
              'src/model_contract.py': 'ed8050c6f8c18e54909b6deb067a3c669996956f',
              'src/model_probes.py': 'c806ace7a1fae5d110aa032cf2d897758588488b',
              'tests/test_application_settings.py': '23596ba991cca64320e39b23a98585fd169c6a85',
              'tests/test_model_capabilities.py': '4512f35264e06c6a6151aa826f5ee9631307d5b1',
              'tests/test_model_detection.py': '765fa875e03ee6a79c720e8bcb0a8ac75ce614be',
              'tests/test_model_detection_stages.py': 'd86be0b58beb15c528c2b2b8161fc2f254585d6f',
              'web/openapi.json': '641883aa651576e779ee8e24c39c443c6cd58f9a',
              'web/src/api/generated.ts': 'e22e91e6d0419a3c3a8a5d72fe5ffb991bc2f0f0',
              'web/src/features/ModelParameterControls.tsx': '10198aac8412fd218272695abf7296bc6f06c7df',
              'web/src/features/Settings.tsx': '1a0777fe82229f58a3e37abcd54194f2e125c1e4',
              'web/src/features/modelParameters.ts': 'cd7bea30aa85ef83dfbf7cd333a9cd31cfeb449d',
              'web/src/i18n.ts': '2c6fa1cec03a740419a91d294c7538ac0b0b1840',
              'web/tests/model-parameters.test.mjs': 'ffb185a7e2dbc856ab6872e03888ec8f360778be',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == sha, f'{path}: source bytes differ: {actual}'
          PY
          git diff --cached --check
      - name: Install isolated validation dependencies
        run: |
          python -m pip install -r requirements/web.txt pytest playwright==1.55.0
          python -m pip check
          npm ci --prefix web
      - name: Generate HTTP schema and typed client
        run: |
          python scripts/export_web_schema.py
          npm run types --prefix web
          git add web/openapi.json web/src/api/generated.ts
      - name: Validate two-stage runtime and compatibility boundaries
        run: |
          python -m compileall -q src tests scripts/web_model_settings_e2e.py
          python -m pytest -q tests/test_model_contract.py tests/test_model_capabilities.py tests/test_application_settings.py tests/test_model_provider.py tests/test_model_detection.py tests/test_model_detection_stages.py tests/test_model_profile_config.py tests/test_model_profile_deletion.py tests/test_web_contract.py tests/test_web_frontend_state_flow.py tests/test_model_stream_cancellation.py tests/test_model_presentation.py tests/test_plc_core_boundary.py --junitxml=two-stage-evidence/python.xml | tee two-stage-evidence/python.log
      - name: Validate dynamic parameter controls and production build
        run: |
          node --experimental-strip-types --test web/tests/model-parameters.test.mjs web/tests/module-resolution.test.mjs | tee two-stage-evidence/frontend.log
          npm run build --prefix web
      - name: Exercise model listing, quick check, deep scan and persistence in browser
        run: |
          python -m playwright install --with-deps chromium
          python scripts/web_model_settings_e2e.py --web-dist web/dist --evidence two-stage-evidence
      - name: Commit tested source without modifying main
        run: |
          git rm -r tools/.two-stage
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: split model discovery into quick checks and deep parameter scans'
          git push origin HEAD:refs/heads/feat/universal-api-capabilities
          git rev-parse HEAD > two-stage-evidence/commit.txt
      - name: Preserve validation evidence
        if: always()
        run: |
          mkdir -p two-stage-evidence
          git diff --cached --binary > two-stage-evidence/uncommitted.patch
          if [ -d tools/.two-stage ]; then cp tools/.two-stage/*.patch two-stage-evidence/; fi
          if [ -d web/dist ]; then tar -cf two-stage-evidence/web-dist.tar -C web dist; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-stage-evidence
          path: two-stage-evidence/
          retention-days: 7
