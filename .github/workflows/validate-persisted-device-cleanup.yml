name: Validate persisted device cleanup

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
    paths:
      - .github/workflows/validate-persisted-device-cleanup.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rejected-json-repair-20260913
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy

      - name: Verify persisted database identity
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sqlite3
          db = pathlib.Path('resources/knowledge/fx3u_knowledge.sqlite')
          manifest = json.load(open('resources/knowledge/manifest.json', encoding='utf-8'))
          digest = hashlib.sha256(db.read_bytes()).hexdigest()
          print('DB_SHA256', digest)
          print('DB_BYTES', db.stat().st_size)
          assert digest == manifest['database_sha256'], (digest, manifest['database_sha256'])
          assert db.stat().st_size == manifest['database_bytes']
          with sqlite3.connect(db) as con:
              assert con.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              assert con.execute('PRAGMA foreign_key_check').fetchall() == []
              print('ENTITY_INDEX', con.execute('SELECT COUNT(*) FROM entity_index').fetchone()[0])
              print('DEVICE_RECORDS', con.execute('SELECT COUNT(*) FROM device_records').fetchone()[0])
          PY

      - name: Run evidence-aware structured audit
        run: |
          python tools/audit_structured_knowledge_quality_v2.py \
            --database resources/knowledge/fx3u_knowledge.sqlite \
            --output /tmp/persisted-structured-audit.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/persisted-structured-audit.json', encoding='utf-8'))
          print('AUDIT_SEVERITY', json.dumps(report['issue_severity_counts'], sort_keys=True))
          print('AUDIT_CODES', json.dumps(report['issue_code_counts'], sort_keys=True))
          print('DEVICE_STATS', json.dumps(report['stats']['device_records'], sort_keys=True))
          assert report['integrity_check'] == 'ok'
          assert report['foreign_key_violations'] == 0
          assert report['issues'] == [], report['issues'][:20]
          PY

      - name: Run structured cleanup regression tests
        run: |
          python -m pytest -q \
            tests/test_device_entity_cleanup.py \
            tests/test_structured_knowledge_quality.py

      - name: Run canonical 220-case RAG benchmark
        run: |
          cp resources/knowledge/manifest.json /tmp/benchmark-manifest.json
          python tools/evaluate_rag_benchmark.py \
            --database resources/knowledge/fx3u_knowledge.sqlite \
            --benchmark benchmarks/fx3u_rag_benchmark.jsonl \
            --output /tmp/persisted-rag-benchmark.json \
            --manifest /tmp/benchmark-manifest.json \
            --fail-under-recall-10 1.0
          python - <<'PY'
          import json
          report = json.load(open('/tmp/persisted-rag-benchmark.json', encoding='utf-8'))
          metrics = {key: report[key] for key in (
              'cases','recall_at_1','recall_at_5','recall_at_10','mrr','negative_accuracy'
          )}
          print('BENCHMARK', json.dumps(metrics, sort_keys=True))
          assert report['cases'] == 220, report['cases']
          assert report['recall_at_10'] == 1.0, report['recall_at_10']
          assert report['negative_accuracy'] == 1.0, report['negative_accuracy']
          PY

      - name: Verify migration remains a no-op
        run: |
          cp resources/knowledge/fx3u_knowledge.sqlite /tmp/idempotence.sqlite
          python tools/reclassify_device_entities.py \
            --database /tmp/idempotence.sqlite \
            --report /tmp/idempotence.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/idempotence.json', encoding='utf-8'))
          print('IDEMPOTENCE', json.dumps({k:v for k,v in report.items() if k != 'changes'}, sort_keys=True))
          assert report['affected_chunks'] == 0
          assert report['changed_entity_rows'] == 0
          assert report['changes'] == []
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: persisted-device-cleanup-validation
          path: |
            /tmp/persisted-structured-audit.json
            /tmp/persisted-rag-benchmark.json
            /tmp/idempotence.json
          if-no-files-found: error
