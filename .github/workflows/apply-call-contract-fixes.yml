name: Apply call contract fixes

on:
  push:
    branches: [refactor/src-layout-complete-20260918]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the verified incremental patch
        shell: bash
        run: |
          set -euo pipefail
          BASE=77971d74698b8f71608352ed2c49e60d84132913
          PATCH_SHA=cc056f3b94c97ed5ae1f0c3b24efb44f6b59a1368fe7f46da23b74b6758ba257
          GZIP_SHA=ddfa93c3c50d21e16720f3d874bbb5910a39fac43133a37238be8d2cfde9834b
          test "$(git rev-parse HEAD^)" = "$BASE"
          REMOTE=$(git ls-remote origin refs/heads/refactor/src-layout-complete-20260918 | cut -f1)
          test "$REMOTE" = "$GITHUB_SHA"

          cat .tmp/callfix/part*.bin > "$RUNNER_TEMP/callfix.patch.gz"
          echo "$GZIP_SHA  $RUNNER_TEMP/callfix.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/callfix.patch.gz" > "$RUNNER_TEMP/callfix.patch"
          echo "$PATCH_SHA  $RUNNER_TEMP/callfix.patch" | sha256sum -c -

          git apply --check "$RUNNER_TEMP/callfix.patch"
          git apply "$RUNNER_TEMP/callfix.patch"
          python -m compileall -q src tests scripts

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- docs scripts src tests
          git diff --cached --check
          git diff --cached --quiet && { echo 'Verified patch produced no changes'; exit 1; }
          git commit -m 'fix: align generation call contracts and transport fallback' \
            -m 'Bind MCP output schemas to the selected PLC, share confirmed-generation semantics across built-in and MCP adapters, centralize candidate preparation, narrow stream downgrade authorization, and remove hard-coded reasoning effort. Preserve wire-format differences and deterministic acceptance boundaries.'
          git push origin HEAD:refs/heads/refactor/src-layout-complete-20260918
