name: Ladder restoration validation
on:
  push:
    branches: [fix/web-lifecycle-performance-20260926]
    paths: [.github/workflows/ladder-regression-workspace.yml]
permissions:
  contents: write
concurrency:
  group: ladder-restoration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/fix/web-lifecycle-performance-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksum-verified source edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          sources = [('1d83a364b25de0c42fba0350c795d36178f04dbc', '6788a1d650e9635bfb7574d2417faa629fecd0e91b8b88dd579d5808b0916577'), ('18882f65bbed7a6edea08d85b76ba037f26cc3d3', 'd0006d4025e342be4eb17e6d33a6075e414d83a8b568a5cb5cbd1710dd933dc2')]
          allowed = {'src/application/program_projection.py', 'src/plc/condition_normalizer.py', 'src/plc/generation.py', 'src/rendering/ladder_svg.py', 'tests/test_generation_repair_workflow.py', 'tests/test_gxworks2_csv_native_regressions.py', 'tests/test_plc_condition_normalizer.py', 'tests/test_program_exploration.py'}
          touched = set()
          for blob_id, expected in sources:
              url = 'https://api.github.com/repos/Arienax/gxworks-agent/git/blobs/' + blob_id
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  blob = json.load(response)
              data = gzip.decompress(base64.b64decode(blob['content']))
              assert hashlib.sha256(data).hexdigest() == expected
              manifest = json.loads(data)
              assert {entry['path'] for entry in manifest} <= allowed
              for entry in manifest:
                  path = Path(entry['path'])
                  before = path.read_bytes()
                  assert hashlib.sha256(before).hexdigest() == entry['before'], path
                  lines = before.decode('utf-8').splitlines(keepends=True)
                  for start, end, replacement in reversed(entry['edits']):
                      lines[start:end] = replacement
                  after = ''.join(lines).encode('utf-8')
                  assert hashlib.sha256(after).hexdigest() == entry['after'], path
                  path.write_bytes(after)
                  touched.add(entry['path'])
          assert touched == allowed
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          PY
          git rm .github/workflows/ladder-regression-workspace.yml
          git diff --cached --check
          mkdir -p validation/ladder
      - name: Install complete test and browser dependencies
        run: |
          python -m pip install -r requirements.txt playwright==1.55.0
          python -m playwright install --with-deps chromium
          npm ci --prefix web
      - name: Complete headless suite and MCP smoke
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=validation/ladder/full-suite.xml 2>&1 | tee validation/ladder/full-suite.log
          python scripts/mcp_smoke.py 2>&1 | tee validation/ladder/mcp.log
      - name: Production frontend and browser acceptance
        run: |
          set -o pipefail
          node --experimental-strip-types --test web/tests/*.test.mjs 2>&1 | tee validation/ladder/node-tests.log
          npm run build --prefix web 2>&1 | tee validation/ladder/build.log
          python scripts/web_generation_e2e.py --web-dist web/dist --report validation/ladder/browser/report.json 2>&1 | tee validation/ladder/browser.log
      - name: Measure rendered annotations in Chromium against original source
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from rendering.ladder_svg import AdvancedSVGLadder
          old = {}
          exec(subprocess.check_output(['git', 'show', 'HEAD:src/rendering/ladder_svg.py']).decode(), old)
          label = '运行条件成立后开始检测，停止时复位；长注释不得遮挡相邻触点。' * 4
          sample = {'device_comments': {}, 'rungs': [{'rung_id': 42, 'header_element': None, 'shared_inputs': [], 'branches': [{'branch_id': 1, 'y_offset_level': 0, 'inputs': [{'type': 'NO', 'address': 'X0', 'label': label}, {'type': 'NC', 'address': 'X1', 'label': label}] + [{'type': 'NO', 'address': f'M{i}'} for i in range(14)], 'outputs': [{'type': 'APP_INSTR', 'opcode': 'MOV', 'operands': ['K32767', 'D7999'], 'label': label}]}]}]}
          output = Path('validation/ladder/geometry'); output.mkdir(parents=True)
          results = {}
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1200, 'height': 900})
              for name, renderer in [('original', old['AdvancedSVGLadder']), ('fixed', AdvancedSVGLadder)]:
                  svg = renderer().generate_ladder(json.dumps(sample, ensure_ascii=False))
                  (output / (name + '.svg')).write_text(svg)
                  page.set_content('<html><body style="margin:0">' + svg + '</body></html>')
                  page.screenshot(path=str(output / (name + '.png')), full_page=True)
                  boxes = page.locator('text[fill="#9cdcfe"]').evaluate_all('els => els.map(e => {const {x,y,width,height}=e.getBBox(); return {x,y,width,height};})')
                  overlaps = [(i,j) for i,a in enumerate(boxes) for j,b in enumerate(boxes) if i < j and min(a['x']+a['width'], b['x']+b['width']) - max(a['x'], b['x']) > .5 and min(a['y']+a['height'], b['y']+b['height']) - max(a['y'], b['y']) > .5]
                  results[name] = {'annotation_lines': len(boxes), 'overlap_pairs': len(overlaps), 'bounds': boxes}
              browser.close()
          (output / 'measurements.json').write_text(json.dumps(results, ensure_ascii=False, indent=2))
          assert results['original']['overlap_pairs'] > 0, results
          assert results['fixed']['overlap_pairs'] == 0, results
          print({name: {k:v for k,v in result.items() if k != 'bounds'} for name,result in results.items()})
          PY
      - name: Publish verified tree on existing branch
        run: |
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -p "$GITHUB_SHA" -p 5e10fd3bf24c281aa500ed1603961c4f41473dfa -m 'fix(plc): restore shared guards and measured ladder layout' -m 'Factor adjacent safe predicates without reordering writes. Preserve branch-specific suffixes and notes within the existing annotation contract, infer conservative write footprints from the Core catalogue, and retain scope barriers. Use one measured SVG layout for headers, shared contacts, parallel paths, applied-instruction boxes and wrapped device comments. Keep navigation anchors and native instruction step accounting independent and covered by scan and rendered-connectivity regressions.')
          printf '%s\n' "$commit" | tee validation/ladder/tested-commit.txt
          git push origin "$commit":refs/heads/fix/web-lifecycle-performance-20260926
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ladder-restoration-validation
          path: validation/ladder
          retention-days: 7
