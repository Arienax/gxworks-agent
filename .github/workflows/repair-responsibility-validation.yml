name: Repair Responsibility Validation

on:
  push:
    branches: [fix/prompt-context-slim-20260913]
    paths:
      - src/application/base.py
      - src/application/field_repair.py
      - src/application/repair_policy.py
      - src/application/generation.py
      - src/application/workbench.py
      - src/plc_generation.py
      - tests/test_field_patch_repair_protocol.py
      - tests/test_repair_responsibility_simplification.py
      - tests/test_user_confirmed_generation_repair.py
      - tests/test_generation_workflow.py
      - tests/test_generation_repair_workflow.py
      - tests/test_native_repair_scope_schema.py
      - tests/test_contract_repair_planner.py
      - tests/test_generation_fast_path.py
      - .github/workflows/repair-responsibility-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt-context-slim-20260913
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/web.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements/web.txt
          python -m pip check
      - name: Compile changed Python surface
        run: python -m compileall -q src tests
      - name: Repair and generation regression
        run: |
          python -m pytest -q `
            tests/test_field_patch_repair_protocol.py `
            tests/test_repair_responsibility_simplification.py `
            tests/test_user_confirmed_generation_repair.py `
            tests/test_generation_workflow.py `
            tests/test_generation_repair_workflow.py `
            tests/test_native_repair_scope_schema.py `
            tests/test_contract_repair_planner.py `
            tests/test_generation_fast_path.py
      - name: Repository diff sanity
        run: git diff --check HEAD~1 HEAD
