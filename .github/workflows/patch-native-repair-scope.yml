name: Patch native repair scope

on:
  push:
    branches: [fix/prompt-context-slim-20260913]
    paths:
      - tools/patch_native_repair_scope_once.py
      - .github/workflows/patch-native-repair-scope.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt-context-slim-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply native repair scope constraints
        run: python tools/patch_native_repair_scope_once.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements/web.txt
      - name: Validate focused repair scope paths
        run: |
          python -m compileall -q src tests
          python -m pytest -q tests/test_native_repair_scope_schema.py tests/test_user_confirmed_generation_repair.py tests/test_generation_opcode_contract.py tests/test_generation_repair_workflow.py tests/test_generation_rejected_json_repair.py tests/test_model_provider.py
          git diff --check
      - name: Commit validated repair scope fix
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: fix(repair): constrain native repair to baseline scope
          file_pattern: src tests
