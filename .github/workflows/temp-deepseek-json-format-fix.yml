name: Temporary DeepSeek JSON Format Fix

on:
  push:
    branches:
      - fix/gxworks2-native-csv-wrap-20260915

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/web.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements/web.txt
      - name: Apply transport capability fix and regression tests
        shell: python
        run: |
          from pathlib import Path

          source = Path("src/application/generation_agent.py")
          text = source.read_text(encoding="utf-8")
          old = '    if capabilities.get("structured_output"):\n'
          new = (
              '    # Generic structured JSON support does not imply OpenAI Chat Completions\\n'
              '    # supports response_format=json_schema; that stronger transport feature\\n'
              '    # must be explicitly advertised by the selected profile.\\n'
              '    if capabilities.get("json_schema_response_format"):\n'
          ).replace("\\n", "\n")
          if text.count(old) != 1:
              raise SystemExit("generation_agent response option anchor changed")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_generation_agent_boundary.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "test_builtin_deepseek_chat_profile_uses_json_object_transport"
          if marker in test_text:
              raise SystemExit("transport regression tests already present")
          test_text += '''\n\ndef test_builtin_deepseek_chat_profile_uses_json_object_transport():\n    from types import SimpleNamespace\n\n    from application.generation_agent import _response_options\n    from config_manager import DEFAULT_MODEL_PROFILES\n\n    profile = next(\n        item for item in DEFAULT_MODEL_PROFILES if item["id"] == "deepseek-default"\n    )\n    options = _response_options(SimpleNamespace(profile=profile))\n\n    assert options == {"response_format": {"type": "json_object"}}\n\n\ndef test_json_schema_transport_requires_explicit_profile_capability():\n    from types import SimpleNamespace\n\n    from application.generation_agent import _response_options\n\n    provider = SimpleNamespace(\n        profile={\n            "capabilities": {\n                "structured_output": True,\n                "json_schema_response_format": True,\n            }\n        }\n    )\n    response_format = _response_options(provider)["response_format"]\n\n    assert response_format["type"] == "json_schema"\n    assert response_format["json_schema"]["name"] == "confirmed_spec_compact_ladder"\n    assert response_format["json_schema"]["strict"] is True\n'''
          tests.write_text(test_text, encoding="utf-8")
      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/test_generation_agent_boundary.py \
            tests/test_model_profile_config.py \
            tests/test_generation_workflow.py \
            tests/test_diagnostics_workflow_regression_20260915.py
          python -m compileall -q src/application/generation_agent.py tests/test_generation_agent_boundary.py
          git diff --check
      - name: Commit validated fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-deepseek-json-format-fix.yml
          git add src/application/generation_agent.py tests/test_generation_agent_boundary.py
          git commit -m "fix(model): negotiate chat structured output safely"
          git push origin HEAD:${GITHUB_REF_NAME}
