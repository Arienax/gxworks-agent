name: Verify servo source candidate
on:
  pull_request:
    paths: ['.servo-source/**', '.github/workflows/servo-source-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/prompt-cleanup-io-binding-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      HAYSTACK_TELEMETRY_ENABLED: 'false'
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact candidate and remove temporary transport
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess
          from pathlib import Path, PurePosixPath
          expected = ['5635a71995e03e62b0e3eb9e666028578a800242', '3c1b4c690ef36c376f969de13ddebbf155a7449c', '5cee8f6cb19e04525a87af09d097d9ceb7673405', 'd4209222fb6c2c1254b92e9944828adaa27f016d', '7444acfcfe7c23c76071193cf606dd0f0a64e0f9', 'ea7399fcb6470e46060937e0f3f0cf8b836268cc']
          def blob_hash(value):
              return hashlib.sha1(b'blob ' + str(len(value)).encode() + b'\0' + value).hexdigest()
          parts = []
          for index, wanted in enumerate(expected):
              value = Path(f'.servo-source/{index:02d}.b64').read_bytes().strip()
              if blob_hash(value) != wanted and len(value) <= 6001:
                  for offset in range(len(value)):
                      candidate = value[:offset] + value[offset+1:]
                      if blob_hash(candidate) == wanted:
                          value = candidate
                          break
              assert blob_hash(value) == wanted, index
              parts.append(value)
          raw = gzip.decompress(base64.b64decode(b''.join(parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '3e730b48dbafbb0930ee7bab98a0b1d2194c13bf6cb882e407e181f2697fa9a0'
          data = json.loads(raw)
          assert data['base_commit'] == '10389df66f1a5bda6c888b843931bfe5b9836cb2'
          subprocess.run(['git', 'merge-base', '--is-ancestor', data['base_commit'], 'HEAD'], check=True)
          def check(rows, side):
              for row in rows:
                  path = PurePosixPath(row['path'])
                  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
                  assert hashlib.sha256(Path(row['path']).read_bytes()).hexdigest() == row[side], (row['path'], side)
          def apply(patch):
              subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
              subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          check(data['files'], 'before')
          apply(data['patch'].encode('utf-8'))
          check(data['files'], 'after')
          followup = [
              {'path':'src/knowledge/instruction_facts.py','before':'ec160c6f0964dd800fa578329cba6946ff54082da22f06a2427eb95b3c801b3c','after':'e0ef03d81a56fd367afa85c64cf3c57ae1c54ba0337bec93e1f824e5e642b60c'},
              {'path':'src/knowledge/retriever.py','before':'60df700458bf95493b6f4beec851737c6c19cb7818723bba619fe92347843a02','after':'a4db8ebf260ec4e59f1e0c7ba5cf1d0fe3e5db92fd33ee6c1b5ea78068ce6e0e'},
              {'path':'tests/test_analysis_design_rag.py','before':'e9ed9b44a5d47efaf13f10319525b804b1436dd428084f13513f7ba0d10de1c8','after':'3cc5d611480e080298c44da366a6c8343a25457e959ccfcc183cd2b92154f609'}]
          check(followup, 'before')
          apply(Path('.servo-source/followup.patch').read_bytes())
          check(followup, 'after')
          files = {row['path']: row for row in data['files']}
          for row in followup:
              if row['path'] in files:
                  files[row['path']]['after'] = row['after']
              else:
                  files[row['path']] = row
          data['files'] = list(files.values())
          subprocess.run(['git', 'rm', '-r', '--', '.servo-source', '.github/workflows/servo-source-verify.yml'], check=True)
          Path(os.environ['RUNNER_TEMP'], 'servo-source.json').write_text(json.dumps(data))
          PY
      - name: Install actual dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --prefix "$RUNNER_TEMP/context-eval" --no-audit --no-fund promptfoo@0.123.1
          python -m pip download --no-deps -d validation-servo/wheels haystack-ai==2.31.0 haystack-experimental docstring-parser lazy-imports posthog filetype
          python -m pip download --no-deps --only-binary=:all: --python-version 311 --platform manylinux2014_x86_64 -d validation-servo/wheels openai==2.43.0 distro==1.9.0 backoff==2.2.1 tenacity==9.1.4 jiter==0.17.0 sniffio==1.3.1
      - name: Record actual evidence receipt without manual text or private inputs
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from knowledge.scope import runtime_status
          from knowledge.evidence import KnowledgeQuery
          from shared.context_policy import context_policy_scope
          from application import model_api as api
          with context_policy_scope('legacy'):
              context = api._build_knowledge_context(KnowledgeQuery('ZRN DRVA M8029 operands completion', precompiled=True, metadata={'instruction_fact_mode':'targeted'}), plc_model='FX3U', task_type='generate')
          result = {'runtime':runtime_status(), 'manifest':context.manifest, 'contains':{x:x in context for x in ('ZRN','DRVA','M8029')}, 'real_model_calls':0}
          Path('validation-servo/motion-evidence.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Test confirmation contracts and real scoped retrieval
        run: >-
          python -m pytest -q
          tests/test_confirmed_reconfirmation.py tests/test_optional_hardware_parameters.py
          tests/test_spec_choice_metadata.py tests/test_confirmed_input_protocol.py
          tests/test_motion_control_regressions.py tests/test_analysis_design_rag.py
          tests/test_instruction_fact_context.py tests/test_intent_evidence_handoff.py
          tests/test_agent_b_measurement.py tests/test_runtime_diagnostics.py
          tests/test_web_source_entrypoints.py tests/test_architecture_boundaries.py
          tests/test_source_layout.py --junitxml=validation-servo/targeted.xml
      - name: Run runtime self-test and offline replay
        run: |
          PYTHONPATH=src python scripts/web_entry.py --self-test-knowledge
          python scripts/context_replay.py --output validation-servo/replay.json
          "$RUNNER_TEMP/context-eval/node_modules/.bin/promptfoo" eval -c evals/context-replay/promptfooconfig.yaml --no-cache -o validation-servo/promptfoo.json
      - name: Publish verified Git blobs only without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          data = json.loads(Path(os.environ['RUNNER_TEMP'], 'servo-source.json').read_text())
          elements = []
          for row in data['files']:
              name = row['path']
              content = Path(name).read_bytes()
              assert hashlib.sha256(content).hexdigest() == row['after'], name
              expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs', method='POST', data=json.dumps({'encoding':'base64','content':base64.b64encode(content).decode()}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  actual = json.load(response)['sha']
              assert actual == expected, name
              elements.append({'path':name,'mode':'100644','type':'blob','sha':actual})
          result = {'base_commit':data['base_commit'],'verification_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':data['files'],'tree_elements':elements}
          Path('validation-servo/verified-blobs.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: servo-source-verification
          path: validation-servo
          retention-days: 7
