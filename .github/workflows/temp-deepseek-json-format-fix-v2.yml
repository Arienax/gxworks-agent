name: Temporary DeepSeek JSON Format Fix V2

on:
  push:
    branches:
      - fix/gxworks2-native-csv-wrap-20260915

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements/web.txt
      - name: Patch transport negotiation
        shell: python
        run: |
          from pathlib import Path

          source = Path("src/application/generation_agent.py")
          text = source.read_text(encoding="utf-8")
          old = '    if capabilities.get("structured_output"):\n'
          new = '    if capabilities.get("json_schema_response_format"):\n'
          assert text.count(old) == 1
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_generation_agent_boundary.py")
          text = tests.read_text(encoding="utf-8")
          old_payload = '        yield TextDelta(json.dumps(_ladder(), ensure_ascii=False))\n'
          new_payload = '        yield TextDelta(json.dumps({"r": [{"b": [{"i": ["NO X0"], "o": ["COIL Y0"]}]}]}, ensure_ascii=False))\n'
          assert text.count(old_payload) == 1
          text = text.replace(old_payload, new_payload, 1)
          old_contract = '    assert provider.requests[0].response_contract.name == "ladder"\n'
          new_contract = '    assert provider.requests[0].response_contract.name == "compact_ladder"\n'
          assert text.count(old_contract) == 1
          text = text.replace(old_contract, new_contract, 1)
          assert "test_builtin_deepseek_chat_profile_uses_json_object_transport" not in text
          text += '''\n\ndef test_builtin_deepseek_chat_profile_uses_json_object_transport():\n    from types import SimpleNamespace\n    from application.generation_agent import _response_options\n    from config_manager import DEFAULT_MODEL_PROFILES\n\n    profile = next(item for item in DEFAULT_MODEL_PROFILES if item["id"] == "deepseek-default")\n    assert _response_options(SimpleNamespace(profile=profile)) == {\n        "response_format": {"type": "json_object"}\n    }\n\n\ndef test_json_schema_transport_requires_explicit_profile_capability():\n    from types import SimpleNamespace\n    from application.generation_agent import _response_options\n\n    provider = SimpleNamespace(profile={"capabilities": {\n        "structured_output": True, "json_schema_response_format": True\n    }})\n    response_format = _response_options(provider)["response_format"]\n    assert response_format["type"] == "json_schema"\n    assert response_format["json_schema"]["strict"] is True\n'''
          tests.write_text(text, encoding="utf-8")
      - name: Run focused regressions
        run: |
          python -m pytest -q tests/test_generation_agent_boundary.py tests/test_model_profile_config.py tests/test_generation_workflow.py tests/test_diagnostics_workflow_regression_20260915.py
          python -m compileall -q src/application/generation_agent.py tests/test_generation_agent_boundary.py
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-deepseek-json-format-fix-v2.yml
          git add src/application/generation_agent.py tests/test_generation_agent_boundary.py
          git commit -m "fix(model): negotiate chat structured output safely"
          git push origin HEAD:${GITHUB_REF_NAME}
