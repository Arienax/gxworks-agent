name: Validate device entity extraction fix

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
    paths:
      - .github/workflows/validate-device-entity-extraction.yml
      - tools/device_entity_evidence.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rejected-json-repair-20260913
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare candidate source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          builder = Path('tools/build_fx3u_knowledge_v3.py')
          text = builder.read_text(encoding='utf-8')
          rules = [
              ('BUILDER_VERSION = "3.0.3"', 'BUILDER_VERSION = "3.0.4"'),
              ('DEVICE_PREFIX = r"(?:ER|SM|SD|TS|TC|CS|CC|[XYMSTCDRVZPIN])"', 'DEVICE_PREFIX = r"(?:ER|SM|SD|TS|TC|CS|CC|[XYMSTCDRVZPI])"'),
              ('first_prefix in {"S", "D", "N", "M", "P"}', 'first_prefix in {"S", "D", "M", "P"}'),
              ('prefix in {"S", "D", "N", "M", "P"}', 'prefix in {"S", "D", "M", "P"}'),
          ]
          for old, new in rules:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one builder match for {old!r}, got {text.count(old)}')
              text = text.replace(old, new, 1)
          anchor = 'def extract_entities(\n    text: str,\n    instruction_re: re.Pattern[str],\n'
          helper = '''def _layout_fused_non_device(text: str, match: re.Match[str]) -> bool:\n    \"\"\"Reject a narrow PDF step-count fusion without suppressing real spaced addresses.\"\"\"\n    if match.group(1).upper() != \"D\":\n        return False\n    if not re.match(r\"D\\s+\\d\", match.group(0), flags=re.I):\n        return False\n    return bool(re.match(r\"\\s+steps?\\b\", text[match.end():match.end() + 24], flags=re.I))\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('extract_entities anchor missing')
          text = text.replace(anchor, helper + anchor, 1)
          old = '''        if match.group(3):\n            entity += f\".{match.group(3)}\"\n        if prefix in {\"S\", \"D\", \"M\", \"P\"} and int(match.group(2)) > 0:\n'''
          new = '''        if match.group(3):\n            entity += f\".{match.group(3)}\"\n        if _layout_fused_non_device(text, match):\n            continue\n        if prefix in {\"S\", \"D\", \"M\", \"P\"} and int(match.group(2)) > 0:\n'''
          if text.count(old) != 1:
              raise SystemExit('device extraction loop anchor missing')
          builder.write_text(text.replace(old, new, 1), encoding='utf-8')

          importer = Path('tools/import_gxw2_skill.py')
          text = importer.read_text(encoding='utf-8')
          if text.count('[XYMSTCDRVZPIN]') != 1:
              raise SystemExit('unexpected gxw2-skill device regex count')
          importer.write_text(text.replace('[XYMSTCDRVZPIN]', '[XYMSTCDRVZPI]', 1), encoding='utf-8')

          audit = Path('tools/audit_structured_knowledge_quality.py')
          text = audit.read_text(encoding='utf-8')
          text = text.replace('from typing import Any\n', 'from typing import Any\n\nfrom device_entity_evidence import classify_provenance\n', 1)
          text = text.replace('[XYMSTCDRVZPIN]', '[XYMSTCDRVZPI]')
          text = text.replace('OPERAND_POSITION_RE = re.compile(r"^[SDNMP](?:\\d{0,3})?$", re.I)', 'OPERAND_POSITION_RE = re.compile(r"^[SDMP](?:\\d{0,3})?$", re.I)', 1)
          old = '''            if total_occ and instruction_occ / total_occ >= 0.75 and structured_hits:\n                item = {\"id\": row_id, \"device\": device, \"occurrences\": int(occurrences), \"instruction_occurrences\": instruction_occ, \"total_provenance_occurrences\": total_occ, \"structured_instruction_occurrences\": structured_hits, \"samples\": samples}\n                placeholder_like_records.append(item)\n                issues.append(issue(\"warning\", \"device_records\", \"possible_operand_placeholder_device_record\", **item))\n'''
          new = '''            if total_occ and instruction_occ / total_occ >= 0.75 and structured_hits:\n                evidence = classify_provenance(device, provenance, text_index=5, chunk_id_index=0, opcode_index=4)\n                if evidence[\"classification\"] != \"real_device_example_likely\":\n                    item = {\"id\": row_id, \"device\": device, \"occurrences\": int(occurrences), \"instruction_occurrences\": instruction_occ, \"total_provenance_occurrences\": total_occ, \"structured_instruction_occurrences\": structured_hits, \"samples\": samples, \"evidence_classification\": evidence[\"classification\"], \"evidence_signal_counts\": evidence[\"signal_counts\"], \"evidence_samples\": evidence[\"samples\"]}\n                    placeholder_like_records.append(item)\n                    issues.append(issue(\"warning\", \"device_records\", \"possible_operand_placeholder_device_record\", **item))\n'''
          if text.count(old) != 1:
              raise SystemExit('legacy audit heuristic block missing')
          audit.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Create regression test
        run: |
          cat > tests/test_device_entity_extraction_rules.py <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          import types

          ROOT = Path(__file__).resolve().parents[1]
          TOOLS = ROOT / 'tools'
          sys.path.insert(0, str(TOOLS))
          try:
              import pypdf  # noqa: F401
          except ImportError:
              module = types.ModuleType('pypdf')
              module.PdfReader = object
              sys.modules['pypdf'] = module
          try:
              import pdfplumber  # noqa: F401
          except ImportError:
              sys.modules['pdfplumber'] = types.ModuleType('pdfplumber')
          spec = importlib.util.spec_from_file_location('fx3_builder', TOOLS / 'build_fx3u_knowledge_v3.py')
          builder = importlib.util.module_from_spec(spec)
          sys.modules['fx3_builder'] = builder
          assert spec.loader is not None
          spec.loader.exec_module(builder)
          instruction_re = builder.compile_instruction_re(set(builder.BASE_INSTRUCTIONS))

          def entities(text):
              return builder.extract_entities(text, instruction_re, chunk_type='instruction')

          def test_lowercase_n_constraints_are_not_devices():
              for source in ('2 n 512 [16-bit binary]', 'When n is 4.', 'Caution | n 9'):
                  found = entities(source)
                  assert not any(kind in {'device', 'device_range'} and token.startswith('N') for token, kind in found)

          def test_nesting_namespace_is_not_a_device_family():
              found = entities('MC N0 M10\nMCR N0\nAvailable nesting levels are N0 to N7')
              assert ('M10', 'device') in found
              assert not any(kind in {'device', 'device_range'} and token.startswith('N') for token, kind in found)

          def test_layout_step_count_does_not_become_d17():
              assert ('D17', 'device') not in entities('FNC 62\nABSD\nD 17 steps DABSD Continuous')

          def test_real_spaced_register_examples_are_preserved():
              found = entities('Calculation example\n(D 15, D 14)\nD15 | 23 | Second')
              assert ('D15', 'device') in found
              assert ('D14', 'device') in found

          def test_real_spaced_pointer_is_preserved():
              assert ('P11', 'device') in entities('Label\nP 11\nCALLP P 11\njumps to label P11')
          PY
      - name: Install validation dependencies
        run: python -m pip install pypdf pdfplumber numpy==2.3.2 pytest==9.1.1
      - name: Run extraction regression tests
        run: python -m pytest -q tests/test_device_entity_extraction_rules.py
      - name: Rebuild candidate SQLite
        run: python tools/build_fx3u_knowledge_v3.py
      - name: Restore supporting corpus and dense index
        run: |
          python tools/import_design_patterns.py
          python tools/import_gxw2_skill.py
          python tools/tune_gxw2_skill_ranking.py
          python tools/build_dense_embeddings.py
      - name: Validate rebuilt SQLite
        run: |
          python tools/audit_structured_knowledge_quality.py --database resources/knowledge/fx3u_knowledge.sqlite --output rebuilt-audit.json
          python - <<'PY'
          import json
          import sqlite3
          bad = {'D17', 'N4', 'N9', 'N36', 'N512'}
          keep = {'D14','D15','D24','D26','D27','D28','D29','D307','D51','D7','D9','D99','M127','M14','M16','M17','M255','M31','M599','M63','P10','P11','P12','P2','P20','P4','P5','P7','P9'}
          with sqlite3.connect('resources/knowledge/fx3u_knowledge.sqlite') as con:
              devices = {str(r[0]).upper() for r in con.execute("SELECT device FROM device_records WHERE record_type='device'")}
              leaked_entities = {str(r[0]).upper() for r in con.execute("SELECT DISTINCT entity FROM entity_index WHERE entity_type='device' AND upper(entity) IN ('D17','N4','N9','N36','N512')")}
          assert not (bad & devices), sorted(bad & devices)
          assert not leaked_entities, sorted(leaked_entities)
          assert not (keep - devices), sorted(keep - devices)
          report = json.load(open('rebuilt-audit.json', encoding='utf-8'))
          assert report['integrity_check'] == 'ok'
          assert report['foreign_key_violations'] == 0
          assert not report['issues'], report['issues'][:20]
          assert report['stats']['device_records']['placeholder_like_device_records'] == 0
          print('DEVICE_REPAIR_OK', len(keep))
          PY
      - name: Upload candidate patch and audit
        uses: actions/upload-artifact@v4
        with:
          name: device-entity-extraction-candidate
          path: |
            tools/build_fx3u_knowledge_v3.py
            tools/import_gxw2_skill.py
            tools/audit_structured_knowledge_quality.py
            tests/test_device_entity_extraction_rules.py
            rebuilt-audit.json
          if-no-files-found: error
