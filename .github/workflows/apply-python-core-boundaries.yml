name: Apply Python Core boundary refactor

on:
  push:
    branches: [refactor/python-core-boundaries-20260919]
    paths:
      - '.github/workflows/apply-python-core-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Commit refactor on protected branch
        shell: bash
        env:
          TARGET_BRANCH: refactor/python-core-boundaries-20260919
        run: |
          cp .github/tmp/python-core-boundaries.patch "$RUNNER_TEMP/python-core-boundaries.patch"
          rm -f .github/tmp/python-core-boundaries.patch
          rm -f .github/workflows/apply-python-core-boundaries.yml
          git apply "$RUNNER_TEMP/python-core-boundaries.patch"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: centralize PLC semantics in Python Core"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
