name: Rebuild device entity cleanup

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
    paths:
      - tools/device_entity_cleanup.py
      - tools/build_fx3u_knowledge_clean.py
      - tools/build_fx3u_knowledge.py
      - tools/reclassify_device_entities.py
      - tools/audit_structured_knowledge_quality.py
      - tests/test_device_entity_cleanup.py
      - .github/workflows/rebuild-device-entity-cleanup.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-device-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Unit-test semantic cleanup
        run: python -m pytest -q tests/test_device_entity_cleanup.py

      - name: Snapshot metadata and migrate a copy of the current LFS database
        run: |
          cp resources/knowledge/fx3u_knowledge.sqlite /tmp/device-clean.sqlite
          python - <<'PY'
          import json, sqlite3
          with sqlite3.connect('/tmp/device-clean.sqlite') as con:
              rows = con.execute(
                  "SELECT device_norm,record_type,device,prefix,description,plc_models,source_manuals_json,chunk_id "
                  "FROM device_records ORDER BY device_norm,record_type"
              ).fetchall()
          payload = {
              f'{row[0]}|{row[1]}': {
                  'device': row[2], 'prefix': row[3], 'description': row[4],
                  'plc_models': row[5], 'source_manuals_json': row[6], 'chunk_id': row[7],
              }
              for row in rows
          }
          json.dump(payload, open('/tmp/device-before.json','w',encoding='utf-8'), ensure_ascii=False, sort_keys=True)
          PY
          python tools/reclassify_device_entities.py \
            --database /tmp/device-clean.sqlite \
            --report /tmp/device-clean-migration.json

      - name: Verify false positives, real examples, and metadata preservation
        run: |
          python - <<'PY'
          import json, sqlite3

          db = '/tmp/device-clean.sqlite'
          before = json.load(open('/tmp/device-before.json', encoding='utf-8'))
          with sqlite3.connect(db) as con:
              integrity = con.execute('PRAGMA integrity_check').fetchone()[0]
              assert integrity == 'ok', integrity
              fk = con.execute('PRAGMA foreign_key_check').fetchall()
              assert fk == [], fk[:10]

              n_devices = con.execute(
                  "SELECT device,occurrences FROM device_records WHERE prefix='N' ORDER BY device"
              ).fetchall()
              assert n_devices == [], n_devices[:50]

              d17 = con.execute(
                  "SELECT device,occurrences FROM device_records WHERE device_norm='d17'"
              ).fetchall()
              assert d17 == [], d17

              known_real = {
                  'D14','D15','D24','D26','D27','D28','D29','D307','D51','D7','D9','D99',
                  'M127','M14','M16','M17','M255','M31','M599','M63',
                  'P10','P11','P12','P2','P20','P4','P5','P7','P9',
              }
              present = {
                  str(row[0]).upper()
                  for row in con.execute("SELECT device FROM device_records")
                  if str(row[0]).upper() in known_real
              }
              assert known_real <= present, sorted(known_real - present)

              nesting = con.execute(
                  "SELECT entity,SUM(occurrences) FROM entity_index "
                  "WHERE entity_type='nesting_level' GROUP BY entity ORDER BY entity"
              ).fetchall()
              assert nesting, 'expected MC/MCR nesting_level entities'
              bad_nesting = [
                  row for row in nesting
                  if not (row[0].startswith('N') and row[0][1:].isdigit() and 0 <= int(row[0][1:]) <= 7)
              ]
              assert bad_nesting == [], bad_nesting[:20]

              operand_n = con.execute(
                  "SELECT entity,SUM(occurrences) FROM entity_index "
                  "WHERE entity_type='operand_placeholder' AND entity IN ('N4','N9','N512') "
                  "GROUP BY entity ORDER BY entity"
              ).fetchall()

              after_rows = con.execute(
                  "SELECT device_norm,record_type,device,prefix,description,plc_models,source_manuals_json,chunk_id "
                  "FROM device_records ORDER BY device_norm,record_type"
              ).fetchall()
              provenance = {
                  (str(norm), str(kind)): {
                      int(row[0]) for row in con.execute(
                          "SELECT chunk_id FROM entity_index WHERE entity_norm=? AND entity_type=?",
                          (norm, kind),
                      )
                  }
                  for norm, kind, *_rest in after_rows
                  if kind in {'device','device_range'}
              }

          metadata_drift = []
          for norm, kind, device, prefix, description, models, manuals_json, chunk_id in after_rows:
              key = f'{norm}|{kind}'
              old = before.get(key)
              if old is None:
                  continue
              for field, value in (
                  ('device', device), ('prefix', prefix), ('description', description), ('plc_models', models)
              ):
                  if old[field] != value:
                      metadata_drift.append((key, field, old[field], value))
              try:
                  old_manuals = set(json.loads(old['source_manuals_json'] or '[]'))
                  new_manuals = set(json.loads(manuals_json or '[]'))
              except Exception as exc:
                  raise AssertionError((key, 'invalid manuals json', exc))
              if old_manuals != new_manuals:
                  metadata_drift.append((key, 'source_manuals', sorted(old_manuals), sorted(new_manuals)))
              if old['chunk_id'] == chunk_id:
                  continue
              if old['chunk_id'] in provenance.get((str(norm), str(kind)), set()):
                  metadata_drift.append((key, 'chunk_id', old['chunk_id'], chunk_id))
          assert metadata_drift == [], metadata_drift[:20]

          print('INTEGRITY', integrity)
          print('N_DEVICE_RECORDS', n_devices)
          print('D17_DEVICE_RECORDS', d17)
          print('REVIEWED_REAL_PRESENT', len(present), '/', len(known_real))
          print('NESTING_LEVEL_SAMPLE', nesting[:20])
          print('OPERAND_N_SAMPLE', operand_n)
          print('METADATA_DRIFT', metadata_drift)
          PY

      - name: Enforce idempotence
        run: |
          python - <<'PY'
          import hashlib, json, sqlite3

          def digest(db):
              h = hashlib.sha256()
              with sqlite3.connect(db) as con:
                  queries = [
                      "SELECT entity_norm,entity,entity_type,plc_models,task_types,manual_id,chunk_id,occurrences FROM entity_index ORDER BY entity_norm,entity_type,chunk_id",
                      "SELECT device_norm,device,prefix,record_type,description,occurrences,plc_models,source_manuals_json,chunk_id FROM device_records ORDER BY device_norm,record_type",
                      "SELECT id,entities,entities_json FROM chunks ORDER BY id",
                  ]
                  for query in queries:
                      for row in con.execute(query):
                          h.update(json.dumps(row, ensure_ascii=False, separators=(',',':')).encode('utf-8'))
                          h.update(b'\n')
              return h.hexdigest()

          first = digest('/tmp/device-clean.sqlite')
          open('/tmp/device-clean-first-digest.txt','w').write(first + '\n')
          print('FIRST_DIGEST', first)
          PY
          python tools/reclassify_device_entities.py \
            --database /tmp/device-clean.sqlite \
            --report /tmp/device-clean-migration-second.json
          python - <<'PY'
          import hashlib, json, sqlite3

          report = json.load(open('/tmp/device-clean-migration-second.json', encoding='utf-8'))
          assert report['affected_chunks'] == 0, report['affected_chunks']
          assert report['changed_entity_rows'] == 0, report['changed_entity_rows']
          assert report['changes'] == [], report['changes'][:5]

          def digest(db):
              h = hashlib.sha256()
              with sqlite3.connect(db) as con:
                  queries = [
                      "SELECT entity_norm,entity,entity_type,plc_models,task_types,manual_id,chunk_id,occurrences FROM entity_index ORDER BY entity_norm,entity_type,chunk_id",
                      "SELECT device_norm,device,prefix,record_type,description,occurrences,plc_models,source_manuals_json,chunk_id FROM device_records ORDER BY device_norm,record_type",
                      "SELECT id,entities,entities_json FROM chunks ORDER BY id",
                  ]
                  for query in queries:
                      for row in con.execute(query):
                          h.update(json.dumps(row, ensure_ascii=False, separators=(',',':')).encode('utf-8'))
                          h.update(b'\n')
              return h.hexdigest()

          before = open('/tmp/device-clean-first-digest.txt').read().strip()
          after = digest('/tmp/device-clean.sqlite')
          print('SECOND_MIGRATION', json.dumps({k:v for k,v in report.items() if k != 'changes'}, sort_keys=True))
          print('SECOND_DIGEST', after)
          assert before == after, (before, after)
          PY

      - name: Audit migrated database with primary evidence-aware audit
        run: |
          python tools/audit_structured_knowledge_quality.py \
            --database /tmp/device-clean.sqlite \
            --output /tmp/device-clean-structured-audit.json > /tmp/device-clean-structured-audit.log
          python - <<'PY'
          import json
          report = json.load(open('/tmp/device-clean-structured-audit.json', encoding='utf-8'))
          heuristic = [
              item for item in report['issues']
              if item.get('code') == 'possible_operand_placeholder_device_record'
          ]
          errors = [item for item in report['issues'] if item.get('severity') == 'error']
          print('MIGRATED_SEVERITY', json.dumps(report['issue_severity_counts'], sort_keys=True))
          print('MIGRATED_CODES', json.dumps(report['issue_code_counts'], sort_keys=True))
          print('MIGRATED_DEVICE_HEURISTICS', json.dumps(heuristic, ensure_ascii=False))
          assert report['integrity_check'] == 'ok'
          assert report['foreign_key_violations'] == 0
          assert errors == [], errors[:10]
          assert heuristic == [], heuristic
          PY

      - name: Audit migrated device evidence
        run: |
          python tools/audit_device_placeholder_evidence.py \
            --database /tmp/device-clean.sqlite \
            --output /tmp/device-clean-evidence.json > /tmp/device-clean-evidence.log
          python - <<'PY'
          import json
          report = json.load(open('/tmp/device-clean-evidence.json', encoding='utf-8'))
          unresolved = [
              item for item in report['candidates']
              if item['suggested_class'] in {'ambiguous', 'operand_placeholder_likely'}
          ]
          print('CANDIDATES', report['candidate_count'])
          print('CLASSES', json.dumps(report['suggested_class_counts'], sort_keys=True))
          print('UNRESOLVED', json.dumps(unresolved, ensure_ascii=False))
          assert not unresolved, unresolved
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: device-entity-cleanup-audit
          path: |
            /tmp/device-clean-migration.json
            /tmp/device-clean-migration-second.json
            /tmp/device-clean-structured-audit.json
            /tmp/device-clean-structured-audit.log
            /tmp/device-clean-evidence.json
            /tmp/device-clean-evidence.log
          if-no-files-found: error
