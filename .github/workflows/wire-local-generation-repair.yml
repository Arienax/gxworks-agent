name: Wire local generation repair

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
    paths:
      - tools/wire_local_generation_repair_once.py
      - .github/workflows/wire-local-generation-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rejected-json-repair-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply local repair wiring
        run: python tools/wire_local_generation_repair_once.py
      - name: Install focused test dependencies
        run: python -m pip install -r requirements.txt -r requirements/web.txt
      - name: Validate local repair behavior
        run: |
          python -m compileall -q src tests
          python -m pytest -q \
            tests/test_user_confirmed_generation_repair.py \
            tests/test_generation_workflow.py \
            tests/test_generation_repair_assembly.py \
            tests/test_generation_rejected_json_repair.py
      - name: Refuse concurrent branch overwrite
        shell: bash
        run: |
          git fetch origin fix/rejected-json-repair-20260913
          test "$(git rev-parse origin/fix/rejected-json-repair-20260913)" = "${GITHUB_SHA}"
      - name: Commit source and tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/workbench.py tests/test_user_confirmed_generation_repair.py
          git diff --cached --check
          git commit -m "fix(generation): wire explicit local repair mode"
          git push origin HEAD:fix/rejected-json-repair-20260913
