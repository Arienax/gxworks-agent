name: Temporary Invalid Candidate Validation
on:
  push:
    branches: [feat/comprehensive-runtime-diagnostics-20260914]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -q pytest numpy
      - name: Compile changed code
        run: python -m compileall -q src/application/jobs.py src/application/rejected_generation_preview.py tests/test_rejected_generation_delivery.py
      - name: Run focused regressions
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_rejected_generation_delivery.py \
            tests/test_model_stream_cancellation.py \
            tests/test_confirmed_generation_regressions_20260914.py \
            tests/test_generation_workflow.py
      - name: Build web frontend
        working-directory: web
        run: |
          npm ci
          npm run build
