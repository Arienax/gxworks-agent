name: Registry smoke test

on:
  push:
    branches: [fix/prompt-context-slim-20260913]
    paths:
      - ".github/workflows/registry-smoke.yml"

permissions:
  contents: write

jobs:
  registry-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt-context-slim-20260913
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply repair model patch
        run: |
          python tools/_tmp_evidence_scoped_repair_20260914.py
          python tools/_tmp_evidence_scoped_repair_tests_20260914.py
          python tools/_tmp_evidence_scoped_repair_fix_20260914.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements/web.txt
      - name: Test evidence-scoped repair
        run: |
          python -m compileall -q src tests
          python -m pytest -q tests/test_field_patch_repair_protocol.py tests/test_user_confirmed_generation_repair.py tests/test_partial_repair_semantic_freeze.py tests/test_generation_repair_workflow.py tests/test_generation_opcode_contract.py tests/test_application_job_errors.py
          git diff --check
      - name: Commit validated repair model and restore CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout 574fdb3b31bad01525b9587e4df3fbdea066992c -- .github/workflows/registry-smoke.yml
          git rm tools/_tmp_evidence_scoped_repair_20260914.py tools/_tmp_evidence_scoped_repair_tests_20260914.py tools/_tmp_evidence_scoped_repair_fix_20260914.py
          git add src/application/field_repair.py src/application/generation.py src/application/workbench.py src/application/job_errors.py src/api.py tests/test_field_patch_repair_protocol.py tests/test_user_confirmed_generation_repair.py .github/workflows/registry-smoke.yml
          git commit -m "fix: repair only validator-proven fields"
          git push origin HEAD:fix/prompt-context-slim-20260913
