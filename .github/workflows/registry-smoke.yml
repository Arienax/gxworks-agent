name: Registry smoke test

on:
  push:
    paths:
      - "src/instruction_registry.py"
      - "src/plc_json_validator.py"
      - "src/plc_ir.py"
      - "src/gxworks2/csv_importer.py"
      - "resources/instructions/**"
      - "tests/test_instruction_registry.py"
      - ".github/workflows/registry-smoke.yml"
  pull_request:
    paths:
      - "src/instruction_registry.py"
      - "src/plc_json_validator.py"
      - "src/plc_ir.py"
      - "src/gxworks2/csv_importer.py"
      - "resources/instructions/**"
      - "tests/test_instruction_registry.py"

jobs:
  registry-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: pytest -q tests/test_instruction_registry.py
