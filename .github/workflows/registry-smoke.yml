name: Registry smoke test

on:
  push:
    branches: [fix/prompt-context-slim-20260913]
    paths:
      - ".github/workflows/registry-smoke.yml"

permissions:
  contents: read

jobs:
  registry-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt-context-slim-20260913
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply diagnostics patch
        run: python tools/_tmp_expand_baseline_app_instrs_20260914.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements/web.txt
      - name: Test diagnostics
        run: |
          python -m compileall -q src tests
          python -m pytest -q tests/test_runtime_diagnostics.py tests/test_runtime_diagnostics_web.py tests/test_application_job_errors.py
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-app-instr-diagnostics-patch
          path: |
            src/runtime_diagnostics.py
            tests/test_runtime_diagnostics.py
          if-no-files-found: error
