name: Registry smoke test

on:
  push:
    branches: [fix/prompt-context-slim-20260913]
    paths:
      - ".github/workflows/registry-smoke.yml"

permissions:
  contents: write

jobs:
  registry-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt-context-slim-20260913
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply collector and batch repair patch
        run: |
          python tools/_tmp_collect_validation_20260914.py
          python tools/_tmp_batch_repair_20260914.py
          python tools/_tmp_batch_repair_tests_20260914.py
          python tools/_tmp_batch_repair_fix_20260914.py
          python tools/_tmp_batch_repair_fix2_20260914.py
          python tools/_tmp_batch_repair_fix3_20260914.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements/web.txt
      - name: Test collected batch repair
        run: |
          python -m compileall -q src tests
          python -m pytest -q tests/test_generation_validation_collector.py tests/test_field_patch_repair_protocol.py tests/test_user_confirmed_generation_repair.py tests/test_generation_repair_workflow.py tests/test_generation_opcode_contract.py tests/test_application_job_errors.py tests/test_web_contract.py
          git diff --check
      - name: Commit validated collector and restore CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout d436ec7feba4029c91a113b300cd10a9c02df068 -- .github/workflows/registry-smoke.yml
          git rm tools/_tmp_collect_validation_20260914.py tools/_tmp_batch_repair_20260914.py tools/_tmp_batch_repair_tests_20260914.py tools/_tmp_batch_repair_fix_20260914.py tools/_tmp_batch_repair_fix2_20260914.py tools/_tmp_batch_repair_fix3_20260914.py
          git add src/plc_json_validator.py src/plc_generation.py src/application/generation_repair.py src/application/field_repair.py src/application/generation.py src/application/workbench.py src/api.py tests/test_generation_validation_collector.py tests/test_field_patch_repair_protocol.py tests/test_user_confirmed_generation_repair.py .github/workflows/registry-smoke.yml
          git commit -m "fix: collect and batch generation repair violations"
          git push origin HEAD:fix/prompt-context-slim-20260913