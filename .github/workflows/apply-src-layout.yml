name: Apply verified source layout

on:
  push:
    branches:
      - refactor/src-layout-20260918
    paths:
      - '.layout-bootstrap/**'
      - '.github/workflows/apply-src-layout.yml'

permissions:
  contents: write

concurrency:
  group: apply-src-layout-20260918
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay exactly the locally tested source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "295378d6ac5d24949c03a1c799906f4afe0fd4c9"
          python - <<'PY'
          import gzip, hashlib, json, os, subprocess
          from pathlib import Path
          staging = Path('.layout-bootstrap')
          parts = [staging / f'part{i:02}.bin' for i in range(11)]
          packed = b''.join(path.read_bytes() for path in parts)
          assert hashlib.sha256(packed).hexdigest() == '27d08f58aa016c68cae538082dda77a86b25bbed6caed1266f19d63fce8867e6'
          packet = json.loads(gzip.decompress(packed))
          assert packet['base_sha'] == '295378d6ac5d24949c03a1c799906f4afe0fd4c9'
          assert packet['expected_tree'] == '7ebc1798da83e59f2d1383b0160b98a55581e692'
          temp = Path(os.environ['RUNNER_TEMP'])
          core = temp / 'source-layout-migrate.py'
          patch = temp / 'source-layout-finish.patch'
          core.write_text(packet['core'], encoding='utf-8')
          patch.write_text(packet['patch'], encoding='utf-8')
          subprocess.run(['python', str(core)], check=True)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          for path in parts:
              path.unlink()
          staging.rmdir()
          Path('.github/workflows/apply-src-layout.yml').unlink()
          PY
          python -m compileall -q src tests scripts tools
          git add -A -- src tests scripts tools packaging docs AGENTS.md README.md README.zh-CN.md .github .gitignore .layout-bootstrap
          EXPECTED=7ebc1798da83e59f2d1383b0160b98a55581e692
          ACTUAL=$(git write-tree)
          echo "expected tested tree: $EXPECTED"
          echo "actual staged tree: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: organize source packages with regression and packaging guards' -m 'Based on verified 295378d6. Preserve confirmed I/O, alias normalization, transport behavior and persistent paths. Locally tested candidate tree verified before publication; no live model, GX automation or physical PLC operation.'
          REMOTE=$(git ls-remote origin refs/heads/refactor/src-layout-20260918 | cut -f1)
          test "$REMOTE" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/refactor/src-layout-20260918
          echo "Published verified tree $EXPECTED at $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
