name: Publish verified source layout

on:
  push:
    branches: [refactor/src-layout-complete-20260918]
    paths:
      - '.tmp/src-layout-delta.*'
      - '.tmp/replay-src-layout.py'
      - '.github/workflows/apply-src-layout.yml'

permissions:
  contents: write

concurrency:
  group: publish-verified-source-layout
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Arienax/gxworks-agent' && github.ref == 'refs/heads/refactor/src-layout-complete-20260918' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild the locally tested tree and fast-forward only the refactoring branch
        shell: bash
        run: |
          set -euo pipefail
          BASE=295378d6ac5d24949c03a1c799906f4afe0fd4c9
          TREE=5750218c3f3a93e90301bb33493855a5f4efe5e9
          test "$GITHUB_REF" = refs/heads/refactor/src-layout-complete-20260918
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          python - <<'PY'
          import subprocess
          allowed = {'.github/workflows/source-layout.yml', '.github/workflows/apply-src-layout.yml', '.tmp/replay-src-layout.py', '.tmp/src-layout-delta.0', '.tmp/src-layout-delta.1', '.tmp/src-layout-delta.2'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '295378d6ac5d24949c03a1c799906f4afe0fd4c9', 'HEAD'], text=True).splitlines())
          if changed - allowed:
              raise SystemExit('Refusing to overwrite intervening source changes: ' + repr(changed - allowed))
          PY
          python .tmp/replay-src-layout.py .tmp/src-layout-delta.0 .tmp/src-layout-delta.1 .tmp/src-layout-delta.2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          COMMIT=$(git commit-tree "$TREE" -p "$GITHUB_SHA" -m 'refactor: complete source layout and preserve deterministic outputs' -m 'Move root modules into bounded packages, separate headless rendering/CSV and desktop components, migrate imports and packaging, retain stable entrypoints and storage locations. Local full suite: 2487 passed, 21 pre-existing failures, 5 skips; no new failures/skips/missing tests. 33 baseline/candidate output hashes match. Exact reviewed tree: 5750218c3f3a93e90301bb33493855a5f4efe5e9. Temporary transport files are absent from this tree.')
          git push origin "$COMMIT:refs/heads/refactor/src-layout-complete-20260918"
          echo "Published exact reviewed tree $TREE at $COMMIT" >> "$GITHUB_STEP_SUMMARY"
