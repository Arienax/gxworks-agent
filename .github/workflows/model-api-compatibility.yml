name: Model API Compatibility

on:
  push:
    branches: [main, feat/universal-api-capabilities]
    paths:
      - 'src/model_*.py'
      - 'src/application/settings.py'
      - 'src/application/model_detection.py'
      - 'src/config_manager.py'
      - 'src/integrations/web/**'
      - 'src/plc_generation_context_legacy.py'
      - 'tests/test_model_*.py'
      - 'tests/test_application_settings.py'
      - 'tests/test_web_*.py'
      - 'requirements/web.txt'
      - 'scripts/web_model_settings_e2e.py'
      - 'scripts/web_generation_e2e.py'
      - 'scripts/web_demo.py'
      - 'scripts/start_web.ps1'
      - 'build-web.bat'
      - 'scripts/build_web_source.ps1'
      - 'web/**'
      - '.github/workflows/model-api-compatibility.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/model_*.py'
      - 'src/application/settings.py'
      - 'src/application/model_detection.py'
      - 'src/config_manager.py'
      - 'src/integrations/web/**'
      - 'src/plc_generation_context_legacy.py'
      - 'tests/test_model_*.py'
      - 'tests/test_application_settings.py'
      - 'tests/test_web_*.py'
      - 'requirements/web.txt'
      - 'scripts/web_model_settings_e2e.py'
      - 'scripts/web_generation_e2e.py'
      - 'scripts/web_demo.py'
      - 'scripts/start_web.ps1'
      - 'build-web.bat'
      - 'scripts/build_web_source.ps1'
      - 'web/**'
      - '.github/workflows/model-api-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/web.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements/web.txt pytest playwright==1.55.0
          python -m pip check
          npm ci --prefix web
      - name: Verify generated HTTP contract is current
        run: |
          python scripts/export_web_schema.py
          npm run types --prefix web
          git diff --exit-code -- web/openapi.json web/src/api/generated.ts
      - name: Verify Python API and shared boundaries
        run: |
          mkdir -p model-api-evidence
          python -m compileall -q src tests scripts/web_model_settings_e2e.py
          # Includes the regression that Test connection never invokes capability discovery.
          python -m pytest -q tests/test_model_contract.py tests/test_model_capabilities.py tests/test_application_settings.py tests/test_model_provider.py tests/test_model_detection.py tests/test_model_detection_stages.py tests/test_model_detection_cache.py tests/test_model_profile_config.py tests/test_model_profile_deletion.py tests/test_web_contract.py tests/test_web_frontend_state_flow.py tests/test_model_stream_cancellation.py tests/test_model_presentation.py tests/test_plc_core_boundary.py --junitxml=model-api-evidence/python.xml
      - name: Test parameter controls and build Web frontend
        run: |
          node --experimental-strip-types --test web/tests/model-parameters.test.mjs web/tests/module-resolution.test.mjs
          npm run build --prefix web
      - name: Exercise real browser and HTTP settings flow
        run: |
          python -m playwright install --with-deps chromium
          python scripts/web_model_settings_e2e.py --web-dist web/dist --evidence model-api-evidence
      - name: Record the validated commit
        if: always()
        run: |
          mkdir -p model-api-evidence
          git rev-parse HEAD > model-api-evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-api-evidence
          path: model-api-evidence/
          retention-days: 7

  windows-build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build with the Windows source entry point
        run: |
          & .\build-web.bat --frontend-only --no-pause
          if ($LASTEXITCODE -ne 0) { throw 'Windows Web source build failed.' }
      - name: Verify source runtime wins over a stale packaged executable
        run: |
          New-Item -ItemType Directory -Force .venv\Scripts | Out-Null
          Copy-Item $env:ComSpec .venv\Scripts\python.exe -Force
          Set-Content -Path .\GXWorks-Agent-Web.exe -Value 'stale packaged fixture'
          $workspace = Join-Path $env:RUNNER_TEMP 'gxworks-launcher-source-precedence'
          $output = & .\scripts\start_web.ps1 -Workspace $workspace -NoBrowser -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw 'Launcher validation failed.' }
          $record = ($output | Select-Object -Last 1) | ConvertFrom-Json
          if ($record.backend -ne 'source') { throw "Expected source backend, got $($record.backend)." }
          Remove-Item .\GXWorks-Agent-Web.exe -Force
      - name: Verify Windows resolution and parameter controls
        run: |
          node -e "const ts = require('./web/node_modules/typescript'); if (ts.sys.useCaseSensitiveFileNames) process.exit(1); console.log('Case-insensitive Windows module resolution confirmed');"
          if ($LASTEXITCODE -ne 0) { throw 'Expected a case-insensitive Windows compiler host.' }
          node --experimental-strip-types --test web/tests/model-parameters.test.mjs web/tests/module-resolution.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Frontend regression tests failed.' }
          git diff --exit-code -- web/src/api/generated.ts
          if ($LASTEXITCODE -ne 0) { throw 'Generated HTTP types are not current.' }
      - name: Record the validated Windows commit
        if: always()
        run: |
          New-Item -ItemType Directory -Force windows-model-api-evidence | Out-Null
          git rev-parse HEAD | Set-Content windows-model-api-evidence/commit.txt
          if (Test-Path build-web.log) { Copy-Item build-web.log windows-model-api-evidence/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-model-api-evidence
          path: windows-model-api-evidence/
          retention-days: 7
