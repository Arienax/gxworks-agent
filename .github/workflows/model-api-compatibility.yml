name: Model API Compatibility

on:
  push:
    branches: [main, feat/universal-api-capabilities]
    paths:
      - 'src/model_*.py'
      - 'src/application/settings.py'
      - 'src/application/model_detection.py'
      - 'src/config_manager.py'
      - 'src/integrations/web/**'
      - 'src/plc_generation_context_legacy.py'
      - 'tests/test_model_*.py'
      - 'tests/test_application_settings.py'
      - 'tests/test_web_*.py'
      - 'requirements/web.txt'
      - 'scripts/web_model_settings_e2e.py'
      - 'scripts/web_generation_e2e.py'
      - 'scripts/web_demo.py'
      - 'web/**'
      - '.github/workflows/model-api-compatibility.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/model_*.py'
      - 'src/application/settings.py'
      - 'src/application/model_detection.py'
      - 'src/config_manager.py'
      - 'src/integrations/web/**'
      - 'src/plc_generation_context_legacy.py'
      - 'tests/test_model_*.py'
      - 'tests/test_application_settings.py'
      - 'tests/test_web_*.py'
      - 'requirements/web.txt'
      - 'scripts/web_model_settings_e2e.py'
      - 'scripts/web_generation_e2e.py'
      - 'scripts/web_demo.py'
      - 'web/**'
      - '.github/workflows/model-api-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/web.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements/web.txt pytest playwright==1.55.0
          python -m pip check
          npm ci --prefix web
      - name: Verify generated HTTP contract is current
        run: |
          npm run types --prefix web
          git diff --exit-code -- web/src/api/generated.ts
      - name: Verify Python API and shared boundaries
        run: |
          mkdir -p model-api-evidence
          python -m compileall -q src tests scripts/web_model_settings_e2e.py
          python -m pytest -q tests/test_model_capabilities.py tests/test_application_settings.py tests/test_model_provider.py tests/test_model_detection.py tests/test_model_profile_config.py tests/test_model_profile_deletion.py tests/test_web_contract.py tests/test_web_frontend_state_flow.py tests/test_model_stream_cancellation.py tests/test_model_presentation.py tests/test_plc_core_boundary.py --junitxml=model-api-evidence/python.xml
      - name: Test parameter controls and build Web frontend
        run: |
          node --experimental-strip-types --test web/tests/model-parameters.test.mjs
          npm run build --prefix web
      - name: Exercise real browser and HTTP settings flow
        run: |
          python -m playwright install --with-deps chromium
          python scripts/web_model_settings_e2e.py --web-dist web/dist --evidence model-api-evidence
      - name: Record the validated commit
        if: always()
        run: |
          mkdir -p model-api-evidence
          git rev-parse HEAD > model-api-evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-api-evidence
          path: model-api-evidence/
          retention-days: 7
