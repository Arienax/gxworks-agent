name: Inspect repeated 0000 error records

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
    paths: [.github/workflows/inspect-error-0000-contexts.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rejected-json-repair-20260913
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect 0000 records and strict parser neighborhoods
        run: |
          python - <<'PY'
          import re, sqlite3
          con=sqlite3.connect('resources/knowledge/fx3u_knowledge.sqlite')
          rows=con.execute("SELECT id,manual_id,pdf_page,message,cause,corrective_action,raw_text FROM error_records WHERE error_code_norm='0000' ORDER BY manual_id,pdf_page,id").fetchall()
          print('COUNT',len(rows))
          for rid,manual,page,msg,cause,action,raw in rows:
              print('\n===',rid,manual,page,'===')
              print('MESSAGE',repr(msg))
              print('CAUSE',repr(cause))
              print('ACTION',repr(action))
              print('RAW',repr((raw or '')[:1200]))
              prow=con.execute('SELECT outline_path,clean_text FROM page_artifacts WHERE manual_id=? AND pdf_page=?',(manual,page)).fetchone()
              if prow:
                  outline,text=prow
                  print('OUTLINE',outline)
                  hits=list(re.finditer(r'(?<![A-Z0-9])0000(?:H)?(?![A-Z0-9])',text or '',re.I))
                  for m in hits[:3]:
                      ctx=re.sub(r'\s+',' ',(text or '')[max(0,m.start()-180):m.end()+420]).strip()
                      print('CTX',ctx)
          con.close()
          PY
