name: Bootstrap structured operand alignment fix

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
    paths: [.github/workflows/bootstrap-fix-structured-operand-alignment.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/rejected-json-repair-20260913
          lfs: true
          fetch-depth: 1
      - name: Checkout baseline main
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline-main
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline builder dependencies
        run: python -m pip install pypdf pdfplumber
      - name: Refine generic parser alignment and audit checks
        run: python tools/bootstrap_refine_structured_operand_alignment.py
      - name: Repair bootstrap module loading
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/bootstrap_fix_structured_operand_alignment.py')
          text = path.read_text(encoding='utf-8')
          if 'import sys\n' not in text:
              text = text.replace('import sqlite3\n', 'import sqlite3\nimport sys\n', 1)
          old = '''    module = importlib.util.module_from_spec(spec)\n    assert spec.loader is not None\n    spec.loader.exec_module(module)\n'''
          new = '''    module = importlib.util.module_from_spec(spec)\n    sys.modules[spec.name] = module\n    assert spec.loader is not None\n    spec.loader.exec_module(module)\n'''
          if old not in text:
              raise SystemExit('load_module block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply generic parser fix and recompute baseline-empty instruction rows
        run: python tools/bootstrap_fix_structured_operand_alignment.py
      - name: Audit recomputed rows
        run: |
          python tools/audit_structured_instruction_backfill.py \
            --baseline baseline-main/resources/knowledge/fx3u_knowledge.sqlite \
            --candidate resources/knowledge/fx3u_knowledge.sqlite \
            --output structured-instruction-backfill-audit.json
          python - <<'PY'
          import json
          report = json.load(open('structured-instruction-backfill-audit.json', encoding='utf-8'))
          print('BACKFILLED', report['backfilled_records'])
          print('POSITIONS', json.dumps(report['operand_position_counts'], ensure_ascii=False, sort_keys=True))
          print('SEVERITY', json.dumps(report['issue_severity_counts'], ensure_ascii=False, sort_keys=True))
          print('CODES', json.dumps(report['issue_code_counts'], ensure_ascii=False, sort_keys=True))
          bad = [item for item in report['issues'] if item['severity'] == 'error']
          for item in bad:
              print(json.dumps(item, ensure_ascii=False, sort_keys=True))
          assert report['operand_position_counts'].get('X', 0) == 0, 'device header X still leaked into operand positions'
          assert not bad, f'{len(bad)} structural operand audit errors remain'
          PY
      - name: Verify the original FMOV/ZRST regression and compile code
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tools/build_fx3u_knowledge_v3.py tools/audit_structured_instruction_backfill.py
          python - <<'PY'
          import json, sqlite3
          db = sqlite3.connect('resources/knowledge/fx3u_knowledge.sqlite')
          db.row_factory = sqlite3.Row
          for opcode in ('fmov','zrst'):
              row = db.execute("SELECT operands_json FROM instructions WHERE manual_id='fx3_programming_r' AND opcode_norm=?", (opcode,)).fetchone()
              print(opcode, row['operands_json'])
          fmov = json.loads(db.execute("SELECT operands_json FROM instructions WHERE manual_id='fx3_programming_r' AND opcode_norm='fmov'").fetchone()[0])
          dest = next(item for item in fmov if item.get('position') == 'D')
          assert 'KnM' in dest.get('applicable_devices', [])
          assert 'M' not in dest.get('applicable_devices', [])
          zrst = json.loads(db.execute("SELECT operands_json FROM instructions WHERE manual_id='fx3_programming_r' AND opcode_norm='zrst'").fetchone()[0])
          first = next(item for item in zrst if item.get('position') == 'D1')
          assert 'M' in first.get('applicable_devices', [])
          PY
      - name: Commit branch-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-fix-structured-operand-alignment.yml tools/bootstrap_fix_structured_operand_alignment.py tools/bootstrap_refine_structured_operand_alignment.py
          git add tools/build_fx3u_knowledge_v3.py resources/knowledge/fx3u_knowledge.sqlite resources/knowledge/manifest.json tools/audit_structured_instruction_backfill.py
          git commit -m "fix(rag): align structured operand rows with manual tables"
          git push origin HEAD:fix/rejected-json-repair-20260913
