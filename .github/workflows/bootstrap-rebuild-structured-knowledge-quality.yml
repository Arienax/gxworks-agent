name: Bootstrap structured knowledge quality rebuild

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
    paths: [.github/workflows/bootstrap-rebuild-structured-knowledge-quality.yml]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rejected-json-repair-20260913
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline repair dependencies
        run: python -m pip install pypdf pdfplumber numpy pytest
      - name: Patch generic structured knowledge extractors
        run: |
          python tools/bootstrap_patch_structured_knowledge_quality.py
          python tools/bootstrap_patch_error_code_ranges.py
      - name: Smoke test patched structured parsers
        run: |
          python - <<'PY'
          import importlib.util, re, sys
          from types import SimpleNamespace
          spec=importlib.util.spec_from_file_location('builder','tools/build_fx3u_knowledge_v3.py')
          b=importlib.util.module_from_spec(spec); sys.modules[spec.name]=b; spec.loader.exec_module(b)
          instruction_re=re.compile(r'RBFM|DRVA',re.I)
          text='''[STRUCTURED INSTRUCTION RECORD]\nOPERANDS: M1: unit | M2: buffer | N1: count | N2: points | D1: destination\nD8360-Y003 table cells\n'''
          entities=b.extract_entities(text,instruction_re,chunk_type='instruction')
          for token in ('M1','M2','N1','N2','D1'):
              assert entities[(token,'operand_placeholder')] > 0, (token,entities)
              assert entities[(token,'device')] == 0, (token,entities)
          assert not [key for key in entities if key[1]=='device_range' and key[0]=='D8360-Y003']
          state=b.extract_entities('OUT S123 state relay',instruction_re,chunk_type='instruction')
          assert state[('S123','device')] > 0
          pages=[SimpleNamespace(clean_text='Execution complete flag (M8012). Error flag M8067 turns ON. M8020 Zero flag. M8029 "Instruction execution complete" flag. M8329 "Instruction execution abnormal end" flag.')]
          flags=b.instruction_completion_flags(pages)
          assert 'M8012' in flags and 'M8029' in flags, flags
          assert not {'M8067','M8020','M8329'}.intersection(flags), flags
          split_pages=[SimpleNamespace(clean_text='For details on the "Instruction execution complete" flag, refer to Subsection 4.7.4.\n*1. This step assumes the DOG signal logic reverse relay (M8345) is off. If this flag is on, reverse the expression.')]
          split_flags=b.instruction_completion_flags(split_pages)
          assert 'M8345' not in split_flags, split_flags
          error_page=SimpleNamespace(
              chunk_type='error',
              outline_path='Error Code List and Action',
              clean_text='6306 Monitoring timeout error\n6307 to 6311 No error\n6312 Parallel link character error',
              tables=[],
          )
          error_records=b.parse_error_records(error_page)
          error_codes=[item['code'] for item in error_records]
          assert '6306' in error_codes and '6312' in error_codes, error_records
          assert '6307' not in error_codes and '6311' not in error_codes, error_records
          row_6306=next(item for item in error_records if item['code']=='6306')
          assert '6307' not in row_6306['raw_text'] and '6311' not in row_6306['raw_text'], row_6306
          print('synthetic entities',entities)
          print('synthetic completion flags',flags)
          print('split completion flags',split_flags)
          print('synthetic error records',error_records)
          PY
          python -m compileall -q tools/build_fx3u_knowledge_v3.py tools/bootstrap_repair_structured_knowledge_inplace.py
      - name: Repair prebuilt corpus from stored authoritative artifacts
        run: python tools/bootstrap_repair_structured_knowledge_inplace.py
      - name: Rebuild dense embeddings for changed chunks
        run: python tools/build_dense_embeddings.py
      - name: Evaluate repaired retrieval corpus
        env:
          PYTHONPATH: src
        run: python tools/evaluate_rag_benchmark.py --fail-under-recall-10 0.98
      - name: Audit repaired structured knowledge
        run: |
          python tools/audit_structured_knowledge_quality.py \
            --database resources/knowledge/fx3u_knowledge.sqlite \
            --output structured-knowledge-quality-audit.json > structured-knowledge-quality-audit.log
          python tools/audit_error_record_alignment.py \
            --database resources/knowledge/fx3u_knowledge.sqlite \
            --output error-record-alignment-audit.json > error-record-alignment-audit.log
          python tools/audit_error_record_semantics.py \
            --database resources/knowledge/fx3u_knowledge.sqlite \
            --output error-record-semantic-audit.json > error-record-semantic-audit.log
          python - <<'PY'
          import json, sqlite3
          q=json.load(open('structured-knowledge-quality-audit.json',encoding='utf-8'))
          a=json.load(open('error-record-alignment-audit.json',encoding='utf-8'))
          s=json.load(open('error-record-semantic-audit.json',encoding='utf-8'))
          print('QUALITY',json.dumps(q['issue_code_counts'],ensure_ascii=False,sort_keys=True))
          print('QUALITY_SEVERITY',json.dumps(q['issue_severity_counts'],ensure_ascii=False,sort_keys=True))
          print('ALIGNMENT',json.dumps(a['issue_code_counts'],ensure_ascii=False,sort_keys=True))
          print('ERROR_SEMANTICS',json.dumps(s['issue_code_counts'],ensure_ascii=False,sort_keys=True))
          for item in q['issues'][:80]: print('QUALITY_ISSUE',json.dumps(item,ensure_ascii=False,sort_keys=True))
          for item in a['issues'][:40]: print('ALIGNMENT_ISSUE',json.dumps(item,ensure_ascii=False,sort_keys=True))
          for item in s['issues'][:40]: print('SEMANTIC_ISSUE',json.dumps(item,ensure_ascii=False,sort_keys=True))
          assert q['integrity_check']=='ok'
          assert q['foreign_key_violations']==0
          forbidden={
              'device_records:cross_family_device_range',
              'completion_flags:weak_completion_semantics',
          }
          assert not forbidden.intersection(q['issue_code_counts']), q['issue_code_counts']
          assert not [x for x in q['issues'] if x['severity']=='error']
          assert not [x for x in a['issues'] if x['severity']=='error']
          assert not [x for x in s['issues'] if x['severity']=='error']
          con=sqlite3.connect('resources/knowledge/fx3u_knowledge.sqlite')
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert con.execute('PRAGMA foreign_key_check').fetchall()==[]
          con.close()
          PY
      - name: Run structured knowledge regressions
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_instruction_applicability_rag.py tests/test_structured_knowledge_quality.py
      - name: Record audit summary and refreshed counts in manifest
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          path=Path('resources/knowledge/manifest.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          quality=json.load(open('structured-knowledge-quality-audit.json',encoding='utf-8'))
          alignment=json.load(open('error-record-alignment-audit.json',encoding='utf-8'))
          semantic=json.load(open('error-record-semantic-audit.json',encoding='utf-8'))
          con=sqlite3.connect('resources/knowledge/fx3u_knowledge.sqlite')
          counts={
              'chunks': con.execute('SELECT COUNT(*) FROM chunks').fetchone()[0],
              'chunks_fts': con.execute('SELECT COUNT(*) FROM chunks_fts').fetchone()[0],
              'device_records': con.execute('SELECT COUNT(*) FROM device_records').fetchone()[0],
              'entity_index': con.execute('SELECT COUNT(*) FROM entity_index').fetchone()[0],
              'error_records': con.execute('SELECT COUNT(*) FROM error_records').fetchone()[0],
              'instructions': con.execute('SELECT COUNT(*) FROM instructions').fetchone()[0],
              'instruction_aliases': con.execute('SELECT COUNT(*) FROM instruction_aliases').fetchone()[0],
              'vector_embeddings': con.execute('SELECT COUNT(*) FROM vector_embeddings').fetchone()[0],
          }
          con.close()
          manifest['builder_version']='3.0.3'
          manifest.setdefault('stats',{})['entities']=counts['entity_index']
          manifest.setdefault('structured',{})['devices']=counts['device_records']
          manifest['structured']['errors']=counts['error_records']
          manifest['structured']['instructions']=counts['instructions']
          manifest.setdefault('verification',{}).setdefault('counts',{}).update(counts)
          manifest['structured_knowledge_quality_audit']={
              'method':'generic source-driven audit and repair of device records, error records, and completion flags',
              'source':'stored authoritative page_artifacts/tables plus structured instruction records',
              'baseline_detected':{
                  'operand_position_device_index_overlaps':97,
                  'cross_family_device_ranges':7,
                  'cross_family_device_range_entity_rows':8,
                  'weak_completion_flag_semantics':199,
                  'no_error_row_bleed_records':30,
                  'no_error_range_endpoint_records':2,
              },
              'post_repair_issue_severity_counts':quality['issue_severity_counts'],
              'post_repair_issue_code_counts':quality['issue_code_counts'],
              'device_stats':quality['stats']['device_records'],
              'error_stats':quality['stats']['error_records'],
              'completion_flag_stats':quality['stats']['completion_flags'],
              'error_table_alignment':{
                  'table_backed_records':alignment['table_backed_records'],
                  'aligned_records':alignment['aligned_records'],
                  'semantic_header_tables':alignment['semantic_header_tables'],
                  'issue_severity_counts':alignment['issue_severity_counts'],
                  'issue_code_counts':alignment['issue_code_counts'],
              },
              'error_semantic_audit':{
                  'records':semantic['records'],
                  'no_error_records':semantic['no_error_records'],
                  'issue_severity_counts':semantic['issue_severity_counts'],
                  'issue_code_counts':semantic['issue_code_counts'],
              },
          }
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit repaired corpus and permanent guards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/bootstrap-rebuild-structured-knowledge-quality.yml tools/bootstrap_patch_structured_knowledge_quality.py tools/bootstrap_patch_error_code_ranges.py tools/bootstrap_repair_structured_knowledge_inplace.py
          git rm -f .github/workflows/inspect-completion-flag-contexts.yml .github/workflows/inspect-error-0000-contexts.yml .github/workflows/inspect-error-6311-context.yml .github/workflows/inspect-dszr-m8345-context.yml || true
          git add -A
          git status --short
          git commit -m "fix(rag): clean structured knowledge extraction semantics"
          git push origin HEAD:fix/rejected-json-repair-20260913
