name: Bootstrap structured knowledge quality rebuild

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
    paths: [.github/workflows/bootstrap-rebuild-structured-knowledge-quality.yml]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rejected-json-repair-20260913
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline build dependencies
        run: python -m pip install pypdf pdfplumber numpy pytest
      - name: Patch generic structured knowledge extractors
        run: python tools/bootstrap_patch_structured_knowledge_quality.py
      - name: Smoke test patched entity and completion parsers
        run: |
          python - <<'PY'
          import importlib.util, re
          from types import SimpleNamespace
          spec=importlib.util.spec_from_file_location('builder','tools/build_fx3u_knowledge_v3.py')
          b=importlib.util.module_from_spec(spec); spec.loader.exec_module(b)
          instruction_re=re.compile(r'RBFM|DRVA',re.I)
          text='''[STRUCTURED INSTRUCTION RECORD]\nOPERANDS: M1: unit | M2: buffer | N1: count | N2: points | D1: destination\nD8360-Y003 table cells\n'''
          entities=b.extract_entities(text,instruction_re,chunk_type='instruction')
          for token in ('M1','M2','N1','N2','D1'):
              assert entities[(token,'operand_placeholder')] > 0, (token,entities)
              assert entities[(token,'device')] == 0, (token,entities)
          assert not [key for key in entities if key[1]=='device_range' and key[0]=='D8360-Y003']
          state=b.extract_entities('OUT S123 state relay',instruction_re,chunk_type='instruction')
          assert state[('S123','device')] > 0
          pages=[SimpleNamespace(clean_text='Execution complete flag (M8012). Error flag M8067 turns ON. M8020 Zero flag. M8029 "Instruction execution complete" flag. M8329 "Instruction execution abnormal end" flag.')]
          flags=b.instruction_completion_flags(pages)
          assert 'M8012' in flags and 'M8029' in flags, flags
          assert not {'M8067','M8020','M8329'}.intersection(flags), flags
          print('synthetic entities',entities)
          print('synthetic completion flags',flags)
          PY
          python -m compileall -q tools/build_fx3u_knowledge_v3.py
      - name: Rebuild authoritative and supporting knowledge stores
        run: |
          python tools/build_fx3u_knowledge_v3.py
          python tools/import_design_patterns.py
          python tools/import_gxw2_skill.py
          python tools/tune_gxw2_skill_ranking.py
          python tools/build_dense_embeddings.py
      - name: Evaluate rebuilt retrieval corpus
        env:
          PYTHONPATH: src
        run: python tools/evaluate_rag_benchmark.py --fail-under-recall-10 0.98
      - name: Audit rebuilt structured knowledge
        run: |
          python tools/audit_structured_knowledge_quality.py \
            --database resources/knowledge/fx3u_knowledge.sqlite \
            --output structured-knowledge-quality-audit.json > structured-knowledge-quality-audit.log
          python tools/audit_error_record_alignment.py \
            --database resources/knowledge/fx3u_knowledge.sqlite \
            --output error-record-alignment-audit.json > error-record-alignment-audit.log
          python - <<'PY'
          import json, sqlite3
          q=json.load(open('structured-knowledge-quality-audit.json',encoding='utf-8'))
          a=json.load(open('error-record-alignment-audit.json',encoding='utf-8'))
          print('QUALITY',json.dumps(q['issue_code_counts'],ensure_ascii=False,sort_keys=True))
          print('QUALITY_SEVERITY',json.dumps(q['issue_severity_counts'],ensure_ascii=False,sort_keys=True))
          print('ALIGNMENT',json.dumps(a['issue_code_counts'],ensure_ascii=False,sort_keys=True))
          assert q['integrity_check']=='ok'
          assert q['foreign_key_violations']==0
          forbidden={
              'device_records:cross_family_device_range',
              'completion_flags:weak_completion_semantics',
          }
          assert not forbidden.intersection(q['issue_code_counts']), q['issue_code_counts']
          assert not [x for x in q['issues'] if x['domain']=='error_records' and x['severity']=='error']
          assert not [x for x in a['issues'] if x['severity']=='error']
          con=sqlite3.connect('resources/knowledge/fx3u_knowledge.sqlite')
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert con.execute('PRAGMA foreign_key_check').fetchall()==[]
          con.close()
          PY
      - name: Run structured knowledge regressions
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_instruction_applicability_rag.py tests/test_structured_knowledge_quality.py
      - name: Record audit summary in manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('resources/knowledge/manifest.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          quality=json.load(open('structured-knowledge-quality-audit.json',encoding='utf-8'))
          alignment=json.load(open('error-record-alignment-audit.json',encoding='utf-8'))
          manifest['structured_knowledge_quality_audit']={
              'method':'generic source-driven audit of device records, error records, and completion flags',
              'baseline_detected':{
                  'operand_position_device_index_overlaps':97,
                  'cross_family_device_ranges':7,
                  'weak_completion_flag_semantics':199,
              },
              'post_rebuild_issue_severity_counts':quality['issue_severity_counts'],
              'post_rebuild_issue_code_counts':quality['issue_code_counts'],
              'device_stats':quality['stats']['device_records'],
              'error_stats':quality['stats']['error_records'],
              'completion_flag_stats':quality['stats']['completion_flags'],
              'error_table_alignment':{
                  'table_backed_records':alignment['table_backed_records'],
                  'aligned_records':alignment['aligned_records'],
                  'semantic_header_tables':alignment['semantic_header_tables'],
                  'issue_severity_counts':alignment['issue_severity_counts'],
                  'issue_code_counts':alignment['issue_code_counts'],
              },
          }
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit rebuilt corpus and permanent guards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/bootstrap-rebuild-structured-knowledge-quality.yml tools/bootstrap_patch_structured_knowledge_quality.py
          git rm -f .github/workflows/inspect-completion-flag-contexts.yml .github/workflows/inspect-error-0000-contexts.yml || true
          git add -A
          git status --short
          git commit -m "fix(rag): clean device entities and completion flag semantics"
          git push origin HEAD:fix/rejected-json-repair-20260913
