name: Generation Fast Path Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/application/generation.py'
      - 'src/application/generation_agent.py'
      - 'src/application/generation_context.py'
      - 'src/application/generation_support.py'
      - 'src/application/field_repair.py'
      - 'src/application/format_patch_repair.py'
      - 'src/application/rejected_generation_preview.py'
      - 'src/application/repair_policy.py'
      - 'src/application/delivery.py'
      - 'src/plc/candidate_repair.py'
      - 'src/plc/generation_contract.py'
      - 'src/plc/validation.py'
      - 'src/plc/instructions.py'
      - 'src/plc/ir.py'
      - 'src/plc/specification/approach.py'
      - 'src/plc/specification/bindings.py'
      - 'src/plc/specification/conditions.py'
      - 'src/plc/specification/semantic_validation.py'
      - 'src/agent_runtime/**'
      - 'resources/instructions/**'
      - 'tools/build_fx3u_verified_opcode_overlay.py'
      - 'tools/audit_fx3u_contracts.py'
      - 'tests/test_generation_*.py'
      - 'tests/test_field_patch_repair_protocol.py'
      - 'tests/test_format_patch_repair.py'
      - 'tests/test_hybrid_compact_recovery.py'
      - 'tests/test_user_confirmed_generation_repair.py'
      - 'tests/test_rejected_generation_delivery.py'
      - 'tests/test_instruction_contract_alignment.py'
      - 'tests/test_contract_repair_planner.py'
      - '.github/workflows/generation-fast-path.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generation-fast-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Generation integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: true
      - name: Detect current-push generation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          from="$BEFORE_SHA"
          if [[ -z "$from" || "$from" == "null" || "$from" =~ ^0+$ ]]; then
            from="$BASE_SHA"
          fi
          to="$HEAD_SHA"
          if [[ -z "$to" || "$to" == "null" ]]; then
            to=HEAD
          fi
          git diff --name-only "$from"..."$to" > changed-files.txt
          if grep -Eq '^(src/(application/(generation\.py|generation_agent\.py|generation_context\.py|generation_support\.py|field_repair\.py|format_patch_repair\.py|rejected_generation_preview\.py|repair_policy\.py|delivery\.py)|plc/(candidate_repair\.py|generation_contract\.py|validation\.py|instructions\.py|ir\.py|specification/(approach\.py|bindings\.py|conditions\.py|semantic_validation\.py))|agent_runtime/)|resources/instructions/|tools/(build_fx3u_verified_opcode_overlay|audit_fx3u_contracts)\.py|tests/(test_generation_.*\.py|test_field_patch_repair_protocol\.py|test_format_patch_repair\.py|test_hybrid_compact_recovery\.py|test_user_confirmed_generation_repair\.py|test_rejected_generation_delivery\.py|test_instruction_contract_alignment\.py|test_contract_repair_planner\.py)|\.github/workflows/generation-fast-path\.yml$)' changed-files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile generation paths
        if: steps.scope.outputs.run == 'true'
        run: python -m compileall -q src tests
      - name: Validate generation and repair contracts
        if: steps.scope.outputs.run == 'true'
        run: >-
          python -m pytest -q
          tests/test_instruction_contract_alignment.py
          tests/test_field_patch_repair_protocol.py
          tests/test_format_patch_repair.py
          tests/test_hybrid_compact_recovery.py
          tests/test_generation_fast_path.py
          tests/test_generation_workflow.py
          tests/test_confirmed_generation_regressions.py
          tests/test_generation_repair_workflow.py
          tests/test_generation_rejected_json_repair.py
          tests/test_user_confirmed_generation_repair.py
          tests/test_rejected_generation_delivery.py
          tests/test_generation_delivery.py
          tests/test_contract_repair_planner.py
      - name: Verify generated FX3U instruction overlay
        if: steps.scope.outputs.run == 'true'
        run: python tools/build_fx3u_verified_opcode_overlay.py --check
