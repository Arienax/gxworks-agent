name: Verify FX3U batch contract candidate
on:
  pull_request:
    paths: ['.contract-source/**', '.github/workflows/contract-source-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/prompt-cleanup-io-binding-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      HAYSTACK_TELEMETRY_ENABLED: 'false'
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact candidate and regenerate the source-backed ledger
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess, sys
          from pathlib import Path, PurePosixPath
          encoded = ''.join(''.join(path.read_text().split()) for path in sorted(Path('.contract-source').glob('*.b64')))
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '18cf975ccea3947bbe871eabb18df44ca90a0c409876e5071bb8103c318b454c'
          data = json.loads(raw)
          assert data['base_commit'] == '728086895be6f7995706593194c7fdadc87be7da'
          subprocess.run(['git','merge-base','--is-ancestor',data['base_commit'],'HEAD'],check=True)
          for row in data['files']:
              name = row['path']
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              if row['before'] is None:
                  assert not Path(name).exists(), name
              else:
                  assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == row['before'], name
          def apply(patch):
              subprocess.run(['git','apply','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','-'],input=patch,check=True)
          apply(data['patch'].encode('utf-8'))
          subprocess.run([sys.executable,'tools/audit_fx3u_contracts.py','--promote'],check=True)
          for row in data['files']:
              assert hashlib.sha256(Path(row['path']).read_bytes()).hexdigest() == row['after'], row['path']
          auditor = Path('tools/audit_fx3u_contracts.py')
          content = auditor.read_text(encoding='utf-8')
          assert content.count('.read_text()') == 2
          auditor.write_text(content.replace('.read_text()', '.read_text(encoding="utf-8")'), encoding='utf-8')
          final_hash = '03a352e9f6222282a516f6479214a6cb24c604d72b55e0c9012c2309fe900bd5'
          assert hashlib.sha256(auditor.read_bytes()).hexdigest() == final_hash
          next(row for row in data['files'] if row['path'] == auditor.as_posix())['after'] = final_hash
          corrections = {
              'src/plc/instructions.py': ('c65ba7e1fa261a3954d7a063ea0ae3dc5cd1a5c5e99825d09c038c8c04f46221','56b8ee384940974cb28ec57f7a5c41016662d62bcff2db86b559c35bf255e255'),
              'tools/audit_fx3u_contracts.py': ('03a352e9f6222282a516f6479214a6cb24c604d72b55e0c9012c2309fe900bd5','12620022940f07e17eb0712a1c316eb5dc1a5894ad060f66c67cdbca2668ae86'),
              'tests/test_instruction_contract_alignment.py': ('77b3456b2b37ff8a7b153e939d2945d27d456b3ded3f91726882bb31552d25d5','33a9d0fe103af987fe8a5475144a50cd8eac7fa887ba7b020a252120fcb517dc'),
              'docs/architecture/instruction-contract-coverage.md': ('a7f7af6c44c279f7494de0a47ec6088aa648d5a6144af8addc34343d52f71ad1','866f01e847d27184210aa91d321e5ee3f16b98f56f007b3c2f907d83ef17e9c7'),
          }
          for name, (before, after) in corrections.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == before, name
          apply(Path('.contract-source/followup.patch').read_bytes())
          for name, (before, after) in corrections.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == after, name
              next(row for row in data['files'] if row['path'] == name)['after'] = after
          subprocess.run(['git','rm','-r','--','.contract-source','.github/workflows/contract-source-verify.yml'],check=True)
          Path(os.environ['RUNNER_TEMP'],'contract-candidate.json').write_text(json.dumps(data),encoding='utf-8')
          PY
      - name: Install actual runtime and offline evaluation tools
        run: |
          python -m pip install -r requirements.txt
          npm install --prefix "$RUNNER_TEMP/context-eval" --no-audit --no-fund promptfoo@0.123.1
      - name: Test source audit, all promoted forms, shared adapters and compatibility
        run: >-
          python -m pytest -q
          tests/test_instruction_contract_alignment.py tests/test_instruction_registry.py
          tests/test_zrst_registry_alignment.py tests/test_field_patch_repair_protocol.py
          tests/test_format_patch_repair.py tests/test_call_contract_regressions.py
          tests/test_generation_agent_boundary.py tests/test_motion_control_regressions.py
          tests/test_plc_ir.py tests/test_plc_semantics.py tests/test_instruction_fact_context.py
          tests/test_agent_b_measurement.py tests/test_analysis_prompt_routing.py
          tests/test_architecture_boundaries.py tests/test_source_layout.py
          --junitxml=validation-contracts/targeted.xml
      - name: Reproduce the full coverage report and offline replay
        run: |
          python tools/audit_fx3u_contracts.py --check --report validation-contracts/coverage.json
          python scripts/context_replay.py --output validation-contracts/replay.json
          "$RUNNER_TEMP/context-eval/node_modules/.bin/promptfoo" eval -c evals/context-replay/promptfooconfig.yaml --no-cache -o validation-contracts/promptfoo.json
      - name: Record the complete suite including existing baseline failures
        continue-on-error: true
        run: python -m pytest -q --junitxml=validation-contracts/full.xml > validation-contracts/full.log 2>&1
      - name: Publish tested source blobs without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          data = json.loads(Path(os.environ['RUNNER_TEMP'],'contract-candidate.json').read_text())
          elements = []
          for row in data['files']:
              name = row['path']
              content = Path(name).read_bytes()
              assert hashlib.sha256(content).hexdigest() == row['after'], name
              expected = hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',method='POST',data=json.dumps({'encoding':'base64','content':base64.b64encode(content).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response:
                  actual = json.load(response)['sha']
              assert actual == expected, name
              elements.append({'path':name,'mode':'100644','type':'blob','sha':actual})
          manifest = {'base_commit':data['base_commit'],'verification_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':data['files'],'tree_elements':elements}
          Path('validation-contracts/verified-blobs.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fx3u-contract-verification
          path: validation-contracts
          retention-days: 7
