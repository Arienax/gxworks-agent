name: Promote semantic structured quality audit

on:
  push:
    branches: [fix/rejected-json-repair-20260913]
    paths:
      - .github/workflows/promote-semantic-structured-quality-audit.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out triggering commit with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Promote evidence-aware logic into canonical audit
        run: |
          python - <<'PY'
          from pathlib import Path

          audit_path = Path('tools/audit_structured_knowledge_quality.py')
          text = audit_path.read_text(encoding='utf-8')
          marker = 'placeholder_warnings_suppressed_by_concrete_evidence'
          if marker not in text:
              old_import = 'from typing import Any\n'
              new_import = (
                  'from typing import Any\n\n'
                  'from audit_device_placeholder_evidence import ('
                  'TOKEN_BOUNDARY, occurrence_signals, token_source_pattern)\n'
              )
              assert old_import in text
              text = text.replace(old_import, new_import, 1)
              old_def = 'def audit_devices(con: sqlite3.Connection):\n'
              new_def = 'def _audit_devices_structural(con: sqlite3.Connection):\n'
              assert text.count(old_def) == 1
              text = text.replace(old_def, new_def, 1)

              semantic = r'''
_REAL_DEVICE_SIGNAL_NAMES = {
    "concrete_instruction_use",
    "concrete_range_use",
    "pointer_or_label_use",
    "example_semantics",
}


def has_concrete_device_evidence(
    connection: sqlite3.Connection,
    device_norm: str,
    record_type: str,
    token: str,
) -> bool:
    """Return whether this exact token has concrete PLC address/pointer evidence.

    The broad S/D/N/M/P-number heuristic remains useful only for candidate
    discovery. Final warning emission is occurrence-local and provenance-aware.
    N<number> is never accepted as a device family: N is operand/count syntax or
    MC/MCR nesting semantics and belongs outside ``device_records``.
    """
    token = normalize(token).upper()
    prefix_match = re.match(r"[A-Z]+", token)
    prefix = prefix_match.group(0) if prefix_match else ""
    if prefix == "N":
        return False

    pattern = re.compile(
        rf"(?<!{TOKEN_BOUNDARY}){token_source_pattern(token)}(?!{TOKEN_BOUNDARY})",
        re.I,
    )
    rows = connection.execute(
        """
        SELECT c.text
        FROM entity_index e
        JOIN chunks c ON c.id=e.chunk_id
        WHERE e.entity_norm=? AND e.entity_type=?
        """,
        (device_norm, record_type),
    ).fetchall()
    for (raw_text,) in rows:
        source = str(raw_text or "")
        for match in pattern.finditer(source):
            line_start = source.rfind("\n", 0, match.start()) + 1
            line_end = source.find("\n", match.end())
            if line_end < 0:
                line_end = len(source)
            line = source[line_start:line_end]
            # PDF instruction-size tables can flatten ``D | 17 steps`` to
            # ``D 17 steps``. That spelling is not device D17 evidence.
            if re.search(rf"{re.escape(match.group(0))}\s+steps\b", line, re.I):
                continue
            signals = occurrence_signals(token, source, match)
            if any(signals.get(name) for name in _REAL_DEVICE_SIGNAL_NAMES):
                return True
    return False


def audit_devices(con: sqlite3.Connection):
    """Run structural checks, then semantically adjudicate placeholder candidates."""
    issues, stats = _audit_devices_structural(con)
    kept = []
    suppressed = 0
    for item in issues:
        if item.get("code") != "possible_operand_placeholder_device_record":
            kept.append(item)
            continue
        row = con.execute(
            "SELECT device_norm,record_type FROM device_records WHERE id=?",
            (item.get("id"),),
        ).fetchone()
        if row and has_concrete_device_evidence(
            con,
            str(row[0]),
            str(row[1]),
            str(item.get("device", "")),
        ):
            suppressed += 1
            continue
        kept.append(item)

    stats = dict(stats)
    stats["placeholder_like_device_records"] = sum(
        1
        for item in kept
        if item.get("code") == "possible_operand_placeholder_device_record"
    )
    stats["placeholder_warnings_suppressed_by_concrete_evidence"] = suppressed
    return kept, stats

'''
              insert_before = '\ndef field_quality('
              assert text.count(insert_before) == 1
              text = text.replace(insert_before, '\n' + semantic + 'def field_quality(', 1)
              text = text.replace(
                  '"""Audit device records, error records, and instruction completion flags."""',
                  '"""Evidence-aware audit of structured PLC knowledge quality."""',
                  1,
              )
              audit_path.write_text(text, encoding='utf-8', newline='\n')

          workflow_path = Path('.github/workflows/audit-structured-knowledge-quality.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace(
              '      - tools/audit_structured_knowledge_quality_v2.py\n',
              '',
          )
          workflow = workflow.replace(
              'python tools/audit_structured_knowledge_quality_v2.py',
              'python tools/audit_structured_knowledge_quality.py',
          )
          workflow = workflow.replace(
              '          ref: fix/rejected-json-repair-20260913\n',
              '',
          )
          gate_anchor = "          assert not [item for item in report['issues'] if item['severity'] == 'error']\n"
          semantic_gate = """          assert not [item for item in report['issues'] if item['severity'] == 'error']
          device_placeholder_warnings = [
              item for item in report['issues']
              if item.get('code') == 'possible_operand_placeholder_device_record'
          ]
          unresolved_device_evidence = [
              item for item in evidence['candidates']
              if item.get('suggested_class') in {'ambiguous', 'operand_placeholder_likely'}
          ]
          assert device_placeholder_warnings == [], device_placeholder_warnings
          assert unresolved_device_evidence == [], unresolved_device_evidence
          assert report['stats']['device_records']['placeholder_like_device_records'] == 0
"""
          if 'unresolved_device_evidence' not in workflow:
              assert workflow.count(gate_anchor) == 1
              workflow = workflow.replace(gate_anchor, semantic_gate, 1)
          workflow_path.write_text(workflow, encoding='utf-8', newline='\n')

          rebuild_path = Path('.github/workflows/rebuild-device-entity-cleanup.yml')
          rebuild = rebuild_path.read_text(encoding='utf-8')
          rebuild = rebuild.replace(
              'tools/audit_structured_knowledge_quality_v2.py',
              'tools/audit_structured_knowledge_quality.py',
          )
          rebuild_path.write_text(rebuild, encoding='utf-8', newline='\n')

          test_path = Path('tests/test_structured_knowledge_quality.py')
          tests = test_path.read_text(encoding='utf-8')
          test_name = 'test_primary_structured_quality_audit_uses_semantic_device_evidence'
          if test_name not in tests:
              tests += r'''


def test_primary_structured_quality_audit_uses_semantic_device_evidence(tmp_path):
    import subprocess
    import sys

    root = Path(__file__).resolve().parents[1]
    output = tmp_path / "structured-quality.json"
    subprocess.run(
        [
            sys.executable,
            str(root / "tools" / "audit_structured_knowledge_quality.py"),
            "--database",
            str(_database()),
            "--output",
            str(output),
        ],
        cwd=root,
        check=True,
        capture_output=True,
        text=True,
    )
    report = json.loads(output.read_text(encoding="utf-8"))
    device_stats = report["stats"]["device_records"]
    unresolved = [
        item
        for item in report["issues"]
        if item.get("code") == "possible_operand_placeholder_device_record"
    ]
    assert unresolved == []
    assert device_stats["placeholder_like_device_records"] == 0
    assert device_stats["placeholder_warnings_suppressed_by_concrete_evidence"] == 29
'''
              test_path.write_text(tests, encoding='utf-8', newline='\n')

          v2 = Path('tools/audit_structured_knowledge_quality_v2.py')
          if v2.exists():
              v2.unlink()

          assert 'audit_structured_knowledge_quality_v2.py' not in workflow_path.read_text(encoding='utf-8')
          assert 'audit_structured_knowledge_quality_v2.py' not in rebuild_path.read_text(encoding='utf-8')
          PY
          python -m py_compile tools/audit_structured_knowledge_quality.py tools/audit_device_placeholder_evidence.py
          git diff --check
          git status --short

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run cleanup and structured-quality regressions
        run: |
          python -m pytest -q \
            tests/test_device_entity_cleanup.py \
            tests/test_structured_knowledge_quality.py

      - name: Run canonical semantic audit against persisted LFS database
        run: |
          python tools/audit_structured_knowledge_quality.py \
            --database resources/knowledge/fx3u_knowledge.sqlite \
            --output /tmp/canonical-structured-quality.json > /tmp/canonical-structured-quality.log
          python tools/audit_device_placeholder_evidence.py \
            --database resources/knowledge/fx3u_knowledge.sqlite \
            --output /tmp/canonical-device-evidence.json > /tmp/canonical-device-evidence.log
          python - <<'PY'
          import json
          report = json.load(open('/tmp/canonical-structured-quality.json', encoding='utf-8'))
          evidence = json.load(open('/tmp/canonical-device-evidence.json', encoding='utf-8'))
          errors = [item for item in report['issues'] if item.get('severity') == 'error']
          placeholder = [
              item for item in report['issues']
              if item.get('code') == 'possible_operand_placeholder_device_record'
          ]
          unresolved = [
              item for item in evidence['candidates']
              if item.get('suggested_class') in {'ambiguous', 'operand_placeholder_likely'}
          ]
          stats = report['stats']['device_records']
          print('SEVERITY', json.dumps(report['issue_severity_counts'], sort_keys=True))
          print('CODES', json.dumps(report['issue_code_counts'], sort_keys=True))
          print('DEVICE_STATS', json.dumps(stats, sort_keys=True))
          print('EVIDENCE_CLASSES', json.dumps(evidence['suggested_class_counts'], sort_keys=True))
          assert report['integrity_check'] == 'ok'
          assert report['foreign_key_violations'] == 0
          assert errors == [], errors[:20]
          assert placeholder == [], placeholder
          assert unresolved == [], unresolved
          assert stats['placeholder_like_device_records'] == 0
          assert stats['placeholder_warnings_suppressed_by_concrete_evidence'] == 29
          assert evidence['candidate_count'] == 29
          PY

      - name: Refuse to overwrite concurrent branch changes
        run: |
          git fetch origin refs/heads/fix/rejected-json-repair-20260913
          remote_sha="$(git rev-parse FETCH_HEAD)"
          test "$remote_sha" = "$GITHUB_SHA" || {
            echo "Branch moved during semantic-audit promotion: trigger=$GITHUB_SHA remote=$remote_sha" >&2
            exit 1
          }

      - name: Commit and push canonical semantic audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/audit_structured_knowledge_quality.py \
            tools/audit_structured_knowledge_quality_v2.py \
            tests/test_structured_knowledge_quality.py \
            .github/workflows/audit-structured-knowledge-quality.yml \
            .github/workflows/rebuild-device-entity-cleanup.yml
          git commit -m "refactor(rag): make structured quality audit evidence-aware"
          git push origin HEAD:refs/heads/fix/rejected-json-repair-20260913

      - uses: actions/upload-artifact@v4
        with:
          name: canonical-semantic-structured-quality-audit
          path: |
            /tmp/canonical-structured-quality.json
            /tmp/canonical-structured-quality.log
            /tmp/canonical-device-evidence.json
            /tmp/canonical-device-evidence.log
          if-no-files-found: error
