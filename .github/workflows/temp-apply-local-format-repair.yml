name: Temporary Apply Local Format Repair
on:
  push:
    branches: [feat/comprehensive-runtime-diagnostics-20260914]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded source migration
        run: python tools/temp_apply_local_format_repair.py
      - name: Remove temporary migration machinery
        run: git rm tools/temp_apply_local_format_repair.py .github/workflows/temp-apply-local-format-repair.yml
      - name: Commit migration
        run: |
          git config user.name "gxworks-agent-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/api.py src/application/workbench.py web/src/App.tsx tests/test_user_confirmed_generation_repair.py
          git commit -m "fix(repair): keep format repair local and renderable"
          git push origin HEAD:feat/comprehensive-runtime-diagnostics-20260914
