name: Patch repair opcode contract

on:
  push:
    branches: [fix/prompt-context-slim-20260913]
    paths:
      - tools/patch_repair_opcode_contract_once.py
      - .github/workflows/patch-repair-opcode-contract.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt-context-slim-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture branch head
        shell: bash
        run: echo "$(git rev-parse HEAD)" > /tmp/start_sha
      - name: Apply repair opcode contract
        run: python tools/patch_repair_opcode_contract_once.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements/web.txt
      - name: Validate focused repair and schema paths
        shell: bash
        run: |
          python -m compileall -q src tests
          python -m pytest -q \
            tests/test_user_confirmed_generation_repair.py \
            tests/test_generation_repair_workflow.py \
            tests/test_generation_workflow.py \
            tests/test_generation_opcode_contract.py \
            tests/test_instruction_registry.py \
            tests/test_prompt_context_budget.py
          git diff --check
      - name: Refuse concurrent overwrite
        shell: bash
        run: |
          git fetch origin fix/prompt-context-slim-20260913
          test "$(git rev-parse origin/fix/prompt-context-slim-20260913)" = "$(cat /tmp/start_sha)"
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api.py tests/test_user_confirmed_generation_repair.py
          git diff --cached --check
          git commit -m "fix(repair): give local repair the opcode contract"
          git push origin HEAD:fix/prompt-context-slim-20260913
